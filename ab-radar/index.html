<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Радар АБ — 3 варианта сервиса для АБ-тестов и тиража</title>
<style>
:root {
  color-scheme: light;
  --bg: #f3f3f0;
  --surface: #ffffff;
  --surface-2: #fafaf8;
  --surface-3: #f0efec;
  --ink: #141413;
  --ink-2: #52514e;
  --muted: #898781;
  --line: #e6e5df;
  --line-2: #d3d2ca;
  --ring: rgba(11, 11, 11, 0.10);
  --accent: #1c5cab;
  --accent-wash: #edf3fb;

  --st-prep: #898781;
  --st-release: #6250d6;
  --st-enabling: #eda100;
  --st-collecting: #2a78d6;
  --st-ready: #eb6834;
  --st-rollout: #1baf7a;
  --st-cleanup: #008300;
  --st-done: #c3c2b7;

  --crit: #d03b3b;
  --serious: #ec835a;
  --warn: #fab219;
  --good: #0ca30c;
  --info: #2a78d6;
  --good-text: #006300;

  --r: 12px;
  --r-sm: 8px;
  --shadow: 0 1px 2px rgba(20, 20, 19, .05), 0 0 0 1px var(--ring);
  --shadow-lg: 0 12px 40px rgba(20, 20, 19, .16), 0 0 0 1px var(--ring);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h1 { font-size: 24px; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 12px; }
.tnum { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.sp { flex: 1; }
.hidden { display: none !important; }

/* ---------- demo bar (навигация по концептам, не часть продукта) ---------- */
.demo-bar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  padding: 0 20px; height: 48px;
  background: #1b1b1a; color: #f0efec;
  font-size: 13px;
}
.demo-bar .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; white-space: nowrap; }
.demo-bar .brand small { font-weight: 400; color: #a9a8a0; }
.demo-tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.demo-tabs a {
  color: #c9c8c0; padding: 6px 12px; border-radius: 8px; white-space: nowrap; text-decoration: none;
}
.demo-tabs a:hover { background: #2c2c2a; color: #fff; }
.demo-tabs a.active { background: #f0efec; color: #141413; font-weight: 600; }
.demo-tabs a b { font-weight: 600; opacity: .55; margin-right: 4px; }
.demo-bar .today { margin-left: auto; color: #a9a8a0; white-space: nowrap; }

/* ---------- app chrome ---------- */
.app-head {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 28px; background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.logo-mark {
  width: 28px; height: 28px; border-radius: 8px; background: #141413; color: #fff;
  display: grid; place-items: center; font-size: 13px; font-weight: 700;
}
.team-pick {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2);
  font-size: 13px; cursor: pointer;
}
.search {
  display: flex; align-items: center; gap: 8px; padding: 7px 12px; min-width: 260px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--muted);
}
.search input { border: 0; outline: 0; background: transparent; font: inherit; color: var(--ink); width: 100%; }
.page { padding: 24px 28px 64px; max-width: 1440px; margin: 0 auto; }
.page-title { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; }
.page-title .sub { color: var(--ink-2); margin-top: 4px; }

/* ---------- buttons, chips ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--line-2); background: var(--surface); cursor: pointer;
  font-size: 13px; font-weight: 550; white-space: nowrap;
}
.btn:hover { background: var(--surface-3); }
.btn.primary { background: #141413; border-color: #141413; color: #fff; }
.btn.primary:hover { background: #2e2e2c; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--ink); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
.btn.link { border: 0; background: none; color: var(--accent); padding: 0; height: auto; }
.btn.link:hover { text-decoration: underline; background: none; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px;
  border-radius: 6px; background: var(--surface-3); color: var(--ink-2);
  font-size: 12px; font-weight: 500; white-space: nowrap;
}
.chip.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
.chip .dot, .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; display: inline-block; }
.stage-chip { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); }
.plat { font-size: 12px; color: var(--ink-2); }

.avatar {
  width: 24px; height: 24px; border-radius: 50%; flex: 0 0 24px;
  display: inline-grid; place-items: center; font-size: 10px; font-weight: 650;
  background: var(--surface-3); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line);
}
.avatar.lg { width: 32px; height: 32px; flex-basis: 32px; font-size: 12px; }

.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--surface-3); gap: 2px; }
.seg button {
  border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; cursor: pointer;
  font-size: 13px; color: var(--ink-2); font-weight: 500; white-space: nowrap;
}
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--ring); }
.seg button .cnt { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }

select.sel {
  height: 32px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface);
  padding: 0 28px 0 10px; font: inherit; font-size: 13px; color: var(--ink);
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px; background-size: 5px 5px; background-repeat: no-repeat;
}
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--ink-2); user-select: none; }
.toggle i {
  width: 30px; height: 18px; border-radius: 9px; background: var(--line-2); position: relative; transition: background .15s;
}
.toggle i::after {
  content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s;
}
.toggle.on i { background: #141413; }
.toggle.on i::after { left: 14px; }

/* ---------- severity ---------- */
.sev { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; flex: 0 0 20px; }
.sev svg { width: 14px; height: 14px; }
.sev.crit { background: #fbe9e9; color: var(--crit); }
.sev.serious { background: #fdeee7; color: #c4552b; }
.sev.warn { background: #fef4dc; color: #8a5d00; }
.sev.info { background: #e9f1fb; color: #1c5cab; }
.sev.good { background: #e5f5e5; color: var(--good-text); }
.sev-label { font-size: 12px; font-weight: 600; }
.sev-label.crit { color: var(--crit); }
.sev-label.serious { color: #b4501f; }
.sev-label.warn { color: #8a5d00; }
.sev-label.info { color: #1c5cab; }
.sev-label.good { color: var(--good-text); }

/* ---------- cards & tiles ---------- */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.card-h h3 { font-size: 14px; }
.card-b { padding: 0 16px 16px; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile {
  background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px;
  cursor: pointer; text-align: left; border: 0; display: flex; flex-direction: column; gap: 6px; position: relative;
}
.tile:hover { box-shadow: 0 0 0 1px var(--line-2), 0 2px 8px rgba(0,0,0,.06); }
.tile.on { box-shadow: 0 0 0 2px #141413; }
.tile .lbl { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.tile .val { font-size: 30px; font-weight: 650; line-height: 1.1; letter-spacing: -0.02em; }
.tile .foot { font-size: 12px; color: var(--muted); }
.tile .foot b { color: var(--crit); font-weight: 600; }

/* ---------- block matrix ---------- */
.bm { display: inline-grid; gap: 2px; grid-auto-flow: column; align-items: center; }
.bm .c {
  height: 22px; min-width: 30px; padding: 0 3px; border-radius: 4px; font-size: 10px; font-weight: 600;
  display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted);
  background: var(--surface); font-variant-numeric: tabular-nums; cursor: default;
}
.bm .c.ab { background: var(--st-collecting); color: #fff; box-shadow: none; }
.bm .c.on { background: var(--st-cleanup); color: #fff; box-shadow: none; }
.bm .c.pause { background: var(--surface-3); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.bm .c.plan {
  color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-2);
  background: repeating-linear-gradient(45deg, #ecebe6 0 2px, #fafaf8 2px 6px);
}
.bm .c.gap { box-shadow: none; background: none; min-width: 6px; padding: 0; }
.bm .hd { font-size: 10px; color: var(--muted); text-align: center; font-weight: 600; min-width: 30px; }
.bm-grid { display: grid; gap: 2px 2px; align-items: center; }
.bm-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); }
.bm-legend span { display: inline-flex; align-items: center; gap: 6px; }
.bm-legend i { width: 14px; height: 12px; border-radius: 3px; display: inline-block; box-shadow: inset 0 0 0 1px var(--line); }
.bm-legend i.ab { background: var(--st-collecting); box-shadow: none; }
.bm-legend i.on { background: var(--st-cleanup); box-shadow: none; }
.bm-legend i.pause { background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line-2); }
.bm-legend i.plan { background: repeating-linear-gradient(45deg, #ecebe6 0 2px, #fafaf8 2px 5px); box-shadow: inset 0 0 0 1px var(--line-2); }

.mini-bm { display: inline-flex; gap: 2px; align-items: center; }
.mini-bm i { width: 8px; height: 8px; border-radius: 2px; display: block; background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line-2); }
.mini-bm i.ab { background: var(--st-collecting); box-shadow: none; }
.mini-bm i.on { background: var(--st-cleanup); box-shadow: none; }
.mini-bm i.pause { background: #dcdbd4; box-shadow: none; }
.mini-bm i.plan { background: repeating-linear-gradient(45deg, #c9c8c0 0 1px, #f4f4f1 1px 3px); box-shadow: inset 0 0 0 1px var(--line-2); }
.mini-bm i.sep { width: 3px; background: none; box-shadow: none; }

/* ---------- meters ---------- */
.meter { height: 6px; border-radius: 3px; background: #dbe8f8; overflow: hidden; position: relative; }
.meter > b { display: block; height: 100%; background: var(--st-collecting); border-radius: 3px; }
.meter.ready { background: #fbe3d8; }
.meter.ready > b { background: var(--st-ready); }
.meter.over { background: #f6d9d9; }
.meter.over > b { background: var(--crit); }
.meter .tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #141413; border-radius: 1px; }
.meter-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-2); }
.meter-row .meter { flex: 1; }

/* ---------- segmented split bar ---------- */
.split { display: flex; gap: 2px; height: 28px; }
.split > div {
  border-radius: 4px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 600; color: #fff;
  min-width: 0; overflow: hidden; white-space: nowrap;
}
.split > div.dk { color: #0b0b0b; }

/* ---------- tables ---------- */
table.t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
table.t th {
  text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 10px 12px;
  border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap;
}
table.t td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr.clickable:hover td { background: #fbfbf9; cursor: pointer; }

/* ---------- drawer (паспорт) ---------- */
.scrim { position: fixed; inset: 0; background: rgba(20, 20, 19, .28); z-index: 80; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(880px, 96vw); z-index: 90;
  background: var(--bg); box-shadow: var(--shadow-lg); transform: translateX(104%); transition: transform .25s ease;
  display: flex; flex-direction: column;
}
.drawer.open { transform: none; }
.drawer-head { background: var(--surface); padding: 18px 24px 16px; border-bottom: 1px solid var(--line); }
.drawer-body { overflow-y: auto; padding: 18px 24px 48px; display: flex; flex-direction: column; gap: 14px; }
.drawer .x { position: absolute; top: 12px; right: 14px; }
.drawer h2 { font-size: 20px; line-height: 1.25; padding-right: 40px; }
.conv-name {
  margin-top: 10px; display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px;
  background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; color: var(--ink-2);
}
.conv-name code { font-family: var(--mono); font-size: 11.5px; color: var(--ink); flex: 1; word-break: break-word; }
.sec { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.sec > h3 { margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.sec > h3 .sp { flex: 1; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 8px 16px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* stepper */
.stepper { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.step { display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; color: var(--muted); }
.step .bar { height: 6px; border-radius: 3px; background: var(--surface-3); }
.step.done .bar { background: #b8b7af; }
.step.cur .bar { background: var(--c); }
.step.cur { color: var(--ink); font-weight: 600; }
.step.done { color: var(--ink-2); }
.step small { font-weight: 400; color: var(--muted); }

/* journal */
.journal { display: flex; flex-direction: column; }
.jrow { display: grid; grid-template-columns: 84px 18px 1fr; gap: 8px; padding: 6px 0; font-size: 13px; }
.jrow .jd { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; }
.jrow .jdot { display: flex; justify-content: center; position: relative; }
.jrow .jdot::before { content: ''; position: absolute; top: 0; bottom: -12px; width: 2px; background: var(--line); }
.jrow:last-child .jdot::before { display: none; }
.jrow .jdot i { position: relative; width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: var(--muted); box-shadow: 0 0 0 2px var(--surface); }
.jrow.future { opacity: .75; }
.jrow.future .jdot i { background: var(--surface); box-shadow: 0 0 0 2px var(--surface), inset 0 0 0 2px var(--muted); }
.jrow .jtxt .sd { font-family: var(--mono); font-size: 11.5px; color: var(--accent); margin-left: 6px; }
.jrow .jtxt .blk { color: var(--ink-2); }

/* alert list (shared) */
.alert {
  display: flex; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line); align-items: flex-start;
}
.alert .a-body { flex: 1; min-width: 0; }
.alert .a-title { font-weight: 600; }
.alert .a-sub { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.alert .a-meta { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.alert .a-act { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
.alert.crit { box-shadow: inset 3px 0 0 var(--crit), inset 0 0 0 1px var(--line); }
.alert.serious { box-shadow: inset 3px 0 0 var(--serious), inset 0 0 0 1px var(--line); }
.alert.warn { box-shadow: inset 3px 0 0 var(--warn), inset 0 0 0 1px var(--line); }

/* forest plot */
.forest { width: 100%; }
.forest-row { display: grid; grid-template-columns: 220px 64px 1fr 170px; gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.forest-row:last-child { border-bottom: 0; }
.forest-row.head { font-size: 12px; color: var(--muted); font-weight: 600; }
.forest-plot { position: relative; height: 22px; }
.forest-plot .zero { position: absolute; top: -6px; bottom: -6px; width: 1px; background: var(--line-2); }
.forest-plot .thr { position: absolute; top: -6px; bottom: -6px; width: 2px; background: #e66767; opacity: .6; }
.forest-plot .ci { position: absolute; top: 10px; height: 2px; border-radius: 1px; }
.forest-plot .pt { position: absolute; top: 6px; width: 10px; height: 10px; border-radius: 50%; margin-left: -5px; box-shadow: 0 0 0 2px var(--surface); }

/* modal */
.modal-wrap { position: fixed; inset: 0; z-index: 120; display: none; place-items: center; background: rgba(20,20,19,.32); }
.modal-wrap.open { display: grid; }
.modal { width: min(620px, 94vw); max-height: 90vh; overflow-y: auto; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); }
.modal-h { padding: 18px 20px 6px; display: flex; gap: 10px; align-items: flex-start; }
.modal-b { padding: 8px 20px 4px; display: flex; flex-direction: column; gap: 14px; }
.modal-f { padding: 16px 20px 18px; display: flex; gap: 8px; justify-content: flex-end; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.field input[type=text], .field textarea, .field input[type=date] {
  font: inherit; font-size: 13px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
}
.field textarea { min-height: 64px; resize: vertical; }
.opt-list { display: flex; flex-direction: column; gap: 6px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 9px; cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--line); font-size: 13px;
}
.opt:hover { background: var(--surface-2); }
.opt input { margin-top: 3px; }
.opt.sel { box-shadow: inset 0 0 0 2px #141413; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-2); }
.check input { margin-top: 3px; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); z-index: 200;
  background: #141413; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px;
  box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: all .2s; display: flex; gap: 8px; align-items: center;
}
.toast.show { opacity: 1; transform: translateX(-50%); }

/* tooltip */
.tip {
  position: fixed; z-index: 300; pointer-events: none; background: #141413; color: #f0efec;
  padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; max-width: 300px;
  box-shadow: 0 4px 16px rgba(0,0,0,.2); opacity: 0; transition: opacity .1s;
}
.tip.show { opacity: 1; }
.tip b { color: #fff; }
.tip .tmuted { color: #a9a8a0; }

/* ---------- generic layout helpers ---------- */
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr); gap: 20px; align-items: start; }
.section-label { font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
.section-label .cnt { color: var(--ink-2); background: var(--surface-3); border-radius: 10px; padding: 0 7px; font-size: 11px; letter-spacing: 0; }

const WD = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return a; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b; return c; };
const dn = (n) => `${n} ${plural(n, 'день', 'дня', 'дней')}`;
const rel = (d) => {
  if (!d) return '';
  const n = days(TODAY, d);
  if (n === 0) return 'сегодня';
  if (n === 1) return 'завтра';
  if (n === -1) return 'вчера';
  return n > 0 ? `через ${dn(n)}` : `${dn(-n)} назад`;
};
const num = (v) => { const d = Math.min(2, Math.max(1, (String(v).split('.')[1] || '').length)); return Math.abs(v).toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d }); };
const sgn = (v) => `${v > 0 ? '+' : v < 0 ? '−' : ''}${num(v)}`;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const initials = (n) => n.split(/\s+/).map((p) => p[0]).join('').slice(0, 2).toUpperCase();
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const STAGE = Object.fromEntries(STAGES.map((s, i) => [s.k, { ...s, i }]));
const SEV_ORDER = { crit: 0, serious: 1, warn: 2, good: 3, info: 4 };
const SEV_NAME = { crit: 'Критично', serious: 'Важно', warn: 'Внимание', good: 'Можно действовать', info: 'К сведению' };

/* ---------- иконки ---------- */
const ICON = {
  crit: '<svg viewBox="0 0 16 16" fill="none"><path d="M8 4.5v4.2M8 11.2v.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  serious: '<svg viewBox="0 0 16 16" fill="none"><path d="M8 3.5 13.5 12.5h-11L8 3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 7.2v2.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  warn: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.2" stroke="currentColor" stroke-width="1.6"/><path d="M8 5.5V8l1.8 1.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  info: '<svg viewBox="0 0 16 16" fill="none"><path d="M8 7.3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="4.8" r="1.1" fill="currentColor"/></svg>',
  good: '<svg viewBox="0 0 16 16" fill="none"><path d="m4 8.3 2.6 2.6L12 5.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x: '<svg viewBox="0 0 16 16" width="16" height="16" fill="none"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  copy: '<svg viewBox="0 0 16 16" width="14" height="14" fill="none"><rect x="5" y="5" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M3 10V4a1 1 0 0 1 1-1h6" stroke="currentColor" stroke-width="1.4"/></svg>',
  search: '<svg viewBox="0 0 16 16" width="15" height="15" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  ext: '<svg viewBox="0 0 16 16" width="12" height="12" fill="none"><path d="M9 3h4v4M13 3 7.5 8.5M11 9.5V13H3V5h3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chev: '<svg viewBox="0 0 16 16" width="12" height="12" fill="none"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bell: '<svg viewBox="0 0 16 16" width="15" height="15" fill="none"><path d="M4 11V7a4 4 0 0 1 8 0v4l1 1.2H3L4 11Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.5 13.6a1.6 1.6 0 0 0 3 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  plus: '<svg viewBox="0 0 16 16" width="14" height="14" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  flag: '<svg viewBox="0 0 16 16" width="12" height="12" fill="none"><path d="M4 14V2.5M4 3h7l-1.5 2.5L11 8H4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
};
const sevIcon = (sev) => `<span class="sev ${sev}" title="${SEV_NAME[sev]}">${ICON[sev]}</span>`;

/* ---------- производные поля ---------- */
const ALL_BLOCKS = BLOCKS;

function convName(e) {
  return `[${TEAM.name}] ${TEAM.platform}. ${e.feature}. №${e.iter} Ветка: ${e.branch} ${e.ver}. ${e.range}. ${e.launch}`;
}

function computeBlocks(e) {
  const st = {}; const plan = {}; let beta = null; let lastMove = null; let nextPlan = null;
  const evs = [...e.events].sort((a, b) => a._d - b._d);
  for (const ev of evs) {
    if (!ev.b) continue;
    const list = ev.b === 'all' ? ALL_BLOCKS : ev.b;
    if (ev.t === 'plan') {
      if (ev._d > TODAY) {
        list.forEach((b) => { if (!plan[b]) plan[b] = { d: ev._d, v: ev.v, sd: ev.sd }; });
        if (!nextPlan || ev._d < nextPlan.d) nextPlan = { d: ev._d, blocks: list, sd: ev.sd, v: ev.v };
      }
      continue;
    }
    if (ev._d > TODAY) continue;
    if (list.includes('Бета+')) { beta = { s: 'on', v: ev.v, d: ev._d }; continue; }
    list.forEach((b) => { st[b] = { s: ev.t, v: ev.v, d: ev._d }; delete plan[b]; });
    if (['ab', 'on'].includes(ev.t)) lastMove = ev._d;
  }
  return { st, plan, beta, lastMove, nextPlan };
}

function prepare(e) {
  e.events.forEach((ev) => { ev._d = D(ev.d); });
  e.d = Object.fromEntries(Object.entries(e.dates).map(([k, v]) => [k, D(v)]));
  e.name = convName(e);
  e.short = e.seg ? `${e.feature} · ${e.seg}` : e.feature;
  e.tag = `№${e.iter} · ${e.ver}`;
  e.label = e.seg ? e.seg[0].toUpperCase() + e.seg.slice(1) : `№${e.iter} ${e.ver} · ${e.branch}`;
  const fa = e.d.fullAt;
  e.minAt = fa && e.minDays ? addDays(fa, e.minDays) : null;
  /* «Можно смотреть» = набран минимальный срок И 100 % расчётной выборки (по текущему темпу) */
  e.sampleAt = fa && e.minAt ? (e.sample >= 100 ? e.minAt : addDays(fa, Math.ceil((Math.max(1, days(fa, TODAY)) * 100) / Math.max(1, e.sample)))) : null;
  e.lookAt = e.minAt ? (e.sampleAt > e.minAt ? e.sampleAt : e.minAt) : null;
  e.planEnd = e.d.planEnd || (fa && e.planDays ? addDays(fa, e.planDays) : null);
  const endAt = e.d.platformEnd && e.d.platformEnd < TODAY ? e.d.platformEnd : TODAY;
  e.dayN = fa ? days(fa, endAt) : null;
  Object.assign(e, computeBlocks(e));
  e.coverage = ALL_BLOCKS.filter((b) => e.st[b] && ['ab', 'on'].includes(e.st[b].s)).length;
  e.onCount = ALL_BLOCKS.filter((b) => e.st[b] && e.st[b].s === 'on').length;
  e.flags = e.flags || [];
  e.blockers = e.blockers || null;
  e.alerts = alertsFor(e);
  e.topSev = e.alerts.length ? e.alerts.reduce((m, a) => (SEV_ORDER[a.sev] < SEV_ORDER[m] ? a.sev : m), 'info') : null;
}

function blockList(list) {
  if (list === 'all' || (Array.isArray(list) && list.length === ALL_BLOCKS.length)) return 'все блоки';
  const L = [...list];
  const si = L.filter((b) => b.startsWith('SI'));
  const rest = L.filter((b) => !b.startsWith('SI'));
  const parts = [];
  if (rest.length) parts.push(rest.join(', '));
  if (si.length === 4) parts.push('SI1–SI4'); else if (si.length) parts.push(si.join(', '));
  return parts.join(', ');
}

function dutyNow() { return DUTY.find((x) => x.now).who; }

/* ---------- правила-напоминалки ---------- */
function alertsFor(e) {
  const A = [];
  const add = (sev, title, sub, due, act, rule) => A.push({ sev, title, sub, due, act, rule, e });
  const t = TODAY;

  if (e.blockers) add('warn', `Блокер: ${e.blockers}`, 'Пока блокер не снят, тест не стартует. Дату старта нельзя запланировать', null, { k: 'open', label: 'Открыть' }, 'blocker');
  if (e.type === 'ab' && !e.metric) add('warn', 'Не заполнена целевая метрика', 'Без неё не посчитать минимальный срок и выборку, а значит и дату, когда смотреть результаты', null, { k: 'open', label: 'Заполнить' }, 'nometric');

  if (e.stage === 'ready') {
    if (e.platform === 'Завершён' && !e.decision) {
      const n = days(e.d.platformEnd, t);
      if (n >= 3) add('crit', `Тест завершён ${dn(n)} назад, а решения нет`, 'Платформа посчитала итог, но вывод и следующий шаг (раскатка, перезапуск, откат) не записаны', e.d.platformEnd, { k: 'decide', label: 'Записать решение' }, 'nodecision');
      else add('good', 'Тест завершён: разберите результаты', 'Итог посчитан на платформе', e.d.platformEnd, { k: 'decide', label: 'Записать решение' }, 'nodecision');
    }
    if (e.platform === 'Запущен' && !e.decision && e.planEnd && e.planEnd < t) {
      const n = days(e.planEnd, t);
      add('crit', `Идёт на ${dn(n)} дольше плана`, `Результаты можно было смотреть с ${fmt(e.minAt)}, но их никто не разобрал. Трафик всё ещё делится между вариантами`, e.planEnd, { k: 'results', label: 'Смотреть результаты' }, 'overdue');
    }
  }

  if (e.stage === 'collecting' && e.type !== 'holdout' && e.lookAt) {
    const n = days(t, e.lookAt);
    if (n <= 0) add('good', 'Можно смотреть результаты', `Набран минимальный срок (${dn(e.minDays)}) и выборка`, e.lookAt, { k: 'results', label: 'Смотреть результаты' }, 'canlook');
    else add('info', `Результаты можно смотреть с ${fmtH(e.lookAt)}`, `День ${e.dayN} из ${e.planDays}, выборка ${e.sample}%. Если смотреть раньше, выводы будут ненадёжными`, e.lookAt, { k: 'remind', label: 'Напомнить мне' }, 'upcoming');
    if (e.planEnd && e.lookAt > e.planEnd) add('warn', 'Выборка не успевает к плановой дате', `При текущем темпе 100 % выборки будет только ${fmt(e.lookAt)}, а план окончания — ${fmt(e.planEnd)}. Продлите тест или пересмотрите минимальный эффект`, e.planEnd, { k: 'open', label: 'Открыть' }, 'slow');
  }

  if (e.type === 'holdout' && e.holdout) {
    add('info', `Срез холдаута ${fmtH(D(e.holdout.next))}`, `${e.holdout.lastNote}. Держим до ${e.holdout.until}`, D(e.holdout.next), { k: 'remind', label: 'Напомнить мне' }, 'holdout');
  }

  if (['enabling', 'rollout'].includes(e.stage)) {
    const np = e.nextPlan;
    const what = e.type === 'rollout' ? `включение ${e.variants[0].v}` : e.stage === 'rollout' ? `включение ${e.decision?.winner || ''}` : 'включение АБ';
    if (!np) {
      const n = e.lastMove ? days(e.lastMove, t) : 0;
      if (n >= 3) add('warn', `Включение стоит ${dn(n)}`, `Включено на ${e.coverage} из ${ALL_BLOCKS.length} блоков, следующий шаг не запланирован`, e.lastMove, { k: 'plan', label: 'Запланировать шаг' }, 'stuck');
    } else {
      const n = days(t, np.d);
      if (!np.sd && n <= 1) add('warn', `${n === 0 ? 'Сегодня' : 'Завтра'} ${what}: блоки ${blockList(np.blocks)}`, `SD-заявки пока нет. Дежурный по включению: ${dutyNow()}`, t, { k: 'sd', label: 'Создать SD-заявку' }, 'needsd');
      else add('info', `${rel(np.d)[0].toUpperCase() + rel(np.d).slice(1)}: ${what}, блоки ${blockList(np.blocks)}`, np.sd ? `Заявка ${np.sd} создана` : 'Заявку нужно создать за день до включения', np.d, { k: 'open', label: 'Открыть' }, 'nextstep');
    }
  }

  if (e.platform === 'Новый' && !e.d.enableStart && !e.d.plannedStart && !e.blockers && e.d.created) {
    const n = days(e.d.created, t);
    if (n >= 14) add('warn', `Черновик на АБ-платформе висит ${dn(n)}`, e.type === 'rollout' ? 'Фичу раскатили без АБ. Черновик теста лучше архивировать, чтобы он не путал' : 'Тест заведён, но не запущен. Запустите его или отправьте в архив', e.d.created, { k: 'archive', label: 'Архивировать черновик' }, 'draft');
  }

  if (e.stage === 'cleanup' && e.d.rolloutDoneAt) {
    const todo = e.toggles.filter((x) => x.st === 'todo');
    const n = days(e.d.rolloutDoneAt, t);
    if (todo.length && n >= 30) add('serious', `Раскатано ${dn(n)} назад, тоглы не удалены (${todo.length})`, todo.map((x) => x.n).join(', '), addDays(e.d.rolloutDoneAt, 30), { k: 'cleanup', label: 'В «Удаление тоглов»' }, 'toggles');
    else if (todo.length) add('info', `Запланировать удаление тоглов (${todo.length})`, `${todo.map((x) => x.n).join(', ')}. Срок: ${fmtH(addDays(e.d.rolloutDoneAt, 30))}`, addDays(e.d.rolloutDoneAt, 30), { k: 'cleanup', label: 'В «Удаление тоглов»' }, 'toggles');
  }

  if (['enabling', 'collecting', 'ready'].includes(e.stage) && e.type !== 'holdout' && e.cross.mixed >= 90) {
    add('warn', `Пересечения: ${e.cross.mixed}% выборки в других тестах`, `Пересекается с: ${e.cross.with.map((id) => EX[id] ? `${EX[id].feature} №${EX[id].iter}` : id).join('; ')}. Проверьте, не смешиваются ли эффекты`, null, { k: 'cross', label: 'Посмотреть' }, 'cross');
  }

  /* фичи без АБ: пилот и проверка после раскатки вместо результатов */
  if (e.pilot && e.stage === 'release') {
    const n = days(D(e.pilot.since), t);
    if (n >= 10 && !e.nextPlan) add('warn', `Пилот идёт ${dn(n)}, решения о раскатке нет`, `${e.pilot.group}. ${e.pilot.feedback}. Раскатываем на всех или продлеваем пилот?`, addDays(D(e.pilot.since), 10), { k: 'pilot', label: 'Запланировать раскатку' }, 'pilot');
  }
  if (e.type === 'rollout' && e.check && !e.check.done && e.d.rolloutDoneAt) {
    const due = addDays(e.d.rolloutDoneAt, e.check.days);
    if (due <= t) add('warn', 'Проверьте метрики после раскатки', `Вместо АБ: ${e.check.what}. Сравнение до и после, срок был ${fmt(due)}`, due, { k: 'check', label: 'Отметить проверку' }, 'postcheck');
    else add('info', `Проверка метрик после раскатки ${fmtH(due)}`, `Вместо АБ: ${e.check.what}`, due, { k: 'remind', label: 'Напомнить мне' }, 'postcheck');
  }
  /* длинная история: похожую гипотезу уже проверяли */
  if (e.theme && ['prep', 'release', 'enabling', 'collecting'].includes(e.stage)) {
    const hist = ((FEATURE_META[e.fid] || {}).history || []).filter((h) => h.theme === e.theme);
    if (hist.length) {
      const wins = hist.filter((h) => h.kind === 'win');
      add('info', `Тему «${e.theme}» уже проверяли ${hist.length} ${plural(hist.length, 'раз', 'раза', 'раз')}`, hist.map((h) => `${h.it} ${h.what} — ${h.out.toLowerCase()}`).join('; ') + (wins.length ? `. В проде сейчас победитель ${wins[wins.length - 1].it}` : ''), null, { k: 'open', label: 'История фичи' }, 'similar');
    }
  }

  if (e.stage === 'release' && e.d.plannedStart) {
    const r = RELEASES.find((x) => x.v === e.release);
    add('info', `Старт АБ ${fmtH(e.d.plannedStart)}, после раскатки релиза ${e.release}`, `Релиз ${e.release} выходит ${r ? r.d : ''}. Пилот на бете уже включён`, e.d.plannedStart, { k: 'open', label: 'Открыть' }, 'release');
  }

  return A.sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev]);
}

const EX = Object.fromEntries(EXPERIMENTS.map((e) => [e.id, e]));
function prepareAll() { EXPERIMENTS.forEach(prepare); }
prepareAll();
const allAlerts = () => EXPERIMENTS.flatMap((e) => e.alerts).sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev] || ((a.due || TODAY) - (b.due || TODAY)));

/* ---------- фича → несколько АБ-тестов ---------- */
const startOf = (e) => e.d.enableStart || e.d.plannedStart || e.d.created || TODAY;
const FEATURES = {};
EXPERIMENTS.forEach((e) => { (FEATURES[e.fid] = FEATURES[e.fid] || { id: e.fid, name: e.feature, tests: [], history: (FEATURE_META[e.fid] || {}).history || [] }).tests.push(e); });
Object.values(FEATURES).forEach((f) => f.tests.sort((a, b) => a.iter - b.iter || startOf(a) - startOf(b) || (a.seg || '').localeCompare(b.seg || '', 'ru', { numeric: true })));
const featureOf = (e) => FEATURES[e.fid];
const siblings = (e) => featureOf(e).tests;
const isParallel = (f) => f.tests.length > 1 && new Set(f.tests.map((t) => t.iter)).size < f.tests.length;
function featureKind(f) {
  if (f.tests.length < 2) return '';
  return isParallel(f) ? 'параллельные тесты по сегментам' : 'последовательные итерации';
}
const GROUP_TITLE = {
  upcoming: 'Результаты по тестам фичи будут готовы в разные дни',
  canlook: 'Можно смотреть результаты',
};
/* Напоминания по тестам одной фичи с одинаковым правилом склеиваются в одну строку */
function mergedAlerts() {
  const groups = new Map();
  allAlerts().forEach((a) => { const k = a.e.fid + '|' + a.rule; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(a); });
  const out = [];
  groups.forEach((arr) => {
    if (arr.length === 1) { out.push(arr[0]); return; }
    const worst = arr.reduce((m, a) => (SEV_ORDER[a.sev] < SEV_ORDER[m.sev] ? a : m));
    const same = arr.every((a) => a.title === arr[0].title);
    const due = arr.map((a) => a.due).filter(Boolean).sort((x, y) => x - y)[0] || null;
    out.push({ ...worst, group: arr, same, due, title: same ? arr[0].title : (GROUP_TITLE[worst.rule] || worst.title) });
  });
  return out.sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev] || ((a.due || TODAY) - (b.due || TODAY)));
}

function outcome(e) {
  if (e.flags.includes('stopped')) return 'Остановлен досрочно';
  if (e.type === 'rollout') return ['cleanup', 'done'].includes(e.stage) ? 'Раскатано без АБ' : 'Раскатка без АБ';
  if (!e.decision) return '';
  if (e.results?.direction === 'noninf') return `Не хуже контроля · ${e.decision.winner}`;
  const w = e.variants.find((v) => v.v === e.decision.winner);
  if (w && !w.control) return `Победил ${e.decision.winner}`;
  return 'Нет эффекта';
}

/* ---------- маленькие компоненты ---------- */
const stageDot = (k) => `<span class="dot" style="background:${STAGE[k].color}"></span>`;
const stageChip = (k) => `<span class="chip stage-chip" title="${esc(STAGE[k].hint)}">${stageDot(k)}${STAGE[k].name}</span>`;
const avatar = (n, lg) => `<span class="avatar${lg ? ' lg' : ''}" title="${esc(n)}">${initials(n)}</span>`;
const platChip = (p) => {
  const map = { 'Запущен': 'Запущен', 'Завершён': 'Завершён', 'Новый': 'Новый', 'Нет': '—' };
  return `<span class="chip outline" title="Статус на АБ-платформе">АБ-платформа: ${map[p] || p}</span>`;
};
const typeChip = (e) => e.type === 'holdout' ? '<span class="chip">Холдаут</span>' : e.type === 'rollout' ? '<span class="chip">Без АБ</span>' : '';

function cellState(e, b) {
  const s = e.st[b]; const p = e.plan[b];
  if (s && ['ab', 'on'].includes(s.s)) return { cls: s.s, txt: s.s === 'ab' ? 'АБ' : (s.v || 'вкл'), tip: `${s.s === 'ab' ? 'Идёт АБ' : 'Включено ' + (s.v || '')} с ${fmt(s.d)}` };
  if (p) return { cls: 'plan', txt: fmt(p.d), tip: `Запланировано на ${fmt(p.d, true)}${p.sd ? ' · ' + p.sd : ' · SD ещё не создана'}` };
  if (s && s.s === 'pause') return { cls: 'pause', txt: '—', tip: `АБ остановлен ${fmt(s.d)}, клиенты на ${s.v || 'контроле'}` };
  return { cls: '', txt: '', tip: 'Не включено' };
}

const BM_COLS = (beta = true) => {
  const c = [];
  if (beta) c.push({ h: 'Бета+', beta: true }, { gap: true });
  ALL_BLOCKS.forEach((b) => { c.push({ h: b }); if (b === 'ГФ' || b === '7' || b === '4' || b === '1') c.push({ gap: true }); });
  return c;
};
const bmTemplate = (fixed) => BM_COLS().map((c) => (c.gap ? '6px' : fixed ? (c.beta ? '40px' : fixed) : 'minmax(30px, auto)')).join(' ');
const bmHeader = (fixed) => `<div class="bm-grid" style="grid-template-columns:${bmTemplate(fixed)}">${BM_COLS().map((c) => (c.gap ? '<span></span>' : `<span class="hd" style="min-width:0">${c.h}</span>`)).join('')}</div>`;

function blockMatrix(e, { head = true, beta = true, fixed = null } = {}) {
  const cols = [];
  if (beta) cols.push({ h: 'Бета+', c: e.beta ? { cls: 'on', txt: e.beta.v && e.beta.v.length <= 4 ? e.beta.v : 'вкл', tip: `Бета+: включено ${e.beta.v || ''} с ${fmt(e.beta.d)}` } : { cls: '', txt: '', tip: 'Бета+: не включено' } });
  if (beta) cols.push({ gap: true });
  ALL_BLOCKS.forEach((b, i) => {
    cols.push({ h: b, c: cellState(e, b) });
    if (b === 'ГФ' || b === '7' || b === '4' || b === '1') cols.push({ gap: true });
  });
  const tpl = fixed && beta ? bmTemplate(fixed) : cols.map((c) => (c.gap ? '6px' : 'minmax(30px, auto)')).join(' ');
  return `<div class="bm-grid" style="grid-template-columns:${tpl}">
    ${head ? cols.map((c) => (c.gap ? '<span></span>' : `<span class="hd">${c.h}</span>`)).join('') : ''}
    ${cols.map((c) => (c.gap ? '<span></span>' : `<span class="bm"><span class="c ${c.c.cls}" data-tip="<b>${esc(c.h)}</b><br>${esc(c.c.tip)}">${esc(c.c.txt)}</span></span>`)).join('')}

}

function miniBlocks(e) {
  const parts = ALL_BLOCKS.map((b) => {
    const c = cellState(e, b);
    const sep = (b === 'ГФ' || b === '7' || b === '4' || b === '1') ? '<i class="sep"></i>' : '';
    return `<i class="${c.cls}"></i>${sep}`;
  }).join('');
  return `<span class="mini-bm" data-tip="${esc(miniTip(e))}">${parts}</span>`;
}
function miniTip(e) {
  const on = e.coverage; const p = Object.keys(e.plan).length;
  let s = `<b>Блоки: ${on} из ${ALL_BLOCKS.length}</b>`;
  if (p) s += `<br>Запланировано ещё ${p}${e.nextPlan ? ', следующий шаг ' + fmt(e.nextPlan.d) : ''}`;
  if (e.lastMove) s += `<br><span class="tmuted">Последнее движение ${fmt(e.lastMove)}</span>`;

const bmLegend = () => `<div class="bm-legend">
  <span><i class="ab"></i>Идёт АБ</span><span><i class="on"></i>Включено значение</span>

/* Готовность результатов: можно ли уже смотреть */
function readiness(e) {
  if (!e.d.fullAt || !e.minAt) return null;
  const lookDays = days(e.d.fullAt, e.lookAt);
  const total = Math.max(e.planDays, lookDays); const n = Math.min(e.dayN, total);
  const over = e.planEnd && TODAY > e.planEnd && !e.decision && e.platform === 'Запущен';
  const canLook = TODAY >= e.lookAt;
  return { n, total, pct: Math.min(100, (e.dayN / total) * 100), minPct: Math.min(100, (lookDays / total) * 100), canLook, over, slow: e.lookAt > e.planEnd };
}
function readinessBar(e, compact) {
  const r = readiness(e);
  if (!r) return '';
  if (e.type === 'holdout') return `<div class="meter-row"><span class="nowrap">Холдаут · срез ${fmt(D(e.holdout.next))}</span></div>`;
  const cls = r.over ? 'over' : r.canLook ? 'ready' : '';
  const label = compact ? (r.over ? `<b style="color:var(--crit)">+${days(e.planEnd, TODAY)} дн. сверх плана</b>` : e.d.platformEnd ? `<b style="color:#b4501f">завершён ${fmt(e.d.platformEnd)}</b>` : r.canLook ? '<b style="color:#b4501f">можно смотреть</b>' : `итоги с ${fmt(e.lookAt)}${r.slow ? ' <b style="color:#8a5d00">· позже</b>' : ''}`)
    : r.over ? `<b style="color:var(--crit)">+${dn(days(e.planEnd, TODAY))} сверх плана</b>`
    : e.d.platformEnd ? `<b style="color:#b4501f">завершён ${fmt(e.d.platformEnd)}</b>`
    : r.canLook ? '<b style="color:#b4501f">можно смотреть</b>'
    : `смотреть ${rel(e.lookAt)}${r.slow ? ' <b style="color:#8a5d00">· позже плана</b>' : ''}`;
  return `<div class="meter-row" data-tip="<b>День ${e.dayN} из ${e.planDays}</b><br>Можно смотреть с ${fmt(e.lookAt, true)}<br><span class='tmuted'>минимальный срок: ${fmt(e.minAt)} · 100% выборки: ${fmt(e.sampleAt)}</span><br>План окончания: ${fmt(e.planEnd, true)}<br>Выборка: ${e.sample}% от расчётной">
    <div class="meter ${cls}"><b style="width:${r.pct}%"></b><span class="tick" style="left:calc(${r.minPct}% - 1px)"></span></div>
    <span class="nowrap">${compact ? '' : `день ${e.dayN}/${e.planDays} · `}${label}</span></div>`;
}

function alertRow(a, { showExp = true, compact = false, meta = true } = {}) {

/* ---------- паспорт эксперимента (общий для всех вариантов) ---------- */
const VAR_COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];
const DARK_TEXT = ['#eda100'];

function splitBar(e) {
  let i = 0;
  const vs = e.variants.map((v) => ({ ...v, color: v.control ? '#898781' : VAR_COLORS[i++] }));
  return `<div class="split">${vs.map((v) => `<div class="${DARK_TEXT.includes(v.color) ? 'dk' : ''}" style="flex:${v.share};background:${v.color}" data-tip="<b>${v.v}</b> · ${v.share}%<br>${esc(v.name)}">${v.share >= 5 ? v.share + '%' : ''}</div>`).join('')}</div>
  <div class="stack" style="margin-top:10px;gap:5px">${vs.map((v) => `<div class="row small"><span class="dot" style="background:${v.color};border-radius:2px"></span><span class="mono" style="width:38px">${v.v}</span><span class="ink2 grow">${esc(v.name)}${v.control ? ' <span class="chip" style="height:18px">контроль</span>' : ''}</span><span class="tnum muted">${v.share}%</span></div>`).join('')}</div>`;
}

function forest(e) {
  const R = e.results;
  if (!R || !R.rows) return '';
  const rows = R.rows.filter((r) => !r.control);
  const ctrl = R.rows.find((r) => r.control);
  const lo = Math.min(0, R.threshold ?? 0, ...rows.map((r) => r.lo));
  const hi = Math.max(0, ...rows.map((r) => r.hi));
  const padv = (hi - lo) * 0.12 || 0.5;
  const L = lo - padv, H = hi + padv;
  const x = (v) => ((v - L) / (H - L)) * 100;
  const verdict = (r) => {
    if (r.verdict) return { c: '#2a78d6', t: `${r.verdict} · в пределах порога` };
    if (!r.sig) return { c: '#898781', t: 'незначимо' };
    const good = R.direction === 'down' ? r.delta < 0 : r.delta > 0;
    return good ? { c: '#2a78d6', t: `значимо ${r.delta > 0 ? '↑' : '↓'} · за гипотезу` } : { c: '#e34948', t: `значимо ${r.delta > 0 ? '↑' : '↓'} · против гипотезы` };
  };
  return `<div class="forest">
    <div class="forest-row head"><span>Вариант</span><span>Значение</span><span>Разница с контролем, п.п. (95% ДИ)</span><span>Вывод</span></div>
    <div class="forest-row"><span><span class="mono">${ctrl.v}</span> ${ctrl.label ? esc(ctrl.label) : 'контроль'}</span><span class="tnum">${num(ctrl.value)} %</span><span class="small muted">база для сравнения</span><span></span></div>
    ${rows.map((r) => { const vd = verdict(r); return `<div class="forest-row" data-tip="<b>${r.label || r.v}</b><br>${num(r.value)} % (Δ ${sgn(r.delta)} п.п.)<br>95% ДИ: ${sgn(r.lo)} … ${sgn(r.hi)}">
      <span><span class="mono">${r.v}</span> ${r.label ? esc(r.label) : esc((e.variants.find((v) => v.v === r.v) || {}).name || '')}</span>
      <span class="tnum">${num(r.value)} %</span>
      <div class="forest-plot">
        <span class="zero" style="left:${x(0)}%"></span>
        ${R.threshold != null ? `<span class="thr" style="left:${x(R.threshold)}%" title="Порог «не хуже»"></span>` : ''}
        <span class="ci" style="left:${x(r.lo)}%;width:${x(r.hi) - x(r.lo)}%;background:${vd.c}"></span>
        <span class="pt" style="left:${x(r.delta)}%;background:${vd.c}"></span>
      </div>
      <span class="small"><span class="tnum" style="font-weight:600">${sgn(r.delta)}</span> <span class="ink2">${vd.t}</span></span>
    </div>`; }).join('')}
    <div class="forest-row" style="border:0;padding-top:2px"><span></span><span></span><div class="small muted" style="position:relative;height:16px">${[lo, 0, hi].filter((v, i, a) => a.indexOf(v) === i).map((v) => `<span style="position:absolute;left:${x(v)}%;transform:translateX(-50%)" class="tnum">${v === 0 ? '0' : sgn(v)}</span>`).join('')}</div><span></span></div>
  </div>
  ${R.threshold != null ? `<div class="small muted" style="margin-top:6px">Красная линия — порог «не хуже»: ${sgn(R.threshold)} п.п.</div>` : ''}`;
}

const ROLLOUT_STEPS = { prep: 'Подготовка', release: 'Релиз и пилот', enabling: 'Раскатка по блокам', cleanup: 'Проверка и чистка', done: 'Архив' };
function stepper(e) {
  const noAb = e.type === 'rollout';
  const list = noAb ? STAGES.filter((s) => ROLLOUT_STEPS[s.k]) : STAGES;
  const cur = list.findIndex((s) => s.k === e.stage);
  const dateFor = { prep: e.d.created, release: e.pilot ? D(e.pilot.since) : null, enabling: noAb ? e.d.rolloutStart : e.d.enableStart, collecting: e.d.fullAt, ready: e.minAt && e.minAt <= TODAY ? e.minAt : null, rollout: e.decision ? D(e.decision.d) : null, cleanup: e.d.rolloutDoneAt, done: e.d.cleanupDoneAt };
  return `<div class="stepper" style="grid-template-columns:repeat(${list.length},1fr)">${list.map((s, i) => `<div class="step ${i < cur ? 'done' : i === cur ? 'cur' : ''}" style="--c:${s.color}" title="${esc(s.hint)}"><span class="bar"></span><span>${noAb ? ROLLOUT_STEPS[s.k] : s.name}<br><small>${dateFor[s.k] && i <= cur ? fmt(dateFor[s.k]) : '&nbsp;'}</small></span></div>`).join('')}</div>`;
}

function journal(e) {
  const evs = [...e.events].sort((a, b) => b._d - a._d);
  const color = { ab: 'var(--st-collecting)', on: 'var(--st-cleanup)', beta: 'var(--st-release)', pause: '#898781', plan: '#898781', result: 'var(--st-ready)', decision: 'var(--st-rollout)', sys: '#141413', toggle: 'var(--st-cleanup)', note: '#c3c2b7' };
  return `<div class="journal">${evs.map((ev) => `<div class="jrow ${ev._d > TODAY ? 'future' : ''}">
    <span class="jd">${fmt(ev._d, true)}</span>
    <span class="jdot"><i style="${ev._d > TODAY ? '' : 'background:' + color[ev.t]}"></i></span>
    <span class="jtxt">${ev.t === 'sys' ? '<span class="chip" style="height:18px;margin-right:6px">авто</span>' : ''}${esc(ev.txt)}${ev.b ? ` <span class="blk">· ${esc(blockList(ev.b))}</span>` : ''}${ev.v && ev.t !== 'ab' && !ev.txt.includes(ev.v) ? ` <span class="mono">${ev.v}</span>` : ''}${ev.sd ? `<span class="sd">${ev.sd}</span>` : ''}</span>
  </div>`).join('')}</div>`;
}

function toggleList(e) {
  if (!e.toggles.length) return '<div class="empty">Тоглов и рубильников нет</div>';
  const st = { todo: ['Не удалён', 'warn'], planned: ['Запланирован', 'info'], done: ['Удалён', 'good'] };
  return `<div class="stack" style="gap:6px">${e.toggles.map((x) => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)">
    ${sevIcon(st[x.st][1])}
    <span class="grow"><span class="mono">${esc(x.n)}</span> <span class="muted small">· ${x.kind}</span>${x.where ? `<br><span class="small ink2">${esc(x.where)}</span>` : ''}</span>
    <span class="sev-label ${st[x.st][1]}">${st[x.st][0]}</span>
  </div>`).join('')}</div>`;
}

function crossBlock(e) {

  return `<div class="split" style="height:22px"><div style="flex:${Math.max(c.clean, 1)};background:#1baf7a" data-tip="Чистая выборка: ${c.clean}%">${c.clean >= 8 ? c.clean + '%' : ''}</div><div style="flex:${c.mixed};background:#eb6834" data-tip="Смешанная: ${c.mixed}%">${c.mixed >= 8 ? c.mixed + '%' : ''}</div></div>
  <div class="row small ink2" style="margin-top:8px;gap:16px"><span class="row" style="gap:6px"><span class="dot" style="background:#1baf7a"></span>Чистых ${c.clean}%</span><span class="row" style="gap:6px"><span class="dot" style="background:#eb6834"></span>Смешанных ${c.mixed}%</span></div>
  ${c.with.length ? `<div class="small" style="margin-top:10px">Пересекается с: ${c.with.map((id) => EX[id] ? `<a href="#" data-open="${id}">${esc(EX[id].short)} №${EX[id].iter}</a>` : id).join(', ')}</div>` : ''}`;
}

function decisionBlock(e) {
  if (e.decision) {
    return `<div class="row" style="align-items:flex-start;gap:12px">${avatar(e.decision.who, true)}<div class="grow"><div><b>${esc(e.decision.who)}</b> <span class="muted small">${e.decision.d}</span></div><div style="margin-top:2px">${esc(e.decision.text)}</div>${e.decision.winner ? `<div style="margin-top:8px"><span class="chip">Итоговое значение: <span class="mono">${e.decision.winner}</span></span></div>` : ''}</div></div>`;

function testBrief(e) {
  const row = e.results?.rows?.find((x) => !x.control);
  if (e.decision) return outcome(e);
  if (row && e.results.status !== 'invalid') return `${sgn(row.delta)} п.п. · ${row.verdict || (row.sig ? 'значимо' : 'незначимо')}`;
  if (e.stage === 'collecting' && e.lookAt && e.type !== 'holdout') return TODAY >= e.lookAt ? 'можно смотреть' : `смотреть с ${fmt(e.lookAt)} · выборка ${e.sample}%`;
  if (['enabling', 'rollout'].includes(e.stage)) return `${e.coverage} из ${ALL_BLOCKS.length} блоков`;
  return STAGE[e.stage].name;
}

function featureTabs(e) {
  const f = featureOf(e);

  return `<div class="ftabs">${f.tests.map((t) => `<a href="#" class="ftab ${t.id === e.id ? 'on' : ''}" data-open="${t.id}" title="${esc(STAGE[t.stage].name)}">${stageDot(t.stage)}${esc(t.seg ? t.label : '№' + t.iter + ' ' + t.ver)}</a>`).join('')}</div>`;
}

const MON_N = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
function pastOf(f, exceptId) {
  const kindOf = (t) => (t.flags.includes('stopped') ? 'stop' : outcome(t).startsWith('Победил') || outcome(t).startsWith('Не хуже') ? 'win' : 'none');
  const fromTests = f.tests.filter((t) => t.stage === 'done' && t.id !== exceptId).map((t) => ({
    n: t.iter, it: '№' + t.iter + (t.seg ? ' · ' + t.seg : ''), theme: t.theme || '', what: `${t.seg ? 'АБ-тест: ' + t.seg : t.branch}, ${t.ver}`, when: `${MON_N[(t.d.enableStart || t.d.rolloutStart || t.d.created).getMonth()]} ${(t.d.enableStart || t.d.rolloutStart || t.d.created).getFullYear()}`,
    out: t.flags.includes('stopped') ? 'Остановлен: ошибка разметки' : outcome(t), kind: kindOf(t), id: t.id,
  }));
  return [...f.history, ...fromTests].sort((a, b) => a.n - b.n);
}
const HK = { win: 'good', none: 'info', stop: 'warn' };

}

  const meta = FEATURE_META[f.id] || {};
  return `

      <span class="chip"><span class="dot" style="background:${HCOLOR.none}"></span>Без эффекта ${cnt('none')}</span>
      <span class="chip"><span class="dot" style="background:${HCOLOR.stop}"></span>Остановлено ${cnt('stop')}</span>
      <span class="small muted">с ${esc(past[0].when)}</span>
    </div>
    <div class="hstrip">${past.map((h) => `<i style="background:${HCOLOR[h.kind]}" data-tip="<b>${esc(h.it)} · ${esc(h.theme)}</b><br>${esc(h.what)}<br>${esc(h.when)} · ${esc(h.out)}"></i>`).join('')}${cur.map((t) => `<i class="now" data-tip="<b>№${t.iter} · сейчас</b><br>${esc(t.branch)}"></i>`).join('')}</div>
    <div class="row small muted" style="justify-content:space-between;margin-top:4px"><span>${esc(past[0].it)}</span><span>${cur.length ? '№' + cur[cur.length - 1].iter + ' — сейчас' : esc(past[past.length - 1].it)}</span></div>
    ${meta.prod ? `<div class="small" style="margin-top:12px;padding:8px 10px;border-radius:8px;background:#e5f5e5;color:#0b3d0b">${esc(meta.prod)}</div>` : ''}
    <table class="t" style="margin-top:12px"><thead><tr><th style="position:static">Тема</th><th style="position:static">Тестов</th><th style="position:static">Итоги по порядку</th><th style="position:static">Последний</th></tr></thead><tbody>
      ${themes.map((th) => { const L = past.filter((h) => h.theme === th); const last = L[L.length - 1]; const isCur = e.theme === th && e.stage !== 'done';
        return `<tr style="${isCur ? 'background:var(--accent-wash)' : ''}"><td><b>${esc(th)}</b>${isCur ? '<br><span class="small" style="color:var(--accent)">тема текущего теста</span>' : ''}</td><td class="tnum">${L.length}</td>
        <td><span class="hstrip sm">${L.map((h) => `<i style="background:${HCOLOR[h.kind]}" data-tip="<b>${esc(h.it)}</b> ${esc(h.what)}<br>${esc(h.out)}"></i>`).join('')}</span></td>
        <td class="small"><span class="muted">${esc(last.it)}</span> <span class="sev-label ${HK[last.kind]}">${esc(last.out)}</span></td></tr>`; }).join('')}
    </tbody></table>
    <details class="hall"><summary>Все ${past.length} ${plural(past.length, 'итерация', 'итерации', 'итераций')}</summary>
      <div class="search" style="margin:10px 0;min-width:0">${ICON.search}<input data-hsearch placeholder="Поиск по истории: тема, текст, номер…"></div>
      <div>${past.slice().reverse().map(histRow).join('')}</div>
    </details>`;
}

/* ---------- задачи: одно дело — одна строка ---------- */
const TASK = {
  nodecision: 'Записать решение', overdue: 'Разобрать результаты', toggles: 'Удалить тоглы', stuck: 'Запланировать шаг',
  needsd: 'Создать SD-заявку', draft: 'Архивировать черновик', cross: 'Проверить пересечения', nometric: 'Заполнить метрику',
  blocker: 'Снять блокер', slow: 'Продлить тест', pilot: 'Решить по пилоту', postcheck: 'Проверить метрики',
  canlook: 'Посмотреть результаты', upcoming: 'Результаты', holdout: 'Срез холдаута', nextstep: 'Шаг включения',
  release: 'Старт АБ', similar: 'Тему уже проверяли',
};

function shortOf(a) {
  const e = a.e;
  switch (a.rule) {
    case 'nodecision': return `тест завершён ${fmt(e.d.platformEnd)}`;
    case 'overdue': return `+${dn(days(e.planEnd, TODAY))} сверх плана`;
    case 'toggles': { const n = e.toggles.filter((x) => x.st === 'todo').length; return `${n} ${plural(n, 'тогл', 'тогла', 'тоглов')}, раскатано ${fmt(e.d.rolloutDoneAt)}`; }
    case 'stuck': return `${e.coverage}/${ALL_BLOCKS.length} блоков, дальше не запланировано`;
    case 'needsd': case 'nextstep': return `${blockList(e.nextPlan.blocks)} · ${rel(e.nextPlan.d)}`;
    case 'draft': return `висит с ${fmt(e.d.created)}`;
    case 'cross': return `${e.cross.mixed}% выборки в других тестах`;
    case 'nometric': return 'без неё не посчитать срок';
    case 'blocker': return e.blockers;
    case 'slow': return `100 % выборки к ${fmt(e.lookAt)}, план ${fmt(e.planEnd)}`;
    case 'pilot': return `пилот с ${e.pilot.since.slice(0, 5)}`;
    case 'postcheck': return e.check.what;
    case 'canlook': return 'срок и выборка набраны';
    case 'upcoming': return `с ${fmt(e.lookAt)} · выборка ${e.sample}%`;
    case 'holdout': return `${fmt(D(e.holdout.next))}`;
    case 'release': return `${fmt(e.d.plannedStart)}, после релиза ${e.release}`;
    case 'similar': return `«${e.theme}»`;
    default: return '';
  }
}

function ageOf(a) {
  const d = a.due; if (!d) return '';
  if (d <= TODAY) { const n = days(d, TODAY); return n === 0 ? 'сегодня' : `${n} дн.`; }
  const n = days(TODAY, d); return n === 1 ? 'завтра' : fmt(d);
}

/* Склейка: по тестам одной фичи с одним правилом — одна строка; по одному тесту — одна строка с «+N» */
function buildTasks(filter = () => true) {
  const ent = new Map();
  mergedAlerts().filter(filter).forEach((a) => { const k = a.group ? a.e.fid : a.e.id; if (!ent.has(k)) ent.set(k, []); ent.get(k).push(a); });
  const now = []; const later = [];
  ent.forEach((list) => {
    list.sort((x, y) => SEV_ORDER[x.sev] - SEV_ORDER[y.sev]);
    const act = list.filter((a) => a.sev !== 'info');
    const inf = list.filter((a) => a.sev === 'info');
    if (act.length) now.push({ main: act[0], extra: [...act.slice(1), ...inf] });
    else later.push({ main: inf[0], extra: inf.slice(1) });
  });
  const dueKey = (t) => (t.main.due ? t.main.due.getTime() : 9e15);
  now.sort((a, b) => SEV_ORDER[a.main.sev] - SEV_ORDER[b.main.sev] || dueKey(a) - dueKey(b));
  later.sort((a, b) => dueKey(a) - dueKey(b));
  return { now, later };
}

function taskRow(t, { noObj = false } = {}) {
  const a = t.main; const e = a.e; const G = a.group;
  const obj = G ? `${e.feature} · ${G.length} ${plural(G.length, 'тест', 'теста', 'тестов')}` : e.short;
  const tip = t.extra.map((x) => esc(x.title)).join('<br>');
  return `<div class="task ${a.sev}">
    ${sevIcon(a.sev)}
    <div class="task-main">
      <div class="task-line"><b>${esc(TASK[a.rule] || a.title)}</b>${noObj ? '' : `<a href="#" data-open="${e.id}" class="task-obj">${esc(obj)}</a>`}<span class="task-det">${esc(shortOf(a))}</span>${t.extra.length ? `<span class="chip task-extra" data-tip="${tip}">+${t.extra.length}</span>` : ''}</div>
      <div class="task-more">
        <div>${esc(a.title)}. ${esc(a.sub)}</div>
        ${G ? `<div class="task-sub">${G.map((x) => `<div><a href="#" data-open="${x.e.id}">${esc(x.e.label)}</a> — ${esc(a.same ? testBrief(x.e) : x.title)}</div>`).join('')}</div>` : ''}
        ${t.extra.length ? `<div class="task-sub">${t.extra.map((x) => `<div class="row" style="gap:6px">${sevIcon(x.sev)}${esc(x.title)}</div>`).join('')}</div>` : ''}
      </div>
    </div>
    ${noObj ? '<span></span>' : avatar(e.owner)}
    <span class="task-age">${ageOf(a)}</span>
    <button class="btn sm ${a.sev === 'crit' || a.sev === 'good' ? 'primary' : ''}" data-act="${a.act.k}" data-id="${e.id}">${esc(a.act.label)}</button>
    <button class="btn sm ghost task-snz" data-act="snooze" data-id="${e.id}">Позже</button>
  </div>`;
}

/* ---------- паспорт: шапка + вкладки ---------- */
function featureSection(e) {
  const f = featureOf(e);
  const past = pastOf(f, e.id);
  const work = f.tests.filter((t) => t.stage !== 'done');
  if (work.length < 2 && !past.length) return '<div class="empty">У фичи одна итерация, истории нет</div>';
  return `${work.length > 1 ? `<div class="sec"><h3>Тесты фичи в работе<span class="sp"></span><span class="small muted" style="font-weight:400">${featureKind(f)}</span></h3>${work.map((t) => `<div class="ftest ${t.id === e.id ? 'cur' : ''}">
      <div class="row" style="gap:8px;min-width:0">${stageDot(t.stage)}<a href="#" data-open="${t.id}" style="color:var(--ink);font-weight:600">${esc(t.label)}</a><span class="small muted nowrap mono">${t.key}</span></div>
      <span class="small ink2 nowrap" style="text-align:right">${STAGE[t.stage].name}</span>
      <div class="small ink2">${esc(testBrief(t))}</div>
      <span class="small muted" style="text-align:right">${t.id === e.id ? 'открыт' : ''}</span>
    </div>`).join('')}</div>` : ''}
    ${past.length ? `<div class="sec">${historyBlock(f, e)}</div>` : ''}`;
}

function noAbSection(e) {
  const c = e.check || {};
  const due = e.d.rolloutDoneAt && c.days ? addDays(e.d.rolloutDoneAt, c.days) : null;
  return `<div class="sec"><h3>Без АБ-теста</h3>
    <div class="kv">
      <dt>Почему без АБ</dt><dd>${esc(e.noAb || 'Не указано')}</dd>
      ${e.pilot ? `<dt>Пилот</dt><dd>${esc(e.pilot.group)} · с ${e.pilot.since}. ${esc(e.pilot.feedback)}</dd>` : ''}
      <dt>Значение</dt><dd><span class="mono">${esc(e.variants[0].v)}</span> — ${esc(e.variants[0].name)}</dd>
      ${c.what ? `<dt>Проверяем вместо АБ</dt><dd>${esc(c.what)}</dd>` : ''}
      ${c.days ? `<dt>Контрольная точка</dt><dd>${c.done ? `<span class="sev-label good">${esc(c.done)}</span>` : due ? `${fmt(due, true)}` : `через ${dn(c.days)} после 100 %`}</dd>` : ''}
    </div></div>`;
}

const PTABS = [['overview', 'Обзор'], ['results', 'Результаты'], ['blocks', 'Блоки и журнал'], ['history', 'История фичи']];

function passportHTML(e, tab = 'overview') {
  const f = featureOf(e);
  const past = pastOf(f, e.id);
  const hasHist = f.tests.length > 1 || past.length > 0;
  const tabs = PTABS.filter(([k]) => !(k === 'results' && e.type === 'rollout') && !(k === 'history' && !hasHist));
  if (!tabs.find(([k]) => k === tab)) tab = 'overview';
  const own = [...e.alerts].sort((x, y) => SEV_ORDER[x.sev] - SEV_ORDER[y.sev]);
  const top = own.find((a) => a.sev !== 'info') || own[0];
  const best = e.results?.rows?.find((x) => !x.control);
  const facts = [
    top && top.sev !== 'info' ? ['Дальше', TASK[top.rule] || top.title, shortOf(top)] : ['Дальше', e.stage === 'done' ? 'Всё завершено' : 'Ничего не требуется', top ? `${TASK[top.rule] || top.title} · ${ageOf(top)}` : ''],
    e.type === 'rollout'
      ? ['Проверка', e.check?.done ? 'пройдена' : e.pilot && e.stage === 'release' ? 'идёт пилот' : 'после 100 %', e.check?.done ? e.check.done.replace(/^Проверено /, '').split(':')[0] : '']
      : ['Результаты', e.decision || e.stage === 'done' ? 'разобраны' : !e.lookAt ? 'не начат' : TODAY >= e.lookAt ? 'можно смотреть' : `с ${fmt(e.lookAt)}`, e.lookAt && !e.decision && e.stage !== 'done' ? `день ${e.dayN}/${e.planDays} · выборка ${e.sample}%` : ''],
    ['Блоки', `${e.coverage} из ${ALL_BLOCKS.length}`, e.nextPlan ? `дальше ${fmt(e.nextPlan.d)}` : e.onCount === ALL_BLOCKS.length ? 'включено на всех' : e.stage === 'release' ? 'до раскатки' : ''],
    ['Итог', e.decision || e.type === 'rollout' ? outcome(e) : best && e.results.status !== 'invalid' ? `${sgn(best.delta)} п.п.` : 'пока нет', e.decision ? `решение ${e.decision.d.slice(0, 5)}` : best && !e.decision ? (best.sig ? 'значимо' : 'незначимо') : ''],
  ];

  let body = '';
  if (tab === 'overview') {
    body = `
      ${own.length ? `<div class="tasks">${own.map((a) => taskRow({ main: a, extra: [] }, { noObj: true })).join('')}</div>` : ''}
      <div class="sec"><h3>Жизненный цикл</h3>${stepper(e)}</div>
      ${e.type === 'rollout' ? noAbSection(e) : ''}
      ${e.type !== 'rollout' && e.d.fullAt && e.stage !== 'done' ? `<div class="sec"><h3>Когда смотреть результаты</h3>
        ${readinessBar(e)}
        <div class="kv" style="margin-top:12px">
          <dt>На всех блоках с</dt><dd>${fmt(e.d.fullAt, true)} · ${dn(e.dayN)}</dd>
          <dt>Минимальный срок</dt><dd>${dn(e.minDays)}, не раньше ${fmt(e.minAt, true)}</dd>
          <dt>Выборка</dt><dd>${e.sample}%${e.sample < 100 ? `, 100 % к ${fmt(e.sampleAt, true)}` : ''}</dd>
          <dt>Можно смотреть</dt><dd><b>с ${fmt(e.lookAt, true)}</b></dd>
          <dt>План окончания</dt><dd>${fmt(e.planEnd, true)}${e.d.platformEnd ? `, завершён ${fmt(e.d.platformEnd, true)}` : ''}</dd>
        </div></div>` : ''}
      <div class="sec"><h3>${e.type === 'rollout' ? 'Описание' : 'Гипотеза'}</h3>
        <p>${esc(e.hypothesis)}</p>
        <div class="kv" style="margin-top:12px">
          ${e.type === 'rollout' ? '' : `<dt>Целевая метрика</dt><dd>${e.metric ? esc(e.metric) : '<span class="sev-label warn">Не заполнена</span>'}</dd>`}
          ${e.metric2 ? `<dt>Доп. метрика</dt><dd>${esc(e.metric2)}</dd>` : ''}
          ${e.blockers ? `<dt>Блокер</dt><dd><span class="sev-label warn">${esc(e.blockers)}</span></dd>` : ''}
          ${e.type === 'rollout' ? '' : `<dt>Имя по конвенции</dt><dd class="row" style="gap:6px;align-items:flex-start"><span class="mono" style="font-size:11.5px">${esc(e.name)}</span><button class="btn ghost sm" data-copy="${esc(e.name)}" title="Скопировать">${ICON.copy}</button></dd>`}
        </div></div>
      ${e.type === 'rollout' ? '' : `<div class="sec"><h3>Варианты и сплит</h3>${splitBar(e)}</div>`}`;
  } else if (tab === 'results') {
    body = `
      ${e.results ? `<div class="sec"><h3>Результаты <span class="sp"></span>${e.results.status === 'ready' ? '<span class="sev-label serious">Не разобраны</span>' : e.results.status === 'invalid' ? '<span class="sev-label crit">Невалидны</span>' : '<span class="sev-label good">Разобраны</span>'}</h3>
        ${e.metric ? `<div class="small muted" style="margin-bottom:8px">${esc(e.metric)}</div>` : ''}
        ${forest(e)}
        <div class="small ink2" style="margin-top:10px">${esc(e.results.note)}</div></div>`
      : `<div class="sec"><div class="empty">Результатов пока нет${e.lookAt ? `. Можно смотреть с ${fmt(e.lookAt, true)}` : ''}</div></div>`}
      <div class="sec"><h3>Решение</h3>${decisionBlock(e)}</div>
      <div class="sec"><h3>Пересечения с другими АБ-тестами</h3>${crossBlock(e)}</div>`;
  } else if (tab === 'blocks') {
    body = `
      <div class="sec"><h3>Где включено <span class="sp"></span><span class="small muted" style="font-weight:400">${e.coverage} из ${ALL_BLOCKS.length}</span></h3>
        <div style="overflow-x:auto">${blockMatrix(e)}</div>
        <div style="margin-top:12px">${bmLegend()}</div></div>
      <div class="sec"><h3>Журнал <span class="sp"></span><button class="btn sm" data-act="addevent" data-id="${e.id}">${ICON.plus} Событие</button></h3>${journal(e)}</div>
      <div class="sec"><h3>Тоглы и рубильники</h3>${toggleList(e)}</div>`;
  } else {
    body = featureSection(e);
  }

  return `
  <div class="drawer-head">
    <button class="btn ghost sm x" data-close>${ICON.x}</button>
    <div class="row wrap" style="gap:6px;margin-bottom:6px">${stageChip(e.stage)}${typeChip(e)}${e.flags.includes('stopped') ? '<span class="chip">Остановлен досрочно</span>' : ''}<span class="chip outline">Релиз ${e.release}</span></div>
    <h2>${esc(e.feature)} <span class="muted" style="font-weight:500">№${e.iter}${e.seg ? ' · ' + esc(e.seg) : ''}</span></h2>
    <div class="row wrap small ink2" style="margin-top:6px;gap:12px">
      <span class="row" style="gap:6px">${avatar(e.owner)}${esc(e.owner)}</span>
      <span class="mono" style="color:var(--ink)">${e.key}</span>
      <a href="#" data-act="link">Аналитика ${ICON.ext}</a>
      ${e.type === 'rollout' ? '' : `<a href="#" data-act="link">АБ-платформа ${ICON.ext}</a>`}
      <a href="#" data-act="link">Тираж ${ICON.ext}</a>
    </div>
    ${featureTabs(e)}
    <div class="pfacts">${facts.map(([l, v, s]) => `<div><span class="pf-l">${l}</span><span class="pf-v">${esc(v)}</span><span class="pf-s">${esc(s)}</span></div>`).join('')}</div>
    <div class="ptabs">${tabs.map(([k, n]) => `<button class="${k === tab ? 'on' : ''}" data-ptab="${k}" data-id="${e.id}">${n}${k === 'history' ? ` <span class="cnt">${past.length + f.tests.filter((t) => t.stage !== 'done' && t.id !== e.id).length}</span>` : ''}</button>`).join('')}</div>
  </div>
  <div class="drawer-body">${body}</div>`;
}

function openPassport(id, tab = 'overview') {
  const e = EX[id]; if (!e) return;
  const dr = $('#drawer');
  dr.innerHTML = passportHTML(e, tab);
  dr.classList.add('open');
  $('#scrim').classList.add('open');
  dr.querySelector('.drawer-body').scrollTop = 0;
}
function closePassport() { $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); }

/* ---------- модалки и действия ---------- */
function toast(msg) {
  const t = $('#toast');
  t.innerHTML = `<span class="sev good" style="background:#2c3b2c;color:#9be39b">${ICON.good}</span>${msg}`;
  t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
function openModal(html) { const m = $('#modal'); m.innerHTML = `<div class="modal">${html}</div>`; m.classList.add('open'); }
function closeModal() { $('#modal').classList.remove('open'); }

function rolloutPlan(start) {
  const steps = [['ГФ'], ['12', '9', '8', '7'], ['6', '5', '4'], ['3', '2', '1'], ['SI1', 'SI2', 'SI3', 'SI4']];
  let d = start; const out = [];
  for (const s of steps) {
    while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1);
    out.push({ d, b: s }); d = addDays(d, 1);
  }
  return out;
}

function decideModal(e) {
  const vs = e.variants;
  const best = e.results?.rows?.filter((r) => !r.control && r.sig).sort((a, b) => (e.results.direction === 'down' ? a.delta - b.delta : b.delta - a.delta))[0];
  const plan = rolloutPlan(addDays(TODAY, 1));
  const others = siblings(e).filter((t) => t.id !== e.id && t.stage === 'ready' && !t.decision);
  openModal(`
  <div class="modal-h"><div class="grow"><h2>Записать решение</h2><div class="small ink2" style="margin-top:4px">${esc(e.feature)} №${e.iter}${e.seg ? ' · ' + esc(e.seg) : ''}</div></div><button class="btn ghost sm" data-mclose>${ICON.x}</button></div>
  <div class="modal-b">
    <div class="field"><label>Что делаем</label>
      <div class="opt-list" data-group="kind">
        <label class="opt sel"><input type="radio" name="kind" checked> <span><b>Раскатываем победителя</b><br><span class="small ink2">Включаем выбранный вариант на все блоки</span></span></label>
        <label class="opt"><input type="radio" name="kind"> <span><b>Оставляем контроль</b><br><span class="small ink2">Эффекта нет или он отрицательный. Гипотезу закрываем</span></span></label>
        <label class="opt"><input type="radio" name="kind"> <span><b>Перезапуск, новая итерация №${e.iter + 1}</b><br><span class="small ink2">Сервис соберёт имя по конвенции и заведёт черновик</span></span></label>
        <label class="opt"><input type="radio" name="kind"> <span><b>Продлить тест</b><br><span class="small ink2">Укажите новую дату и причину</span></span></label>
      </div></div>
    <div class="field"><label>Победивший вариант</label>
      <select class="sel" style="width:100%">${vs.map((v) => `<option ${best && best.v === v.v ? 'selected' : ''}>${v.v} — ${esc(v.name)}</option>`).join('')}</select>
      ${best ? `<span class="small muted">Подсказка: лучший значимый результат у ${best.v} (${sgn(best.delta)} п.п.)</span>` : ''}
    </div>
    <div class="field"><label>Комментарий для тиража</label><textarea placeholder="Почему так решили, что смотрели"></textarea></div>
    ${others.length ? `<div class="field"><label>Другие тесты этой фичи ждут решения</label>
      ${others.map((t) => `<label class="check"><input type="checkbox" data-sib="${t.id}"> <span><b>${esc(t.label)}</b> · ${esc(testBrief(t))}</span></label>`).join('')}
      <span class="small muted">У каждого теста свой результат. Отметьте тесты, по которым решаем так же: сервис возьмёт значимого победителя каждого теста, а если эффекта нет — оставит контроль. По неотмеченным тестам напоминание останется</span></div>` : ''}
    <div class="field"><label>Что сделать автоматически</label>
      <label class="check"><input type="checkbox" checked> <span>Создать план раскатки по блокам: ${plan.map((p) => `${fmt(p.d)} — ${blockList(p.b)}`).join('; ')}</span></label>
      <label class="check"><input type="checkbox" checked> <span>Через 30 дней после полной раскатки напомнить удалить <span class="mono">${e.key}</span> и лишние ветки</span></label>

function decideOne(e) {
  const plan = rolloutPlan(addDays(TODAY, 1));
  const best = e.results?.rows?.filter((r) => !r.control && r.sig).sort((a, b) => (e.results.direction === 'down' ? a.delta - b.delta : b.delta - a.delta))[0];
  const ctrl = e.variants.find((v) => v.control);
  e.platform = 'Завершён';
  if (e.results) e.results.status = 'reviewed';
  if (!best && e.results?.rows) {
    e.decision = { d: fmt(TODAY, true), who: ME, winner: ctrl.v, text: 'Значимого эффекта нет — оставляем контроль. Рубильник отправлен в очередь на удаление.' };
    e.stage = 'cleanup'; e.dates.rolloutDoneAt = fmt(TODAY, true);
    e.events.push({ d: fmt(TODAY, true), t: 'decision', txt: `Решение: оставляем контроль ${ctrl.v}` });
    prepare(e); return `${e.label}: контроль`;
  }
  const winner = (best && best.v) || e.variants.find((v) => !v.control).v;
  e.decision = { d: fmt(TODAY, true), who: ME, winner, text: `Раскатываем ${winner} на всех. План раскатки создан автоматически.` };
  e.stage = 'rollout';
  e.events.push({ d: fmt(TODAY, true), t: 'decision', txt: `Решение: раскатываем ${winner}` });
  plan.forEach((p, i) => e.events.push({ d: fmt(p.d, true), t: 'plan', b: p.b, v: winner, txt: `План: включить ${winner}`, sd: i === 0 ? 'SD0002460' + (100 + Math.floor(Math.random() * 800)) : undefined }));
  prepare(e);
  return `${e.label}: раскатка ${winner}`;
}

function applyDecision(id) {
  const e = EX[id];
  const sibs = [...document.querySelectorAll('#modal [data-sib]')].filter((c) => c.checked).map((c) => EX[c.dataset.sib]);
  const res = [e, ...sibs].map(decideOne);
  closeModal();
  toast(sibs.length ? `Решения записаны: ${res.join('; ')}` : 'Решение записано. План раскатки и напоминание об удалении тоглов созданы');
  rerender();
  if ($('#drawer').classList.contains('open')) openPassport(id);
}

/* ---------- tooltip ---------- */
function initTips() {
  const tip = $('#tip');
  document.addEventListener('mouseover', (ev) => {
    const el = ev.target.closest('[data-tip]');
    if (!el) { tip.classList.remove('show'); return; }
    tip.innerHTML = el.getAttribute('data-tip');
    tip.classList.add('show');
  });
  document.addEventListener('mousemove', (ev) => {
    if (!tip.classList.contains('show')) return;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
    if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
}

/* ---------- глобальные обработчики ---------- */
function initGlobal() {
  document.addEventListener('click', (ev) => {
    const t = ev.target;
    const pt = t.closest('[data-ptab]');
    if (pt) { openPassport(pt.dataset.id, pt.dataset.ptab); return; }
    const open = t.closest('[data-open]');
    if (open) { ev.preventDefault(); openPassport(open.dataset.open); return; }
    const tk = t.closest('.task');
    if (tk && !t.closest('a,button')) { tk.classList.toggle('open'); return; }
    if (t.closest('[data-close]') || t.id === 'scrim') { closePassport(); return; }
    if (t.closest('[data-mclose]') || t.id === 'modal') { closeModal(); return; }
    const cp = t.closest('[data-copy]');
    if (cp) { navigator.clipboard?.writeText(cp.dataset.copy).catch(() => {}); toast('Скопировано'); return; }
    const cd = t.closest('[data-confirm-decide]');
    if (cd) { applyDecision(cd.dataset.confirmDecide); return; }
    const cs = t.closest('[data-confirm-sd]');
    if (cs) {
      const e = EX[cs.dataset.confirmSd];
      if (e.nextPlan) { const ev = e.events.find((x) => x.t === 'plan' && x._d && x._d.getTime() === e.nextPlan.d.getTime()); if (ev) ev.sd = 'SD0002461' + (100 + Math.floor(Math.random() * 800)); }
      prepare(e); closeModal(); toast('SD-заявка создана и привязана к шагу включения'); rerender();
      if ($('#drawer').classList.contains('open')) openPassport(e.id);
      return;
    }
    const cg = t.closest('[data-confirm-generic]');
    if (cg) { closeModal(); toast(cg.dataset.confirmGeneric); return; }
    const opt = t.closest('.opt');
    if (opt) { const g = opt.parentElement; $$('.opt', g).forEach((o) => o.classList.remove('sel')); opt.classList.add('sel'); }
    const act = t.closest('[data-act]');
    if (act) {
      ev.preventDefault();
      const e = EX[act.dataset.id];
      switch (act.dataset.act) {
        case 'decide': decideModal(e); break;
        case 'results': openPassport(e.id, 'results'); break;
        case 'sd': sdModal(e); break;
        case 'plan': sdModal(e); break;
        case 'addevent': addEventModal(e); break;
        case 'newtest': newTestModal(); break;
        case 'snooze': toast('Отложено до завтра 10:00'); break;
        case 'remind': toast(`Напомню ${e.minAt ? fmtH(e.minAt) : 'в день среза'} в 10:00`); break;
        case 'archive': toast('Черновик на АБ-платформе отправлен в архив'); break;
        case 'cleanup': toast('Добавлено в «Удаление тоглов, ч. 22» (релиз 17.16)'); break;
        case 'cross': openPassport(e.id, 'results'); break;
        case 'link': toast('В рабочей версии откроется внешняя ссылка'); break;
        case 'pilot': {
          rolloutPlan(addDays(TODAY, 1)).forEach((p, i) => e.events.push({ d: fmt(p.d, true), t: 'plan', b: p.b, v: e.variants[0].v, txt: `План: включить ${e.variants[0].v}`, sd: i === 0 ? 'SD0002462' + (100 + Math.floor(Math.random() * 800)) : undefined }));
          e.stage = 'enabling'; e.dates.rolloutStart = fmt(addDays(TODAY, 1), true); prepare(e);
          toast('План раскатки на всех создан, SD на первый шаг заведена'); rerender(); if ($('#drawer').classList.contains('open')) openPassport(e.id); break;
        }
        case 'check': e.check.done = `Проверено ${fmt(TODAY)}: без отклонений`; prepare(e); toast('Проверка после раскатки отмечена'); rerender(); if ($('#drawer').classList.contains('open')) openPassport(e.id); break;
        case 'open': default: if (e) openPassport(e.id);
      }
    }
  });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { closeModal(); closePassport(); } });
  document.addEventListener('input', (ev) => {
    if (!ev.target.matches('[data-hsearch]')) return;
    const q = ev.target.value.trim().toLowerCase();
    $$('.fhist', ev.target.closest('details')).forEach((r) => { r.style.display = !q || r.dataset.htext.includes(q) ? '' : 'none'; });
  });
  window.addEventListener('hashchange', route);
}

function bucketOf(a) {

  if (a.due && days(TODAY, a.due) <= 0) return 'today';
