const MON_G = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const dayTitle = (d) => `${WD_S[d.getDay()]}, ${d.getDate()} ${MON_G[d.getMonth()]}${d.getFullYear() !== TODAY.getFullYear() ? ' ' + d.getFullYear() : ''}`;

function pultTaskFilter(S) {
  return (a) => (S.scope === 'team' || a.e.owner === ME || (a.rule === 'needsd' && dutyNow() === ME)) && (!S.stage || S.stage.includes(a.e.stage));
}

/* ---------- вкладка «Сегодня» ---------- */
function renderToday(S) {
  const { now, later } = buildTasks(pultTaskFilter(S));
  const by = (ks) => EXPERIMENTS.filter((e) => ks.includes(e.stage));
  const tiles = [
    { k: ['enabling'], label: 'Включаются', foot: () => { const s = by(['enabling']).filter((e) => e.alerts.some((a) => a.rule === 'stuck')).length; return s ? `<b>${s} стоит</b>` : 'по плану'; } },
    { k: ['collecting'], label: 'Сбор данных', foot: () => `${by(['collecting']).filter((e) => e.lookAt && e.type !== 'holdout' && days(TODAY, e.lookAt) <= 7).length} готовы на неделе` },
    { k: ['ready'], label: 'Готовы к анализу', foot: () => { const n = by(['ready']).filter((e) => !e.decision).length; return n ? `<b>${n} без решения</b>` : 'всё разобрано'; } },
    { k: ['rollout'], label: 'Раскатка решения', foot: () => 'по плану' },
    { k: ['cleanup'], label: 'Чистка', foot: () => { const n = by(['cleanup']).filter((e) => e.alerts.some((a) => a.sev === 'serious')).length; return n ? `<b>${n} просрочено</b>` : 'в сроке'; } },
  ];

  const live = EXPERIMENTS.filter((e) => ['collecting', 'ready'].includes(e.stage) && e.platform === 'Запущен').sort((a, b) => (a.lookAt || 0) - (b.lookAt || 0));
  const liveF = [];
  live.forEach((e) => { let g = liveF.find((x) => x.fid === e.fid); if (!g) { g = { fid: e.fid, tests: [] }; liveF.push(g); } g.tests.push(e); });
  const moving = EXPERIMENTS.filter((e) => ['enabling', 'rollout'].includes(e.stage));

  return `
    <div class="tiles compact">
      ${tiles.map((t) => { const on = S.stage && S.stage.join() === t.k.join(); return `<button class="tile ${on ? 'on' : ''}" data-stage="${t.k.join(',')}">
        <span class="lbl">${stageDot(t.k[0])}${t.label}</span><span class="row" style="align-items:baseline;gap:8px"><span class="val">${by(t.k).length}</span><span class="foot">${t.foot()}</span></span></button>`; }).join('')}
    </div>
    <div class="grid-2" style="grid-template-columns:minmax(0,1fr) 380px">
      <div>
        <div class="section-label" style="margin-top:0">Сделать <span class="cnt">${now.length}</span>${S.stage ? `<span style="text-transform:none;letter-spacing:0" class="muted">· ${STAGE[S.stage[0]].name}</span><button class="btn sm ghost" data-stage="">Сбросить</button>` : ''}</div>
        <div class="tasks">${now.map((t) => taskRow(t)).join('') || '<div class="empty" style="padding:14px 16px">Всё сделано</div>'}</div>
        ${later.length ? `<button class="later-toggle" data-later>${S.showLater ? 'Скрыть' : `Позже и к сведению · ${later.length}`} <span style="display:inline-block;transform:rotate(${S.showLater ? -90 : 90}deg)">›</span></button>
        ${S.showLater ? `<div class="tasks">${later.map((t) => taskRow(t)).join('')}</div>` : ''}` : ''}
      </div>
      <div class="stack" style="gap:14px;position:sticky;top:64px">
        <div class="card"><div class="card-h"><h3>В эфире</h3><span class="sp"></span><span class="small muted">${live.length}</span></div>
          <div class="card-b">
          ${liveF.map((g) => g.tests.length === 1
    ? `<div class="lrow"><a href="#" data-open="${g.tests[0].id}" class="lname" title="${esc(g.tests[0].short)}">${esc(g.tests[0].short)}</a>${readinessBar(g.tests[0], true)}</div>`
    : `<div class="lrow"><a href="#" data-open="${g.tests[0].id}" class="lname" title="${esc(g.tests[0].feature)}">${esc(g.tests[0].feature)}</a><span class="small muted">${g.tests.length} ${plural(g.tests.length, 'тест', 'теста', 'тестов')}</span></div>
      ${g.tests.map((t) => `<div class="lrow sub"><a href="#" data-open="${t.id}" class="lname">${esc(t.label)}</a>${readinessBar(t, true)}</div>`).join('')}`).join('')}
          </div></div>
        <div class="card"><div class="card-h"><h3>Включение по блокам</h3></div>
          <div class="card-b">
          ${moving.map((e) => `<div class="lrow"><a href="#" data-open="${e.id}" class="lname" title="${esc(e.short)}">${esc(e.short)}</a><span class="row" style="gap:8px">${miniBlocks(e)}<span class="small nowrap ${e.nextPlan ? 'muted' : ''}" style="${e.nextPlan ? '' : 'color:#8a5d00;font-weight:600'}">${e.nextPlan ? fmt(e.nextPlan.d) : 'стоит'}</span></span></div>`).join('')}
          </div></div>
      </div>
    </div>`;
}

/* ---------- вкладка «Журнал включений» ---------- */
function renderJournal() {
  const J = journalState;
  const all = [];
  EXPERIMENTS.forEach((e) => e.events.forEach((ev) => { if (ev.b && ['beta', 'ab', 'on', 'pause', 'plan'].includes(ev.t)) all.push({ e, ev }); }));
  const blockOk = (ev) => J.block === 'all' || (J.block === 'Бета+' ? ev.b !== 'all' && ev.b.includes('Бета+') : ev.b === 'all' || ev.b.includes(J.block));
  const kindOk = (e) => J.kind === 'all' || (J.kind === 'ab' ? e.type !== 'rollout' : e.type === 'rollout');
  const q = J.q.trim().toLowerCase();
  const qOk = (x) => !q || `${x.e.short} ${x.ev.sd || ''} ${x.e.key}`.toLowerCase().includes(q);
  const from = J.period === 'all' ? null : addDays(TODAY, -Number(J.period));
  const list = all.filter((x) => blockOk(x.ev) && kindOk(x.e) && qOk(x));
  const future = list.filter((x) => x.ev.t === 'plan' && x.ev._d > TODAY).sort((a, b) => a.ev._d - b.ev._d);
  const past = list.filter((x) => x.ev.t !== 'plan' && x.ev._d <= TODAY && (!from || x.ev._d >= from)).sort((a, b) => b.ev._d - a.ev._d);

  const kind = (ev) => ev.t === 'ab' ? ['ab', 'АБ'] : ev.t === 'on' ? ['on', ev.v || 'вкл'] : ev.t === 'beta' ? ['beta', 'Бета+'] : ev.t === 'pause' ? ['pause', 'стоп'] : ['plan', ev.v || 'АБ'];
  const row = (x) => { const [k, l] = kind(x.ev); return `<div class="jl${x.ev._d > TODAY ? ' fut' : ''}" data-open="${x.e.id}">
    <span class="jl-when">${x.ev._d > TODAY ? fmt(x.ev._d) : ''}</span>
    <span class="jk k-${k}" title="${k === 'ab' ? 'Включён АБ' : k === 'on' ? 'Включено значение' : k === 'beta' ? 'Бета+' : k === 'pause' ? 'АБ остановлен' : 'Запланировано'}">${esc(l.length > 6 ? 'вкл' : l)}</span>
    <span class="jl-name">${esc(x.e.short)}${x.e.type === 'rollout' ? ' <span class="muted small">без АБ</span>' : ''}</span>
    <span class="jl-blk">${esc(x.ev.b.includes && x.ev.b.includes('Бета+') ? 'Бета+' : blockList(x.ev.b))}</span>
    <span class="jl-sd">${x.ev.sd || ''}</span>
    ${avatar(x.e.owner)}
  </div>`; };
  const groups = [];
  past.forEach((x) => { const k = fmt(x.ev._d, true); let g = groups.find((y) => y.k === k); if (!g) { g = { k, d: x.ev._d, items: [] }; groups.push(g); } g.items.push(x); });

  let summary = '';
  if (J.block !== 'all') {
    const abN = J.block === 'Бета+' ? 0 : EXPERIMENTS.filter((e) => e.st[J.block]?.s === 'ab').length;
    const onN = J.block === 'Бета+' ? EXPERIMENTS.filter((e) => e.beta && e.stage !== 'done').length : EXPERIMENTS.filter((e) => e.st[J.block]?.s === 'on').length;
    summary = `<div class="jsum">Сейчас на ${J.block === 'Бета+' ? 'Бета+' : 'блоке ' + J.block}: ${J.block === 'Бета+' ? '' : `<b>${abN}</b> АБ · `}<b>${onN}</b> включено</div>`;
  }

  return `
    <div class="row wrap" style="gap:10px;margin-bottom:14px">
      <div class="seg">${[['7', '7 дней'], ['30', '30 дней'], ['365', 'Год'], ['all', 'Всё']].map(([k, n]) => `<button class="${J.period === k ? 'on' : ''}" data-jp="${k}">${n}</button>`).join('')}</div>
      <select class="sel" id="j-block"><option value="all">Все блоки</option>${['Бета+', ...ALL_BLOCKS].map((b) => `<option ${J.block === b ? 'selected' : ''} value="${b}">${b === 'Бета+' ? b : 'Блок ' + b}</option>`).join('')}</select>
      <div class="seg">${[['all', 'Все'], ['ab', 'С АБ'], ['noab', 'Без АБ']].map(([k, n]) => `<button class="${J.kind === k ? 'on' : ''}" data-jk="${k}">${n}</button>`).join('')}</div>
      <span class="sp"></span>
      <div class="search" style="min-width:260px">${ICON.search}<input id="j-q" value="${esc(J.q)}" placeholder="Фича, SD, рубильник"></div>
    </div>
    ${summary}
    <div class="jfeed">
      ${future.length ? `<div class="jday">Запланировано <span class="cnt">${future.length}</span></div>${future.map(row).join('')}` : ''}
      ${groups.map((g) => `<div class="jday">${dayTitle(g.d)} <span class="cnt">${g.items.length}</span></div>${g.items.map(row).join('')}`).join('') || '<div class="empty" style="padding:16px">За период включений нет</div>'}
    </div>`;
}

/* ---------- вкладка «Все фичи» ---------- */
function featureRowsData() {
  return Object.values(FEATURES).map((f) => {
    const work = f.tests.filter((t) => t.stage !== 'done');
    const sevOf = (t) => (t.alerts.some((a) => a.sev !== 'info') ? SEV_ORDER[t.alerts.find((a) => a.sev !== 'info').sev] : 9);
    const doneAt = (t) => t.d.rolloutDoneAt || t.d.decisionAt || t.d.platformEnd || t.d.created;
    const primary = work.slice().sort((a, b) => sevOf(a) - sevOf(b) || STAGE[a.stage].i - STAGE[b.stage].i)[0] || f.tests.slice().sort((a, b) => doneAt(b) - doneAt(a))[0];
    const status = work.length ? 'work' : 'onall';
    const evs = f.tests.flatMap((t) => t.events.filter((ev) => ev._d <= TODAY)).sort((a, b) => b._d - a._d);
    return { f, work, primary, status, last: evs[0], hasAb: f.tests.some((t) => t.type !== 'rollout'), hasNoAb: f.tests.some((t) => t.type === 'rollout'), doneAt: doneAt(primary), sev: sevOf(primary) };
  });
}

function renderFeatures() {
  const C = catState;
  const rows = featureRowsData();
  const q = C.q.trim().toLowerCase();
  const hay = (r) => [r.f.name, ...r.f.tests.flatMap((t) => [t.key, t.seg, ...t.toggles.map((x) => x.n), ...t.events.map((ev) => ev.sd || '')])].join(' ').toLowerCase();
  const kindOk = (r) => C.kind === 'all' || (C.kind === 'ab' ? r.hasAb : r.hasNoAb);
  const views = [['work', 'В работе'], ['onall', 'Включены на всех'], ['all', 'Все']];
  const inView = (r, v) => v === 'all' || r.status === v;
  let list = rows.filter((r) => kindOk(r) && (q ? hay(r).includes(q) : inView(r, C.view)));
  list.sort((a, b) => (a.status === 'work' && b.status === 'work') ? a.sev - b.sev || STAGE[a.primary.stage].i - STAGE[b.primary.stage].i : a.status !== b.status ? (a.status === 'work' ? -1 : 1) : b.doneAt - a.doneAt);

  const tr = (r) => { const e = r.primary; const sev = e.alerts.find((a) => a.sev !== 'info');
    return `<tr class="clickable" data-open="${e.id}">
      <td style="width:28px;padding-right:0">${sev ? sevIcon(sev.sev) : ''}</td>
      <td class="fname"><b>${esc(r.f.name)}</b> <span class="muted small nowrap">${r.f.tests.length > 1 ? `${r.f.tests.length} ${plural(r.f.tests.length, 'тест', 'теста', 'тестов')}` : e.type === 'rollout' ? 'без АБ' : e.tag}</span></td>
      <td class="nowrap">${r.status === 'work' ? `${stageDot(e.stage)} ${STAGE[e.stage].name}` : `<span class="muted">на всех с</span> ${fmt(r.doneAt, true)}`}</td>
      <td>${miniBlocks(e)}</td>
      <td class="flast">${r.last ? `<span class="muted tnum">${fmt(r.last._d)}</span> ${esc(r.last.txt)}` : ''}</td>
      <td class="nowrap small">${esc(r.status === 'work' ? testBrief(e) : outcome(e))}</td>
      <td>${avatar(e.owner)}</td>
    </tr>`; };

  return `
    <div class="row wrap" style="gap:10px;margin-bottom:14px">
      <div class="seg">${views.map(([k, n]) => `<button class="${C.view === k && !q ? 'on' : ''}" data-cv="${k}">${n}<span class="cnt">${rows.filter((r) => kindOk(r) && inView(r, k)).length}</span></button>`).join('')}</div>
      <div class="seg">${[['all', 'Все'], ['ab', 'С АБ'], ['noab', 'Без АБ']].map(([k, n]) => `<button class="${C.kind === k ? 'on' : ''}" data-ck="${k}">${n}</button>`).join('')}</div>
      <span class="sp"></span>
      <div class="search" style="min-width:300px">${ICON.search}<input id="c-q" value="${esc(C.q)}" placeholder="Поиск по всем фичам: название, тогл, SD"></div>
    </div>
    ${q ? `<div class="small muted" style="margin:-6px 0 10px">Найдено во всех фичах: ${list.length}</div>` : ''}
    <div class="card" style="overflow-x:auto"><table class="t cat"><tbody>${list.map(tr).join('') || '<tr><td class="empty" style="padding:16px">Ничего не найдено</td></tr>'}</tbody></table></div>`;
}

/* ---------- экран ---------- */
function renderPult(root) {
  const S = pultState;
  const { now } = buildTasks(pultTaskFilter(S));
  const body = S.tab === 'journal' ? renderJournal() : S.tab === 'features' ? renderFeatures() : renderToday(S);
  root.innerHTML = `${appHead()}
  <div class="page">
    <div class="page-title" style="margin-bottom:6px">
      <div class="grow"><h1>Пульт</h1><div class="sub">${WD[TODAY.getDay()]}, ${TODAY.getDate()} ${MON_G[TODAY.getMonth()]} · дежурство по включению: ${dutyNow() === ME ? 'вы' : dutyNow()}, дальше ${DUTY[1].who}</div></div>
      ${S.tab === 'today' ? `<div class="seg"><button class="${S.scope === 'team' ? 'on' : ''}" data-scope="team">Вся команда</button><button class="${S.scope === 'mine' ? 'on' : ''}" data-scope="mine">Мои</button></div>` : ''}
    </div>
    <div class="utabs">
      <button class="${S.tab === 'today' ? 'on' : ''}" data-pt="today">Сегодня <span class="cnt">${now.length}</span></button>
      <button class="${S.tab === 'journal' ? 'on' : ''}" data-pt="journal">Журнал включений</button>
      <button class="${S.tab === 'features' ? 'on' : ''}" data-pt="features">Все фичи <span class="cnt">${Object.keys(FEATURES).length}</span></button>
    </div>
    ${body}
  </div>`;

  const rr = () => renderPult(root);
  const keepFocus = (id) => { const n = $('#' + id); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } };
  $$('[data-pt]', root).forEach((b) => b.onclick = () => { S.tab = b.dataset.pt; rr(); });
  $$('[data-scope]', root).forEach((b) => b.onclick = () => { S.scope = b.dataset.scope; rr(); });
  $$('[data-stage]', root).forEach((b) => b.onclick = () => { const v = b.dataset.stage; S.stage = !v || (S.stage && S.stage.join() === v) ? null : v.split(','); rr(); });
  const lt = $('[data-later]', root); if (lt) lt.onclick = () => { S.showLater = !S.showLater; rr(); };
  $$('[data-jp]', root).forEach((b) => b.onclick = () => { journalState.period = b.dataset.jp; rr(); });
  $$('[data-jk]', root).forEach((b) => b.onclick = () => { journalState.kind = b.dataset.jk; rr(); });
  const jb = $('#j-block'); if (jb) jb.onchange = () => { journalState.block = jb.value; rr(); };
  const jq = $('#j-q'); if (jq) jq.addEventListener('input', () => { journalState.q = jq.value; rr(); keepFocus('j-q'); });
  $$('[data-cv]', root).forEach((b) => b.onclick = () => { catState.view = b.dataset.cv; catState.q = ''; rr(); });
  $$('[data-ck]', root).forEach((b) => b.onclick = () => { catState.kind = b.dataset.ck; rr(); });
  const cq = $('#c-q'); if (cq) cq.addEventListener('input', () => { catState.q = cq.value; rr(); keepFocus('c-q'); });
}

VIEWS.pult = { render: renderPult };


/* ===================== 4. Умный тираж ===================== */

const regState = { q: '', view: 'active', tab: 'features', byRelease: true, open: new Set(['style14']) };
const REG_VIEWS = [
  { k: 'all', name: 'Все', f: () => true },
  { k: 'active', name: 'Активные АБ', f: (e) => e.type !== 'rollout' && ['enabling', 'collecting', 'ready', 'rollout'].includes(e.stage) },
  { k: 'enabling', name: 'Включаются', f: (e) => ['enabling', 'rollout'].includes(e.stage) },
  { k: 'ready', name: 'Готовы к анализу', f: (e) => e.stage === 'ready' || e.alerts.some((a) => a.rule === 'canlook') },
  { k: 'prep', name: 'В подготовке', f: (e) => ['prep', 'release'].includes(e.stage) },
  { k: 'cleanup', name: 'Ждут чистки', f: (e) => e.stage === 'cleanup' },
  { k: 'noab', name: 'Без АБ', f: (e) => e.type === 'rollout' },
  { k: 'onall', name: 'Включены на всех', f: (e) => e.stage === 'done' && (e.onCount === ALL_BLOCKS.length || e.type === 'rollout') },
  { k: 'done', name: 'Архив', f: (e) => e.stage === 'done' },
];

function lastEvent(e) {
  const past = e.events.filter((ev) => ev._d <= TODAY).sort((a, b) => b._d - a._d)[0];
  return past;
}

function abCell(e) {
  if (e.type === 'rollout') {
    const c = e.check || {};
    const st = c.done ? `<span class="sev-label good">${esc(c.done.split(':')[0])}</span>` : e.d.rolloutDoneAt && c.days ? `<span class="small ink2">проверка ${fmt(addDays(e.d.rolloutDoneAt, c.days))}</span>` : e.pilot ? `<span class="small ink2">пилот с ${e.pilot.since.slice(0, 5)}</span>` : `<span class="small ink2">проверка через ${c.days || 7} дн. после 100 %</span>`;
    return `<span class="chip">Без АБ</span><div style="margin-top:4px">${st}</div>` + (e.alerts.some((a) => a.rule === 'draft') ? '<div class="small"><span class="sev-label warn">Висит черновик</span></div>' : '');
  }
  if (['prep', 'release'].includes(e.stage)) return `<span class="small ink2">${e.platform === 'Новый' ? 'Создан на платформе' : ''}${e.d.plannedStart ? `<br>старт ${fmt(e.d.plannedStart)}` : ''}</span>`;
  if (['collecting', 'enabling'].includes(e.stage) && e.d.fullAt) return readinessBar(e, true);
  if (e.stage === 'enabling') return '<span class="small ink2">ещё включается</span>';
  if (e.stage === 'ready') return `${readinessBar(e, true)}<div class="small" style="margin-top:4px"><span class="sev-label serious">Нет решения</span></div>`;
  if (e.decision) {
    return `<span class="chip">${outcome(e)}</span><div class="small muted" style="margin-top:4px">решение ${e.decision.d.slice(0, 5)}</div>`;
  }
  return '';
}

function togglesCell(e) {
  if (!e.toggles.length) return '<span class="muted">—</span>';
  const todo = e.toggles.filter((x) => x.st === 'todo').length;
  const pl = e.toggles.filter((x) => x.st === 'planned').length;
  const done = e.toggles.filter((x) => x.st === 'done').length;
  const late = e.alerts.some((a) => a.rule === 'toggles' && a.sev === 'serious');
  if (!['cleanup', 'done'].includes(e.stage)) return `<span class="small muted nowrap" data-tip="${esc(e.toggles.map((x) => x.n).join(', '))}">${e.toggles.length} шт.</span>`;
  return `<div class="small">${done ? `<div class="sev-label good">${done} удалено</div>` : ''}${pl ? `<div class="sev-label info">${pl} в плане</div>` : ''}${todo ? `<div class="sev-label ${late ? 'serious' : 'warn'}">${todo} не удалено${late ? ' > 30 дн.' : ''}</div>` : ''}</div>`;
}

function regRow(e, S, nested = false) {
  const le = lastEvent(e);
  const isOpen = S.open.has(e.id);
  const sev = e.alerts.find((a) => ['crit', 'serious', 'warn'].includes(a.sev));
  return `<tr class="clickable" data-row="${e.id}">
    <td style="width:28px;padding-right:0"><button class="btn ghost sm" data-expand="${e.id}" style="padding:0 4px;transform:rotate(${isOpen ? 0 : -90}deg)">${ICON.chev}</button></td>
    <td class="rname" style="${nested ? 'padding-left:28px;border-left:3px solid var(--line-2)' : ''}">
      <div class="row" style="gap:6px;min-width:0">${sev ? `<span data-tip="${esc(sev.title)}">${sevIcon(sev.sev)}</span>` : ''}<a href="#" data-open="${e.id}" class="rlink">${esc(nested ? e.label : e.feature)}</a></div>
      <div class="row small muted" style="gap:6px;margin-top:3px;white-space:nowrap">${stageDot(e.stage)}<span>${STAGE[e.stage].name}</span><span>· ${e.type === 'rollout' ? 'без АБ' : e.tag}</span>${e.blockers ? `<span class="sev-label warn" data-tip="${esc(e.blockers)}">· блокер</span>` : ''}</div>
    </td>
    <td>${blockMatrix(e, { head: false, fixed: '31px' })}</td>
    <td class="rlast">
      ${le ? `<div class="ell" title="${esc(le.txt)}"><span class="muted tnum">${fmt(le._d)}</span> ${esc(le.txt)}</div>` : ''}
      ${e.nextPlan ? `<div class="ell muted" style="margin-top:3px">дальше ${fmt(e.nextPlan.d)}: ${blockList(e.nextPlan.blocks)}${e.nextPlan.sd ? '' : ' · <span class="sev-label warn">нет SD</span>'}</div>` : ''}
    </td>
    <td style="min-width:140px;max-width:170px">${abCell(e)}</td>
    <td style="white-space:nowrap">${togglesCell(e)}</td>
  </tr>
  ${isOpen ? `<tr><td></td><td colspan="5" style="background:var(--surface-2)">
    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:24px">
      <div><div class="row" style="margin-bottom:6px"><b class="grow">Журнал</b><button class="btn sm" data-act="addevent" data-id="${e.id}">${ICON.plus} Событие</button></div>${journal(e)}</div>
      <div class="stack" style="gap:12px">
        <div><b>Тоглы</b><div style="margin-top:4px">${toggleList(e)}</div></div>
        <div class="row"><button class="btn sm primary" data-open="${e.id}">Открыть паспорт</button>${e.stage === 'ready' ? `<button class="btn sm" data-act="decide" data-id="${e.id}">Записать решение</button>` : ''}${['enabling', 'rollout'].includes(e.stage) ? `<button class="btn sm" data-act="sd" data-id="${e.id}">SD на следующий шаг</button>` : ''}</div>
      </div>
    </div>
  </td></tr>` : ''}`;
}

function featureRows(f, items, S) {
  if (f.tests.length === 1) return items.map((e) => regRow(e, S)).join('');
  const hidden = f.tests.length - items.length;
  const worst = f.tests.flatMap((t) => t.alerts).filter((a) => ['crit', 'serious', 'warn'].includes(a.sev)).sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev])[0];
  const stages = [...new Set(f.tests.map((t) => t.stage))];
  return `<tr><td></td><td colspan="5" style="padding:10px 12px 4px">
      <div class="row wrap" style="gap:8px"><a href="#" data-open="${items[0].id}" style="font-weight:650;color:var(--ink);font-size:14px">${esc(f.name)}</a>
      <span class="small muted">${f.tests.length} ${plural(f.tests.length, 'теста', 'тестов', 'тестов')}${isParallel(f) ? ' по сегментам' : ''}${f.history.length ? ` · ещё ${f.history.length} в истории` : ''}${hidden ? ` · ${hidden} скрыто фильтром` : ''}</span>
      ${worst ? `<span data-tip="${esc(worst.title)}">${sevIcon(worst.sev)}</span>` : ''}</div>
    </td></tr>${items.map((e) => regRow(e, S, true)).join('')}`;
}

function rowsFor(list, S) {
  const fids = [...new Set(list.map((e) => e.fid))];
  return fids.map((fid) => featureRows(FEATURES[fid], list.filter((e) => e.fid === fid), S)).join('');
}

function renderRegistry(root) {
  const S = regState;
  const V = REG_VIEWS.find((v) => v.k === S.view);
  const q = S.q.trim().toLowerCase();
  const hay = (e) => [e.feature, e.seg, e.key, e.release, e.branch, e.owner, ...e.toggles.map((t) => t.n), ...e.events.map((ev) => ev.sd || '')].join(' ').toLowerCase();
  const list = q ? EXPERIMENTS.filter((e) => hay(e).includes(q)) : EXPERIMENTS.filter(V.f);
  const relOf = (v) => RELEASES.find((r) => r.v === v);
  const relKey = (v) => v.split('.').map(Number);
  const rels = [...new Set(list.map((e) => e.release))].sort((a, b) => { const [a1, a2] = relKey(a), [b1, b2] = relKey(b); return b1 - a1 || b2 - a2; });

  const toggles = EXPERIMENTS.flatMap((e) => e.toggles.map((t) => ({ ...t, e })));
  const tg = {
    late: toggles.filter((t) => t.st === 'todo' && t.e.alerts.some((a) => a.rule === 'toggles' && a.sev === 'serious')),
    todo: toggles.filter((t) => t.st === 'todo' && ['cleanup'].includes(t.e.stage) && !t.e.alerts.some((a) => a.rule === 'toggles' && a.sev === 'serious')),
    planned: toggles.filter((t) => t.st === 'planned'),
    later: toggles.filter((t) => t.st === 'todo' && !['cleanup', 'done'].includes(t.e.stage)),
    done: toggles.filter((t) => t.st === 'done'),
  };

  const head = `<tr><th></th><th>Фича · стадия · блокеры</th><th style="padding-bottom:6px"><div style="margin-bottom:4px">Где сейчас включено</div>${bmHeader('31px')}</th><th>Последнее событие · дальше</th><th>АБ</th><th>Тоглы</th></tr>`;

  root.innerHTML = `${appHead()}
  <style>.reg td .bm, .reg td .bm .c { width: 100%; min-width: 0; } .reg td .bm .c { font-size: 9.5px; padding: 0 1px; } .reg th .bm-grid .hd { font-size: 10px; } .reg table.t td, .reg table.t th { padding-left: 10px; padding-right: 10px; } .reg .meter-row { flex-wrap: wrap; row-gap: 2px; } .reg .meter-row .nowrap { white-space: normal; } .reg .meter-row .meter { flex: 1 1 100%; } .reg .rname { min-width: 240px; max-width: 300px; } .reg .rlink { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .reg .rlast { min-width: 170px; max-width: 220px; font-size: 12.5px; } .reg .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .reg table.t td { padding-top: 9px; padding-bottom: 9px; vertical-align: middle; }</style>
  <div class="page" style="max-width:none">
    <div class="page-title">
      <div class="grow"><h1>Тиражирование фич · Android</h1></div>
      <div class="seg"><button class="${S.tab === 'features' ? 'on' : ''}" data-tab="features">Фичи и АБ-тесты</button><button class="${S.tab === 'toggles' ? 'on' : ''}" data-tab="toggles">Удаление тоглов <span class="cnt">${tg.late.length + tg.todo.length}</span></button></div>
    </div>

    ${S.tab === 'features' ? `
    <div class="row wrap" style="margin-bottom:14px;gap:10px">
      <div class="seg">${REG_VIEWS.map((v) => `<button class="${S.view === v.k ? 'on' : ''}" data-view="${v.k}">${v.name}<span class="cnt">${EXPERIMENTS.filter(v.f).length}</span></button>`).join('')}</div>
      <span class="toggle ${S.byRelease ? 'on' : ''}" id="rg-rel"><i></i>Группировать по релизам</span>
      <span class="sp"></span>
      <div class="search" style="min-width:300px">${ICON.search}<input id="rg-q" value="${esc(S.q)}" placeholder="Поиск по всем фичам: название, тогл, SD, релиз"></div>
    </div>
    <div class="row wrap" style="margin:-4px 0 12px;gap:12px">${q ? `<span class="chip">Поиск по всем фичам, включая историю: найдено ${list.length}</span><button class="btn sm ghost" id="rg-clear">Сбросить</button>` : ''}<span class="sp"></span>${bmLegend()}</div>
    <div class="card reg" style="overflow-x:auto">
      <table class="t"><thead>${head}</thead><tbody>
      ${S.byRelease ? rels.map((r) => { const items = list.filter((e) => e.release === r); const rr = relOf(r); return `<tr><td colspan="6" style="background:var(--surface-3);padding:8px 12px;font-weight:650">Релиз ${r}${rr ? ` <span class="muted" style="font-weight:500">· ${rr.d}${D(rr.d) > TODAY ? ' · ещё не вышел' : ''}</span>` : ''} <span class="muted" style="font-weight:500">· ${new Set(items.map((e) => e.fid)).size} ${plural(new Set(items.map((e) => e.fid)).size, 'фича', 'фичи', 'фич')}, ${items.length} ${plural(items.length, 'тест', 'теста', 'тестов')}</span></td></tr>${rowsFor(items, S)}`; }).join('')
        : rowsFor(list, S)}
      </tbody></table>
      ${list.length ? '' : '<div class="empty" style="padding:24px">В этом представлении пусто</div>'}
    </div>
    ` : `
    <div style="max-width:900px">
      <div class="stack" style="gap:16px">
        ${[['Просрочено: раскатано больше 30 дней назад', tg.late, 'serious'], ['Пора планировать', tg.todo, 'warn'], ['Запланировано в «Удаление тоглов»', tg.planned, 'info'], ['Удалить после завершения теста', tg.later, null], ['Удалено', tg.done, 'good']].map(([t, arr, sv]) => `
        <div class="card"><div class="card-h">${sv ? sevIcon(sv) : ''}<h3>${t}</h3><span class="muted small">${arr.length}</span><span class="sp"></span>${sv === 'serious' || sv === 'warn' ? `<button class="btn sm" data-act="cleanup" data-id="${arr[0]?.e.id || ''}">Добавить все в ч. 22</button>` : ''}</div>
          <div class="card-b">${arr.length ? `<table class="t"><tbody>${(sv === null ? arr.slice(0, 5) : arr).map((x) => `<tr><td><span class="mono">${esc(x.n)}</span><div class="small muted">${x.kind}</div></td><td><a href="#" data-open="${x.e.id}">${esc(x.e.short)}</a> <span class="small muted">${x.e.tag}</span></td><td class="small ink2 nowrap">${x.where ? esc(x.where) : x.e.d.rolloutDoneAt ? `раскатано ${fmt(x.e.d.rolloutDoneAt)}` : STAGE[x.e.stage].name}</td></tr>`).join('')}</tbody></table>${sv === null && arr.length > 5 ? `<div class="small muted" style="padding-top:10px">и ещё ${arr.length - 5}: появятся в «Пора планировать», когда тест раскатят</div>` : ''}` : '<div class="empty">Нет</div>'}</div></div>`).join('')}
      </div>
    </div>`}
  </div>`;

  $$('[data-tab]', root).forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; renderRegistry(root); });
  $$('[data-view]', root).forEach((b) => b.onclick = () => { S.view = b.dataset.view; renderRegistry(root); });
  const rg = $('#rg-rel'); if (rg) rg.onclick = () => { S.byRelease = !S.byRelease; renderRegistry(root); };
  const qi = $('#rg-q'); if (qi) qi.addEventListener('input', () => { S.q = qi.value; renderRegistry(root); const n = $('#rg-q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
  const qc = $('#rg-clear'); if (qc) qc.onclick = () => { S.q = ''; renderRegistry(root); };
  $$('[data-expand]', root).forEach((b) => b.onclick = (ev) => { ev.stopPropagation(); const id = b.dataset.expand; S.open.has(id) ? S.open.delete(id) : S.open.add(id); renderRegistry(root); });
  $$('tr[data-row]', root).forEach((tr) => tr.addEventListener('click', (ev) => {
    if (ev.target.closest('a,button,[data-tip]')) return;
    const id = tr.dataset.row; S.open.has(id) ? S.open.delete(id) : S.open.add(id); renderRegistry(root);
  }));
}

VIEWS.registry = { render: renderRegistry };

const chatState = { msgs: null, flow: null, settings: { daily: true, weekly: true, escalate: true, ev: [true, true, true, true, true, true, false] } };

function meSay(text) { chatState.msgs.push({ from: 'me', time: '10:0' + Math.min(9, chatState.msgs.length), html: esc(text) }); }

    case 'win': {

      meSay(arg);
      const plan = rolloutPlan(addDays(TODAY, 1));

      botSay(`Записал: победил <b>${arg}</b>. Раскатать на все блоки по стандартному плану?<div class="cm-plan">${plan.map((p) => `<div><span class="tnum muted">${fmt(p.d)}</span> ${blockList(p.b)}</div>`).join('')}</div>`, [{ l: 'Да, создать план и SD', a: 'confirm', primary: true }, { l: 'Пока не раскатываем', a: 'later' }]); break;

        e.stage = 'rollout'; e.results.status = 'reviewed';

      if (arg === 'status') { meSay('/статус стиль 14'); botSay(statusCard(EX.style14)); }
      if (arg === 'status2') { meSay('/статус реакции'); botSay(statusCard(EX.reactions2), [{ l: 'Запланировать следующий шаг', a: 'plan2', primary: true }]); }
      if (arg === 'feat') { const f = FEATURES['f-activ-price']; meSay('/статус лендинги'); botSay(`<div style="font-weight:650">${esc(f.name)}</div><div class="small muted" style="margin-bottom:6px">${f.tests.length} АБ-теста · ${featureKind(f)}</div>${f.tests.map((t) => `<div style="margin:6px 0"><a href="#" data-open="${t.id}">${esc(t.label)}</a>${readinessBar(t)}</div>`).join('')}<div class="small ink2">Сегмент 99 ₽ маленький: выборка набирается медленнее, к плановой дате 03.12 не успеет.</div>`, [{ l: 'Продлить 99 ₽ до 07.12', a: 'extend', primary: true }, { l: 'Напомнить, когда будет готов 59 ₽', a: 'remind59' }]); }
      if (arg === 'hist') {
        const f = FEATURES['f-activ']; const past = pastOf(f); const c = (k) => past.filter((h) => h.kind === k).length;
        meSay('/история активация');
        botSay(`<div style="font-weight:650">${esc(f.name)}</div><div class="small ink2" style="margin:2px 0 8px">${past.length} тестов с ${esc(past[0].when)}: побед ${c('win')}, без эффекта ${c('none')}, остановлено ${c('stop')}. Сейчас идёт №34.</div>
          <div class="hstrip sm" style="margin-bottom:8px">${past.map((h) => `<i style="background:${HCOLOR[h.kind]}" data-tip="<b>${esc(h.it)} · ${esc(h.theme)}</b><br>${esc(h.what)}<br>${esc(h.out)}"></i>`).join('')}<i class="now"></i></div>
          <div class="small"><b>По теме №34 «Иллюстрация»:</b> ${past.filter((h) => h.theme === 'Иллюстрация').map((h) => `${esc(h.it)} — ${esc(h.out.toLowerCase())}`).join(', ')}. Маскот уже был в №19, тогда без эффекта.</div>`, [{ l: 'Открыть историю', a: 'open:activ34' }]);
      }
      if (arg === 'find') {
        const e = EX['h-bell'];
        meSay('/найти колокольчик');
        botSay(`Нашёл в истории 1 фичу:<div class="cm-plan" style="gap:4px"><div><a href="#" data-open="${e.id}"><b>${esc(e.feature)}</b></a></div>
          <div>Релиз ${e.release} · включена на всех клиентов ${fmt(e.d.rolloutDoneAt, true)} · без АБ</div>
          <div class="ink2">Почему без АБ: ${esc(e.noAb)}</div>
          <div class="ink2">Тоглы удалены: ${e.toggles.map((t) => `<span class="mono">${esc(t.n)}</span>`).join(', ')} — «${esc(e.toggles[0].where)}»</div></div>`, [{ l: 'Открыть паспорт', a: 'open:h-bell' }]);
      }
      if (arg === 'duty') { meSay('/дежурный'); botSay(`На этой неделе включает <b>${dutyNow()}</b> (вы). Дальше: ${DUTY.filter((d) => !d.now).map((d) => `${d.who} — ${d.week}`).join('; ')}.`); }
      if (arg === 'digest') { meSay('/сводка'); botSay(digestHTML()); }
      break;
    case 'extend': meSay('Продлить 99 ₽ до 07.12'); botSay('Продлил тест «сегмент 99 ₽» до 07.12 и обновил дату на АБ-платформе. Остальные сегменты идут по плану.'); break;
    case 'remind59': meSay('Напомнить, когда будет готов 59 ₽'); botSay(`Напомню ${fmtH(EX['ap-59'].lookAt)} в 10:00, когда сегмент 59 ₽ наберёт выборку.`); break;
    case 'plan2': meSay('Запланировать следующий шаг'); botSay('Предлагаю: 12.11 — 9, 8, 6, 5; 13.11 — 4, 3, 2, 1; 16.11 — SI1–SI4. Создать шаги и SD?', [{ l: 'Создать', a: 'plan2ok', primary: true }, { l: 'Изменить даты', a: 'open:reactions2' }]); break;
    case 'plan2ok': meSay('Создать'); botSay(`<div class="cm-ev">${sevIcon('good')}<b>План создан</b></div>3 шага включения добавлены в тираж, SD на 12.11 заведена.`); break;
  }
  renderAssistant(root, true);
}

function renderAssistant(root, keepScroll) {
  if (!chatState.msgs) initChat();
  const S = chatState.settings;
  const EVS = ['Тест завершился на АБ-платформе', 'Можно смотреть результаты', 'Тест идёт дольше плана', 'Включение застряло', 'Завтра включение без SD (дежурному)', 'Пора удалять тоглы', 'Мой тест пересекается с новым'];
  const weekly = {
    live: EXPERIMENTS.filter((e) => ['collecting', 'ready'].includes(e.stage) && e.platform === 'Запущен').length,
    dec: EXPERIMENTS.filter((e) => e.decision && days(D(e.decision.d), TODAY) <= 7).length,
    over: mergedAlerts().filter((a) => a.sev === 'crit' || a.sev === 'serious').length,
  };

  root.innerHTML = `
  <style>
    .asst { display:grid; grid-template-columns: minmax(0, 640px) minmax(320px, 1fr); gap: 24px; align-items: start; }
    .msgr { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; display:flex; flex-direction:column; height: calc(100vh - 140px); min-height: 560px; }
    .msgr-h { display:flex; align-items:center; gap:10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .msgr-b { flex:1; overflow-y:auto; padding: 16px; display:flex; flex-direction:column; gap: 12px; background: #f6f6f3; }
    .cm { display:flex; gap:8px; align-items:flex-end; max-width: 92%; }
    .cm.me { align-self:flex-end; flex-direction: row-reverse; }
    .bub { background: var(--surface); border-radius: 14px 14px 14px 4px; padding: 10px 12px; box-shadow: 0 0 0 1px var(--ring); font-size: 13.5px; }
    .cm.me .bub { background: #141413; color: #fff; border-radius: 14px 14px 4px 14px; box-shadow:none; }
    .bub .t { font-size: 11px; color: var(--muted); margin-top: 6px; text-align: right; }
    .cm.me .bub .t { color: #a9a8a0; }
    .cm-btns { display:flex; flex-wrap:wrap; gap:6px; margin-top: 10px; }
    .cm-sec { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 10px 0 4px; }
    .cm-li { display:flex; gap:8px; align-items:flex-start; padding: 3px 0; font-size: 13px; }
    .cm-ev { display:flex; gap:8px; align-items:center; margin-bottom: 4px; }
    .cm-plan { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); font-size: 12.5px; display:flex; flex-direction:column; gap:2px; }
    .msgr-f { border-top: 1px solid var(--line); padding: 10px 12px; display:flex; flex-direction:column; gap: 8px; }
    .cmds { display:flex; gap:6px; flex-wrap:wrap; }
    .cmds button { border:0; background: var(--surface-3); border-radius: 14px; padding: 4px 10px; font-size: 12px; cursor:pointer; font-family: var(--mono); }
    .cmds button:hover { background: var(--line); }
    .inp { display:flex; align-items:center; gap:8px; padding: 8px 12px; border-radius: 20px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font-size: 13px; }
    .bot-ava { width: 32px; height: 32px; border-radius: 10px; background:#141413; color:#fff; display:grid; place-items:center; font-weight:700; flex: 0 0 32px; }
    .set-row { display:flex; align-items:center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .set-row:last-child { border-bottom: 0; }
  </style>
  <div class="page">
    <div class="page-title"><div class="grow"><h1>Ассистент в мессенджере</h1><div class="sub">Кнопки в чате работают</div></div></div>
    <div class="asst">
      <div class="msgr">
        <div class="msgr-h"><span class="bot-ava">Р</span><div class="grow"><div style="font-weight:650">Радар АБ</div><div class="small muted">бот · команда [${TEAM.name}] ${TEAM.platform}</div></div><span class="chip">корпоративный мессенджер</span></div>
        <div class="msgr-b" id="chat">
          <div class="small muted" style="text-align:center">Сегодня</div>
          ${chatState.msgs.map((m, i) => `<div class="cm ${m.from}">${m.from === 'bot' ? '<span class="bot-ava" style="width:26px;height:26px;flex-basis:26px;font-size:11px;border-radius:8px">Р</span>' : ''}
            <div class="bub">${m.html}${m.btns ? `<div class="cm-btns">${m.btns.map((b) => `<button class="btn sm ${b.primary ? 'primary' : ''}" data-chat="${b.a}">${esc(b.l)}</button>`).join('')}</div>` : ''}<div class="t">${m.time}</div></div></div>`).join('')}
        </div>
        <div class="msgr-f">
          <div class="cmds"><button data-chat="cmd:digest">/сводка</button><button data-chat="cmd:status">/статус стиль 14</button><button data-chat="cmd:status2">/статус реакции</button><button data-chat="cmd:feat">/статус лендинги</button><button data-chat="cmd:hist">/история активация</button><button data-chat="cmd:find">/найти колокольчик</button><button data-chat="cmd:duty">/дежурный</button></div>
          <div class="inp">Напишите команду или вопрос: «что можно смотреть на этой неделе?»</div>
        </div>
      </div>

      <div class="stack" style="gap:16px">
        <div class="card"><div class="card-h"><h3>Что и когда присылать</h3></div><div class="card-b">
          <div class="set-row"><span class="toggle ${S.daily ? 'on' : ''}" data-set="daily"><i></i></span><span class="grow"><b>Утренняя сводка</b><br><span class="small ink2">по будням в 10:00, лично и в канал команды</span></span></div>
          <div class="set-row" style="flex-direction:column;align-items:stretch;gap:4px"><b>Сразу, когда случилось</b>
            ${EVS.map((n, i) => `<label class="row small" style="gap:8px;padding:3px 0;cursor:pointer"><span class="toggle ${S.ev[i] ? 'on' : ''}" data-ev="${i}"><i></i></span>${n}</label>`).join('')}
          </div>
          <div class="set-row"><span class="toggle ${S.escalate ? 'on' : ''}" data-set="escalate"><i></i></span><span class="grow"><b>Эскалация</b><br><span class="small ink2">если решение не записано 9 дней после окончания теста, написать руководителю</span></span></div>
          <div class="set-row"><span class="grow"><b>Тихие часы</b><br><span class="small ink2">20:00 – 09:00 и выходные, кроме критичного</span></span></div>
        </div></div>

        <div class="card"><div class="card-h"><span class="toggle ${S.weekly ? 'on' : ''}" data-set="weekly"><i></i></span><h3>Сводка руководителю</h3><span class="sp"></span><span class="small muted">пн, 10:00</span></div>
          <div class="card-b">
            <div class="bub" style="box-shadow:0 0 0 1px var(--line);background:var(--surface-2)">
              <div style="font-weight:650;margin-bottom:8px">АБ-тесты [${TEAM.name}] за неделю</div>
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">
                <div><div class="small muted">В эфире</div><div style="font-size:22px;font-weight:650">${weekly.live}</div></div>
                <div><div class="small muted">Решений за неделю</div><div style="font-size:22px;font-weight:650">${weekly.dec}</div></div>
                <div><div class="small muted">Просрочено</div><div style="font-size:22px;font-weight:650">${weekly.over}</div></div>
              </div>
              <div class="small"><b>Итоги:</b> «Близкие рядом, лендинг на CMS №2» — не хуже контроля, раскатываем 2.0. «Карточки под номером телефона №1» — победил 6.0, раскатано на 100 %.</div>
              <div class="small" style="margin-top:6px"><b>Нужно внимание:</b> «Стиль уведомлений №14» без решения 7 дней; АБ по ценовым сегментам идёт на 71 день дольше плана.</div>
            </div>
          </div></div>


      </div>
    </div>
  </div>`;

  const chat = $('#chat'); chat.scrollTop = keepScroll ? chat.scrollHeight : 0;
  $$('[data-chat]', root).forEach((b) => b.onclick = (ev) => { ev.preventDefault(); chatAct(b.dataset.chat, root); });
  $$('[data-set]', root).forEach((t) => t.onclick = () => { S[t.dataset.set] = !S[t.dataset.set]; renderAssistant(root); });
  $$('[data-ev]', root).forEach((t) => t.onclick = (ev) => { ev.preventDefault(); S.ev[+t.dataset.ev] = !S.ev[+t.dataset.ev]; renderAssistant(root); });
}

VIEWS.assistant = { render: (root) => renderAssistant(root, false) };

initTips();
initGlobal();
route();
</script>
</body>
</html>
