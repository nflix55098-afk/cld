/* ===================== 1. Статус по А/Б-тестам (бывш. «Пульт») ===================== */

const pultState = { tab: 'ab', scope: 'team', stage: null, showLater: false };
const journalState = { period: '30', block: 'all', kind: 'all', q: '' };
const catState = { view: 'work', kind: 'all', q: '' };

function bucketOf(a) {
  if (a.sev === 'crit' || a.sev === 'serious') return 'overdue';
  if (a.sev === 'warn' || a.sev === 'good') return 'today';
  if (a.due && days(TODAY, a.due) <= 0) return 'today';
  if (a.due && days(TODAY, a.due) <= 7) return 'week';
  return 'later';
}

const WD_S = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const MON_G = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const dayTitle = (d) => `${WD_S[d.getDay()]}, ${d.getDate()} ${MON_G[d.getMonth()]}${d.getFullYear() !== TODAY.getFullYear() ? ' ' + d.getFullYear() : ''}`;

function pultTaskFilter(S) {
  return (a) => (S.scope === 'team' || a.e.owner === ME || (a.rule === 'needsd' && dutyNow() === ME)) && (!S.stage || S.stage.includes(a.e.stage));
}

/* ---------- вкладка «А/Б-тесты» ---------- */
const abState = { view: 'active', fin: 'all', q: '', showRemind: false };

const isAbTest = (e) => e.type !== 'rollout';
const isFinished = (e) => isAbTest(e) && (e.platform === 'Завершён' || !!e.decision);
const isActive = (e) => isAbTest(e) && !isFinished(e) && ['enabling', 'collecting', 'ready'].includes(e.stage);
const isPreparing = (e) => isAbTest(e) && !isFinished(e) && ['prep', 'release'].includes(e.stage);

function splitText(e) {
  const sh = e.variants.map((v) => v.share);
  const parts = [];
  sh.forEach((x) => { const last = parts[parts.length - 1]; if (last && last.v === x) last.n++; else parts.push({ v: x, n: 1 }); });
  return parts.map((p) => (p.n > 2 ? `${p.v}×${p.n}` : Array(p.n).fill(p.v).join(' / '))).join(' / ');
}

function testCell(e) {
  return `<a href="#" data-open="${e.id}" class="tname" title="${esc(e.feature)}">${esc(e.feature)}</a>
    <div class="tsub"><span class="nowrap"><span class="it">№${e.iter}</span>${e.seg ? ' · ' + esc(e.seg) : ''}</span>${e.seg ? '' : ` · <span>${esc(e.branch)}</span>`}</div>`;
}

function finClass(e) {
  if (!e.decision) return 'nodec';
  if (e.flags.includes('stopped')) return 'stop';
  const o = outcome(e);
  return o.startsWith('Победил') || o.startsWith('Не хуже') ? 'win' : 'none';
}

function renderAB(S) {
  const A = abState;
  const mine = (e) => S.scope === 'team' || e.owner === ME;
  const q = A.q.trim().toLowerCase();
  const qOk = (e) => !q || `${e.feature} ${e.seg || ''} ${e.branch} ${e.key} №${e.iter}`.toLowerCase().includes(q);
  const active = EXPERIMENTS.filter((e) => isActive(e) && mine(e));
  const finished = EXPERIMENTS.filter((e) => isFinished(e) && mine(e));
  const prep = EXPERIMENTS.filter((e) => isPreparing(e) && mine(e));
  const { now, later } = buildTasks(pultTaskFilter(S));
  const critN = now.filter((t) => t.main.sev === 'crit' || t.main.sev === 'serious').length;

  const remind = `<div class="remind ${A.showRemind ? 'open' : ''}">
    <button class="remind-bar" data-remind aria-expanded="${A.showRemind}">${ICON.bell}<span class="r-title">Напоминания</span>
      <span class="horizon">
        <span class="hz ${critN ? 'crit' : ''}"><span class="pips">${now.filter((t) => ['crit', 'serious'].includes(t.main.sev)).map((t) => `<i class="${t.main.sev}"></i>`).join('')}</span><b>${critN}</b>просрочено</span>
        <span class="hz"><span class="pips">${now.filter((t) => !['crit', 'serious'].includes(t.main.sev)).map((t) => `<i class="${t.main.sev}"></i>`).join('')}</span><b>${now.length - critN}</b>сделать сегодня</span>
        <span class="hz"><span class="pips">${later.map(() => '<i class="info"></i>').join('')}</span><b>${later.length}</b>позже</span>
      </span><span class="sp"></span><span class="more"><span class="lbl">${A.showRemind ? 'Скрыть' : 'Показать'}</span>${ICON.chev}</span></button>
    ${A.showRemind ? `<div class="tasks flat">${now.map((t) => taskRow(t)).join('')}</div>
      ${later.length ? `<button class="later-toggle" data-later>${S.showLater ? 'Скрыть «Позже и к сведению»' : `Позже и к сведению · ${later.length}`}</button>${S.showLater ? `<div class="tasks flat">${later.map((t) => taskRow(t)).join('')}</div>` : ''}` : ''}` : ''}
  </div>`;

  let table = '';
  if (A.view === 'active') {
    const groups = [['ready', 'Готовы к анализу'], ['collecting', 'В расчёте'], ['enabling', 'В процессе тиража']]
      .map(([k, n]) => ({ k, n, items: active.filter((e) => e.stage === k && qOk(e)).sort((a, b) => (a.lookAt || TODAY) - (b.lookAt || TODAY)) }))
      .filter((g) => g.items.length);
    const row = (e) => {
      const sev = e.alerts.find((a) => a.sev !== 'info');
      return `<tr class="clickable" data-open="${e.id}">
        <td class="ic">${sev ? `<span data-tip="${esc(sev.title)}">${sevIcon(sev.sev)}</span>` : ''}</td>
        <td class="tcol">${testCell(e)}</td>
        <td class="nowrap wide" data-label="Блоки">${miniBlocks(e)}<div class="tsub">${e.coverage} из ${ALL_BLOCKS.length}${e.nextPlan ? ` · дальше ${fmt(e.nextPlan.d)}` : e.coverage < ALL_BLOCKS.length ? ' · <span class="c-warn">стоит</span>' : ''}</div></td>
        <td class="nowrap" data-label="День из плана">${e.d.fullAt ? `<span class="day${e.planEnd && TODAY > e.planEnd && !e.decision && e.platform === 'Запущен' ? ' over' : ''}"><b>${e.dayN}</b><span> / ${e.planDays}</span></span>` : '<span class="day"><span>—</span></span>'}<div class="tsub">${e.d.fullAt ? `на всех с ${fmt(e.d.fullAt)}` : e.d.enableStart ? `включается с ${fmt(e.d.enableStart)}` : ''}</div></td>
        <td class="rcol wide" data-label="Итоги">${e.d.fullAt ? readinessBar(e, true) : '<span class="small muted">после 100 % блоков</span>'}</td>
      </tr>`;
    };
    table = groups.length ? `<table class="t abt stacked has-ic"><thead><tr><th class="ic"></th><th>Тест и фича</th><th>Блоки</th><th>День из плана</th><th>Когда смотреть итоги</th></tr></thead><tbody>
      ${groups.map((g) => `<tr class="grp"><td colspan="5">${stageDot(g.k)}${g.n}<span class="muted">${g.items.length}</span></td></tr>${g.items.map(row).join('')}`).join('')}
    </tbody></table>` : '<div class="empty pad">Активных тестов нет</div>';
  } else if (A.view === 'finished') {
    const filters = [['all', 'Все'], ['nodec', 'Без решения'], ['win', 'Победы'], ['none', 'Без эффекта'], ['stop', 'Остановлены']];
    const list = finished.filter((e) => qOk(e) && (A.fin === 'all' || finClass(e) === A.fin))
      .sort((a, b) => (b.d.platformEnd || b.d.decisionAt || TODAY) - (a.d.platformEnd || a.d.decisionAt || TODAY));
    const stageNow = (e) => !e.decision ? '<span class="sev-label serious">Ждёт решения</span>' : `<span class="row tight">${stageDot(e.stage)}${e.stage === 'done' ? 'Закрыт' : STAGE[e.stage].name}</span>`;
    const row = (e) => {
      const best = e.results?.rows?.find((x) => !x.control);
      const end = e.d.platformEnd || e.d.decisionAt;
      return `<tr class="clickable" data-open="${e.id}">
        <td class="tcol">${testCell(e)}</td>
        <td class="nowrap" data-label="Период">${fmt(e.d.fullAt || e.d.enableStart, true)} – ${fmt(end, true)}<div class="tsub">${e.d.fullAt && end ? dn(days(e.d.fullAt, end)) : ''}</div></td>
        <td data-label="Итог">${e.decision ? `<span class="chip">${esc(outcome(e))}</span>` : '<span class="sev-label serious">Нет решения</span>'}<div class="tsub">${best && e.results.status !== 'invalid' ? `${sgn(best.delta)} п.п. · ${best.verdict || (best.sig ? 'значимо' : 'незначимо')}` : e.results?.status === 'invalid' ? 'данные невалидны' : ''}</div></td>
        <td class="small ink2 metric wide" data-label="Целевая метрика">${esc(e.metric || '—')}</td>
        <td class="nowrap small" data-label="Сейчас">${stageNow(e)}</td>
      </tr>`;
    };
    table = `<div class="card-tools">
        <div class="seg">${filters.map(([k, n]) => `<button class="${A.fin === k ? 'on' : ''}" data-fin="${k}">${n}<span class="cnt">${finished.filter((e) => k === 'all' || finClass(e) === k).length}</span></button>`).join('')}</div></div>
      ${list.length ? `<table class="t abt stacked"><thead><tr><th>Тест и фича</th><th>Период</th><th>Итог</th><th>Целевая метрика</th><th>Сейчас</th></tr></thead><tbody>
      ${list.map(row).join('')}</tbody></table>` : '<div class="empty pad">Нет тестов</div>'}`;
  } else {
    const row = (e) => `<tr class="clickable" data-open="${e.id}">
      <td class="tcol">${testCell(e)}</td>
      <td class="nowrap" data-label="Стадия"><span class="row tight">${stageDot(e.stage)}${STAGE[e.stage].name}</span></td>
      <td class="nowrap" data-label="Старт">${e.d.plannedStart ? `старт ${fmt(e.d.plannedStart, true)}` : '<span class="muted">дата не назначена</span>'}<div class="tsub">релиз ${e.release}</div></td>
      <td class="wide" data-label="Блокер">${e.blockers ? `<span class="sev-label warn">${esc(e.blockers)}</span>` : '<span class="muted">—</span>'}</td>
    </tr>`;
    const items = prep.filter(qOk);
    table = items.length ? `<table class="t abt stacked"><thead><tr><th>Тест и фича</th><th>Стадия</th><th>Старт</th><th>Блокер</th></tr></thead><tbody>${items.map(row).join('')}</tbody></table>` : '<div class="empty pad">Нет тестов</div>';
  }

  return `
    ${remind}
    <div class="toolbar">
      <div class="seg" role="tablist" aria-label="Вид списка">${[['active', 'Активные', active.length], ['finished', 'Завершённые', finished.length], ['prep', 'Готовятся', prep.length]].map(([k, n, c]) => `<button class="${A.view === k ? 'on' : ''}" data-abv="${k}">${n}<span class="cnt">${c}</span></button>`).join('')}</div>
      <span class="sp"></span>
      <div class="search">${ICON.search}<input id="ab-q" value="${esc(A.q)}" placeholder="Тест, фича, рубильник, №" aria-label="Поиск по тестам"></div>
    </div>
    <div class="card scroll">${table}</div>`;
}

/* ---------- вкладка «Журнал включений» ---------- */
function renderJournal() {
  const J = journalState;
  const all = [];
  EXPERIMENTS.forEach((e) => e.events.forEach((ev) => { if (ev.b && ['beta', 'ab', 'on', 'pause', 'plan'].includes(ev.t)) all.push({ e, ev }); }));
  const blockOk = (ev) => J.block === 'all' || (J.block === 'Бета+' ? ev.b !== 'all' && ev.b.includes('Бета+') : ev.b === 'all' || ev.b.includes(J.block));
  const kindOk = (e) => J.kind === 'all' || (J.kind === 'ab' ? e.type !== 'rollout' : e.type === 'rollout');
  const q = J.q.trim().toLowerCase();
  const qOk = (x) => !q || `${x.e.short} ${x.ev.sd || ''} ${x.e.key}`.toLowerCase().includes(q);
  const from = J.period === 'all' ? null : addDays(TODAY, -Number(J.period));
  const list = all.filter((x) => blockOk(x.ev) && kindOk(x.e) && qOk(x));
  const future = list.filter((x) => x.ev.t === 'plan' && x.ev._d > TODAY).sort((a, b) => a.ev._d - b.ev._d);
  const past = list.filter((x) => x.ev.t !== 'plan' && x.ev._d <= TODAY && (!from || x.ev._d >= from)).sort((a, b) => b.ev._d - a.ev._d);

  const kind = (ev) => ev.t === 'ab' ? ['ab', 'АБ'] : ev.t === 'on' ? ['on', ev.v || 'вкл'] : ev.t === 'beta' ? ['beta', 'Бета+'] : ev.t === 'pause' ? ['pause', 'стоп'] : ['plan', ev.v || 'АБ'];
  const row = (x) => { const [k, l] = kind(x.ev); return `<div class="jl${x.ev._d > TODAY ? ' fut' : ''}" data-open="${x.e.id}">
    <span class="jl-when">${x.ev._d > TODAY ? fmt(x.ev._d) : ''}</span>
    <span class="jk k-${k}" title="${k === 'ab' ? 'Включён АБ' : k === 'on' ? 'Включено значение' : k === 'beta' ? 'Бета+' : k === 'pause' ? 'АБ остановлен' : 'Запланировано'}">${esc(l.length > 6 ? 'вкл' : l)}</span>
    <span class="jl-name">${esc(x.e.short)}${x.e.type === 'rollout' ? '<span class="muted">без АБ</span>' : ''}</span>
    <span class="jl-blk">${esc(x.ev.b.includes && x.ev.b.includes('Бета+') ? 'Бета+' : blockList(x.ev.b))}</span>
    <span class="jl-sd">${x.ev.sd || ''}</span>
    ${avatar(x.e.owner)}
  </div>`; };
  const groups = [];
  past.forEach((x) => { const k = fmt(x.ev._d, true); let g = groups.find((y) => y.k === k); if (!g) { g = { k, d: x.ev._d, items: [] }; groups.push(g); } g.items.push(x); });

  let summary = '';
  if (J.block !== 'all') {
    const abN = J.block === 'Бета+' ? 0 : EXPERIMENTS.filter((e) => e.st[J.block]?.s === 'ab').length;
    const onN = J.block === 'Бета+' ? EXPERIMENTS.filter((e) => e.beta && e.stage !== 'done').length : EXPERIMENTS.filter((e) => e.st[J.block]?.s === 'on').length;
    summary = `<div class="jsum">Сейчас на ${J.block === 'Бета+' ? 'Бета+' : 'блоке ' + J.block}: ${J.block === 'Бета+' ? '' : `<b>${abN}</b> АБ · `}<b>${onN}</b> включено</div>`;
  }

  return `
    <div class="toolbar">
      <div class="seg" aria-label="Период">${[['7', '7 дней'], ['30', '30 дней'], ['365', 'Год'], ['all', 'Всё']].map(([k, n]) => `<button class="${J.period === k ? 'on' : ''}" data-jp="${k}">${n}</button>`).join('')}</div>
      <select class="sel" id="j-block" aria-label="Блок"><option value="all">Все блоки</option>${['Бета+', ...ALL_BLOCKS].map((b) => `<option ${J.block === b ? 'selected' : ''} value="${b}">${b === 'Бета+' ? b : 'Блок ' + b}</option>`).join('')}</select>
      <div class="seg">${[['all', 'Все'], ['ab', 'С АБ'], ['noab', 'Без АБ']].map(([k, n]) => `<button class="${J.kind === k ? 'on' : ''}" data-jk="${k}">${n}</button>`).join('')}</div>
      <span class="sp"></span>
      <div class="search">${ICON.search}<input id="j-q" value="${esc(J.q)}" placeholder="Фича, SD, рубильник" aria-label="Поиск по журналу"></div>
    </div>
    ${summary}
    <div class="jfeed">
      ${future.length ? `<div class="jday">Запланировано <span class="cnt">${future.length}</span></div>${future.map(row).join('')}` : ''}
      ${groups.map((g) => `<div class="jday">${dayTitle(g.d)} <span class="cnt">${g.items.length}</span></div>${g.items.map(row).join('')}`).join('') || '<div class="empty pad">За период включений нет</div>'}
    </div>`;
}

/* ---------- вкладка «Все фичи» ---------- */
function featureRowsData() {
  return Object.values(FEATURES).map((f) => {
    const work = f.tests.filter((t) => t.stage !== 'done');
    const sevOf = (t) => (t.alerts.some((a) => a.sev !== 'info') ? SEV_ORDER[t.alerts.find((a) => a.sev !== 'info').sev] : 9);
    const doneAt = (t) => t.d.rolloutDoneAt || t.d.decisionAt || t.d.platformEnd || t.d.created;
    const primary = work.slice().sort((a, b) => sevOf(a) - sevOf(b) || STAGE[a.stage].i - STAGE[b.stage].i)[0] || f.tests.slice().sort((a, b) => doneAt(b) - doneAt(a))[0];
    const status = work.length ? 'work' : 'onall';
    const evs = f.tests.flatMap((t) => t.events.filter((ev) => ev._d <= TODAY)).sort((a, b) => b._d - a._d);
    return { f, work, primary, status, last: evs[0], hasAb: f.tests.some((t) => t.type !== 'rollout'), hasNoAb: f.tests.some((t) => t.type === 'rollout'), doneAt: doneAt(primary), sev: sevOf(primary) };
  });
}

function renderFeatures() {
  const C = catState;
  const rows = featureRowsData();
  const q = C.q.trim().toLowerCase();
  const hay = (r) => [r.f.name, ...r.f.tests.flatMap((t) => [t.key, t.seg, ...t.toggles.map((x) => x.n), ...t.events.map((ev) => ev.sd || '')])].join(' ').toLowerCase();
  const kindOk = (r) => C.kind === 'all' || (C.kind === 'ab' ? r.hasAb : r.hasNoAb);
  const views = [['work', 'В работе'], ['onall', 'Включены на всех'], ['all', 'Все']];
  const inView = (r, v) => v === 'all' || r.status === v;
  let list = rows.filter((r) => kindOk(r) && (q ? hay(r).includes(q) : inView(r, C.view)));
  list.sort((a, b) => (a.status === 'work' && b.status === 'work') ? a.sev - b.sev || STAGE[a.primary.stage].i - STAGE[b.primary.stage].i : a.status !== b.status ? (a.status === 'work' ? -1 : 1) : b.doneAt - a.doneAt);

  const tr = (r) => { const e = r.primary; const sev = e.alerts.find((a) => a.sev !== 'info');
    return `<tr class="clickable" data-open="${e.id}">
      <td class="ic">${sev ? sevIcon(sev.sev) : ''}</td>
      <td class="tcol fname"><span class="tname">${esc(r.f.name)}</span><div class="tsub">${r.f.tests.length > 1 ? `${r.f.tests.length} ${plural(r.f.tests.length, 'тест', 'теста', 'тестов')}` : e.type === 'rollout' ? 'без АБ' : e.tag}</div></td>
      <td class="nowrap" data-label="Статус">${r.status === 'work' ? `<span class="row tight">${stageDot(e.stage)}${STAGE[e.stage].name}</span>` : `<span class="muted">на всех с</span> ${fmt(r.doneAt, true)}`}</td>
      <td class="wide" data-label="Блоки">${miniBlocks(e)}</td>
      <td class="flast wide" data-label="Последнее событие">${r.last ? `<span class="muted tnum">${fmt(r.last._d)}</span> ${esc(r.last.txt)}` : ''}</td>
      <td class="nowrap small" data-label="Сейчас">${esc(r.status === 'work' ? testBrief(e) : outcome(e))}</td>
      <td class="av">${avatar(e.owner)}</td>
    </tr>`; };

  return `
    <div class="toolbar">
      <div class="seg">${views.map(([k, n]) => `<button class="${C.view === k && !q ? 'on' : ''}" data-cv="${k}">${n}<span class="cnt">${rows.filter((r) => kindOk(r) && inView(r, k)).length}</span></button>`).join('')}</div>
      <div class="seg">${[['all', 'Все'], ['ab', 'С АБ'], ['noab', 'Без АБ']].map(([k, n]) => `<button class="${C.kind === k ? 'on' : ''}" data-ck="${k}">${n}</button>`).join('')}</div>
      <span class="sp"></span>
      <div class="search wide">${ICON.search}<input id="c-q" value="${esc(C.q)}" placeholder="Поиск по всем фичам: название, тогл, SD" aria-label="Поиск по фичам"></div>
    </div>
    ${q ? `<div class="found">Найдено во всех фичах: ${list.length}</div>` : ''}
    <div class="card scroll">${list.length ? `<table class="t cat stacked has-ic"><thead><tr><th class="ic"></th><th>Фича</th><th>Статус</th><th>Блоки</th><th>Последнее событие</th><th>Сейчас</th><th class="av"></th></tr></thead><tbody>${list.map(tr).join('')}</tbody></table>` : '<div class="empty pad">Ничего не найдено</div>'}</div>`;
}

/* ---------- экран ---------- */
function renderPult(root) {
  const S = pultState;
  const body = S.tab === 'journal' ? renderJournal() : S.tab === 'features' ? renderFeatures() : renderAB(S);
  const liveN = EXPERIMENTS.filter(isActive).length;
  const waitN = EXPERIMENTS.filter((e) => e.stage === 'ready' && !e.decision).length;
  const overN = buildTasks(pultTaskFilter(S)).now.filter((t) => t.main.sev === 'crit' || t.main.sev === 'serious').length;
  root.innerHTML = `${appHead()}
  <div class="page">
    <div class="page-head">
      <div><div class="eyebrow"><b>Вариант 01</b><i></i>${WD[TODAY.getDay()]}, ${TODAY.getDate()} ${MON_G[TODAY.getMonth()]}</div><h1>Статус по А/Б-тестам</h1></div>
      <div class="readouts">
        <button class="readout" data-ro="live"><span class="label">Активные</span><span class="v">${liveN}</span></button>
        <button class="readout ready" data-ro="live"><span class="label">Ждут решения</span><span class="v">${waitN}</span></button>
        <button class="readout crit" data-ro="over"><span class="label">Просрочено</span><span class="v">${overN}</span></button>
      </div>
    </div>
    <div class="utabs page-tabs">
      <button class="${S.tab === 'ab' ? 'on' : ''}" data-pt="ab">А/Б-тесты <span class="cnt">${EXPERIMENTS.filter(isActive).length}</span></button>
      <button class="${S.tab === 'journal' ? 'on' : ''}" data-pt="journal">Журнал включений</button>
      <button class="${S.tab === 'features' ? 'on' : ''}" data-pt="features">Все фичи <span class="cnt">${Object.keys(FEATURES).length}</span></button>
    </div>
    ${body}
  </div>`;

  const rr = () => renderPult(root);
  const keepFocus = (id) => { const n = $('#' + id); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } };
  $$('[data-pt]', root).forEach((b) => b.onclick = () => { S.tab = b.dataset.pt; rr(); });
  $$('[data-ro]', root).forEach((b) => b.onclick = () => { S.tab = 'ab'; abState.view = 'active'; if (b.dataset.ro === 'over') abState.showRemind = true; rr(); $('.remind', root)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
  $$('[data-stage]', root).forEach((b) => b.onclick = () => { const v = b.dataset.stage; S.stage = !v || (S.stage && S.stage.join() === v) ? null : v.split(','); rr(); });
  const lt = $('[data-later]', root); if (lt) lt.onclick = () => { S.showLater = !S.showLater; rr(); };
  const rb = $('[data-remind]', root); if (rb) rb.onclick = () => { abState.showRemind = !abState.showRemind; rr(); };
  $$('[data-abv]', root).forEach((b) => b.onclick = () => { abState.view = b.dataset.abv; rr(); });
  $$('[data-fin]', root).forEach((b) => b.onclick = () => { abState.fin = b.dataset.fin; rr(); });
  const aq = $('#ab-q'); if (aq) aq.addEventListener('input', () => { abState.q = aq.value; rr(); keepFocus('ab-q'); });
  $$('[data-jp]', root).forEach((b) => b.onclick = () => { journalState.period = b.dataset.jp; rr(); });
  $$('[data-jk]', root).forEach((b) => b.onclick = () => { journalState.kind = b.dataset.jk; rr(); });
  const jb = $('#j-block'); if (jb) jb.onchange = () => { journalState.block = jb.value; rr(); };
  const jq = $('#j-q'); if (jq) jq.addEventListener('input', () => { journalState.q = jq.value; rr(); keepFocus('j-q'); });
  $$('[data-cv]', root).forEach((b) => b.onclick = () => { catState.view = b.dataset.cv; catState.q = ''; rr(); });
  $$('[data-ck]', root).forEach((b) => b.onclick = () => { catState.kind = b.dataset.ck; rr(); });
  const cq = $('#c-q'); if (cq) cq.addEventListener('input', () => { catState.q = cq.value; rr(); keepFocus('c-q'); });
}

VIEWS.pult = { render: renderPult };


/* ===================== 4. Умный тираж ===================== */

const regState = { q: '', view: 'active', tab: 'features', byRelease: true, open: new Set(['style14']) };
const REG_VIEWS = [
  { k: 'all', name: 'Все', f: () => true },
  { k: 'active', name: 'Активные АБ', f: (e) => e.type !== 'rollout' && ['enabling', 'collecting', 'ready', 'rollout'].includes(e.stage) },
  { k: 'enabling', name: 'Включаются', f: (e) => ['enabling', 'rollout'].includes(e.stage) },
  { k: 'ready', name: 'Готовы к анализу', f: (e) => e.stage === 'ready' || e.alerts.some((a) => a.rule === 'canlook') },
  { k: 'prep', name: 'В подготовке', f: (e) => ['prep', 'release'].includes(e.stage) },
  { k: 'cleanup', name: 'Ждут чистки', f: (e) => e.stage === 'cleanup' },
  { k: 'noab', name: 'Без АБ', f: (e) => e.type === 'rollout' },
  { k: 'onall', name: 'Включены на всех', f: (e) => e.stage === 'done' && (e.onCount === ALL_BLOCKS.length || e.type === 'rollout') },
  { k: 'done', name: 'Архив', f: (e) => e.stage === 'done' },
];

function lastEvent(e) {
  const past = e.events.filter((ev) => ev._d <= TODAY).sort((a, b) => b._d - a._d)[0];
  return past;
}

function abCell(e) {
  if (e.type === 'rollout') {
    const c = e.check || {};
    const st = c.done ? `<span class="sev-label good">${esc(c.done.split(':')[0])}</span>` : e.d.rolloutDoneAt && c.days ? `<span class="ink2">проверка ${fmt(addDays(e.d.rolloutDoneAt, c.days))}</span>` : e.pilot ? `<span class="ink2">пилот с ${e.pilot.since.slice(0, 5)}</span>` : `<span class="ink2">проверка через ${c.days || 7} дн. после 100 %</span>`;
    return `<span class="chip">Без АБ</span><div class="small">${st}</div>` + (e.alerts.some((a) => a.rule === 'draft') ? '<div class="small"><span class="sev-label warn">Висит черновик</span></div>' : '');
  }
  if (['prep', 'release'].includes(e.stage)) return `<span class="small ink2">${e.platform === 'Новый' ? 'Создан на платформе' : ''}${e.d.plannedStart ? `<br>старт ${fmt(e.d.plannedStart)}` : ''}</span>`;
  if (['collecting', 'enabling'].includes(e.stage) && e.d.fullAt) return readinessBar(e, true);
  if (e.stage === 'enabling') return '<span class="small ink2">ещё включается</span>';
  if (e.stage === 'ready') return `${readinessBar(e, true)}<div class="small"><span class="sev-label serious">Нет решения</span></div>`;
  if (e.decision) {
    return `<span class="chip">${outcome(e)}</span><div class="small muted">решение ${e.decision.d.slice(0, 5)}</div>`;
  }
  return '';
}

function togglesCell(e) {
  if (!e.toggles.length) return '<span class="muted">—</span>';
  const todo = e.toggles.filter((x) => x.st === 'todo').length;
  const pl = e.toggles.filter((x) => x.st === 'planned').length;
  const done = e.toggles.filter((x) => x.st === 'done').length;
  const late = e.alerts.some((a) => a.rule === 'toggles' && a.sev === 'serious');
  if (!['cleanup', 'done'].includes(e.stage)) return `<span class="small muted nowrap" data-tip="${esc(e.toggles.map((x) => x.n).join(', '))}">${e.toggles.length} шт.</span>`;
  return `<div class="small">${done ? `<div class="sev-label good">${done} удалено</div>` : ''}${pl ? `<div class="sev-label info">${pl} в плане</div>` : ''}${todo ? `<div class="sev-label ${late ? 'serious' : 'warn'}">${todo} не удалено${late ? ' > 30 дн.' : ''}</div>` : ''}</div>`;
}

const REG_CELL = 'var(--bm-cell)';

function regRow(e, S, nested = false) {
  const le = lastEvent(e);
  const isOpen = S.open.has(e.id);
  const sev = e.alerts.find((a) => ['crit', 'serious', 'warn'].includes(a.sev));
  return `<tr class="clickable" data-row="${e.id}">
    <td class="exp"><button class="btn ghost sm icon${isOpen ? ' open' : ''}" data-expand="${e.id}" aria-expanded="${isOpen}" aria-label="${isOpen ? 'Свернуть' : 'Развернуть'}">${ICON.chev}</button></td>
    <td class="rname${nested ? ' nested' : ''}">
      <div class="row tight">${sev ? `<span data-tip="${esc(sev.title)}">${sevIcon(sev.sev)}</span>` : ''}<a href="#" data-open="${e.id}" class="rlink">${esc(nested ? e.label : e.feature)}</a></div>
      <div class="rmeta">${stageDot(e.stage)}<span>${STAGE[e.stage].name}</span><span>· ${e.type === 'rollout' ? 'без АБ' : e.tag}</span>${e.blockers ? `<span class="sev-label warn" data-tip="${esc(e.blockers)}">· блокер</span>` : ''}</div>
    </td>
    <td>${blockMatrix(e, { head: false, fixed: REG_CELL })}</td>
    <td class="rlast">
      ${le ? `<div class="ell" title="${esc(le.txt)}"><span class="muted tnum">${fmt(le._d)}</span> ${esc(le.txt)}</div>` : ''}
      ${e.nextPlan ? `<div class="ell muted">дальше ${fmt(e.nextPlan.d)}: ${blockList(e.nextPlan.blocks)}${e.nextPlan.sd ? '' : ' · <span class="sev-label warn">нет SD</span>'}</div>` : ''}
    </td>
    <td class="abcell">${abCell(e)}</td>
    <td>${togglesCell(e)}</td>
  </tr>
  ${isOpen ? `<tr class="detail"><td></td><td colspan="5">
    <div class="detail-grid">
      <div class="bg-2"><div class="row sub-h"><h4 class="grow">Журнал</h4><button class="btn sm" data-act="addevent" data-id="${e.id}">${ICON.plus} Событие</button></div>${journal(e)}</div>
      <div class="stack loose">
        <div><h4>Тоглы</h4>${toggleList(e)}</div>
        <div class="row wrap"><button class="btn sm primary" data-open="${e.id}">Открыть паспорт</button>${e.stage === 'ready' ? `<button class="btn sm" data-act="decide" data-id="${e.id}">Записать решение</button>` : ''}${['enabling', 'rollout'].includes(e.stage) ? `<button class="btn sm" data-act="sd" data-id="${e.id}">SD на следующий шаг</button>` : ''}</div>
      </div>
    </div>
  </td></tr>` : ''}`;
}

function featureRows(f, items, S) {
  if (f.tests.length === 1) return items.map((e) => regRow(e, S)).join('');
  const hidden = f.tests.length - items.length;
  const worst = f.tests.flatMap((t) => t.alerts).filter((a) => ['crit', 'serious', 'warn'].includes(a.sev)).sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev])[0];
  return `<tr class="feat"><td></td><td colspan="5">
      <div class="row wrap tight"><a href="#" data-open="${items[0].id}" class="fn">${esc(f.name)}</a>
      <span class="small muted">${f.tests.length} ${plural(f.tests.length, 'теста', 'тестов', 'тестов')}${isParallel(f) ? ' по сегментам' : ''}${f.history.length ? ` · ещё ${f.history.length} в истории` : ''}${hidden ? ` · ${hidden} скрыто фильтром` : ''}</span>
      ${worst ? `<span data-tip="${esc(worst.title)}">${sevIcon(worst.sev)}</span>` : ''}</div>
    </td></tr>${items.map((e) => regRow(e, S, true)).join('')}`;
}

function rowsFor(list, S) {
  const fids = [...new Set(list.map((e) => e.fid))];
  return fids.map((fid) => featureRows(FEATURES[fid], list.filter((e) => e.fid === fid), S)).join('');
}

function renderRegistry(root) {
  const S = regState;
  const V = REG_VIEWS.find((v) => v.k === S.view);
  const q = S.q.trim().toLowerCase();
  const hay = (e) => [e.feature, e.seg, e.key, e.release, e.branch, e.owner, ...e.toggles.map((t) => t.n), ...e.events.map((ev) => ev.sd || '')].join(' ').toLowerCase();
  const list = q ? EXPERIMENTS.filter((e) => hay(e).includes(q)) : EXPERIMENTS.filter(V.f);
  const relOf = (v) => RELEASES.find((r) => r.v === v);
  const relKey = (v) => v.split('.').map(Number);
  const rels = [...new Set(list.map((e) => e.release))].sort((a, b) => { const [a1, a2] = relKey(a), [b1, b2] = relKey(b); return b1 - a1 || b2 - a2; });

  const toggles = EXPERIMENTS.flatMap((e) => e.toggles.map((t) => ({ ...t, e })));
  const tg = {
    late: toggles.filter((t) => t.st === 'todo' && t.e.alerts.some((a) => a.rule === 'toggles' && a.sev === 'serious')),
    todo: toggles.filter((t) => t.st === 'todo' && ['cleanup'].includes(t.e.stage) && !t.e.alerts.some((a) => a.rule === 'toggles' && a.sev === 'serious')),
    planned: toggles.filter((t) => t.st === 'planned'),
    later: toggles.filter((t) => t.st === 'todo' && !['cleanup', 'done'].includes(t.e.stage)),
    done: toggles.filter((t) => t.st === 'done'),
  };

  const head = `<tr><th class="exp"></th><th>Фича · стадия · блокеры</th><th class="bmh"><div>Где сейчас включено</div>${bmHeader(REG_CELL)}</th><th class="last-h">Последнее событие · дальше</th><th class="ab-h">АБ</th><th class="tg-h">Тоглы</th></tr>`;
  const relRow = (r, items) => { const rr = relOf(r); const nf = new Set(items.map((e) => e.fid)).size;
    return `<tr class="rel"><td colspan="6"><span class="rel-l">Релиз</span><span class="rel-v">${r}</span><span class="muted">${rr ? `${rr.d}${D(rr.d) > TODAY ? ' · ещё не вышел' : ''} · ` : ''}${nf} ${plural(nf, 'фича', 'фичи', 'фич')}, ${items.length} ${plural(items.length, 'тест', 'теста', 'тестов')}</span></td></tr>`; };

  root.innerHTML = `${appHead()}
  <div class="page">
    <div class="page-head">
      <div><div class="eyebrow"><b>Вариант 02</b><i></i>Умный тираж<i></i>[${TEAM.name}] ${TEAM.platform}</div><h1>Тиражирование фич</h1><div class="sub">Строка тиража = фича, вложенные строки — её АБ-тесты. Вместо цвета ячейки — стадия, вместо текста дат — маршрут по блокам.</div></div>
    </div>
    <div class="utabs page-tabs">
      <button class="${S.tab === 'features' ? 'on' : ''}" data-tab="features">Фичи и АБ-тесты <span class="cnt">${EXPERIMENTS.length}</span></button>
      <button class="${S.tab === 'toggles' ? 'on' : ''}" data-tab="toggles">Удаление тоглов <span class="cnt">${tg.late.length + tg.todo.length}</span></button>
    </div>

    ${S.tab === 'features' ? `
    <div class="toolbar">
      <div class="seg" aria-label="Представление">${REG_VIEWS.map((v) => `<button class="${S.view === v.k ? 'on' : ''}" data-view="${v.k}">${v.name}<span class="cnt">${EXPERIMENTS.filter(v.f).length}</span></button>`).join('')}</div>
    </div>
    <div class="toolbar">
      <div class="search wide">${ICON.search}<input id="rg-q" value="${esc(S.q)}" placeholder="Поиск по всем фичам: название, тогл, SD, релиз" aria-label="Поиск по тиражу"></div>
      <button class="toggle ${S.byRelease ? 'on' : ''}" id="rg-rel" aria-pressed="${S.byRelease}"><i></i>Группировать по релизам</button>
      <span class="sp"></span>
      ${bmLegend()}
    </div>
    ${q ? `<div class="reg-meta"><span class="chip">Поиск по всем фичам, включая историю: найдено ${list.length}</span><button class="btn sm ghost" id="rg-clear">Сбросить</button></div>` : ''}
    <div class="card scroll reg">
      ${list.length ? `<table class="t"><thead>${head}</thead><tbody>
      ${S.byRelease ? rels.map((r) => { const items = list.filter((e) => e.release === r); return `${relRow(r, items)}${rowsFor(items, S)}`; }).join('') : rowsFor(list, S)}
      </tbody></table>` : '<div class="empty pad">В этом представлении пусто</div>'}
    </div>
    ` : `
    <div class="tg-board">
      ${[['Просрочено: раскатано больше 30 дней назад', tg.late, 'serious'], ['Пора планировать', tg.todo, 'warn'], ['Запланировано в «Удаление тоглов»', tg.planned, 'info'], ['Удалить после завершения теста', tg.later, null], ['Удалено', tg.done, 'good']].map(([t, arr, sv]) => `
      <div class="card"><div class="card-h">${sv ? sevIcon(sv) : ''}<h3>${t}</h3><span class="count">${arr.length}</span><span class="sp"></span>${sv === 'serious' || sv === 'warn' ? `<button class="btn sm" data-act="cleanup" data-id="${arr[0]?.e.id || ''}">Добавить все в ч. 22</button>` : ''}</div>
        ${arr.length ? `<div class="tbl-top"><table class="t stacked"><tbody>${(sv === null ? arr.slice(0, 5) : arr).map((x) => `<tr><td class="tcol"><span class="mono">${esc(x.n)}</span><div class="tsub">${x.kind}</div></td><td data-label="Фича"><a href="#" data-open="${x.e.id}">${esc(x.e.short)}</a> <span class="small muted">${x.e.tag}</span></td><td class="small ink2 nowrap" data-label="Где">${x.where ? esc(x.where) : x.e.d.rolloutDoneAt ? `раскатано ${fmt(x.e.d.rolloutDoneAt)}` : STAGE[x.e.stage].name}</td></tr>`).join('')}</tbody></table></div>${sv === null && arr.length > 5 ? `<div class="card-note">и ещё ${arr.length - 5}: появятся в «Пора планировать», когда тест раскатят</div>` : ''}` : '<div class="card-b"><div class="empty flush">Нет</div></div>'}</div>`).join('')}
    </div>`}
  </div>`;

  $$('[data-tab]', root).forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; renderRegistry(root); });
  $$('[data-view]', root).forEach((b) => b.onclick = () => { S.view = b.dataset.view; renderRegistry(root); });
  const rg = $('#rg-rel'); if (rg) rg.onclick = () => { S.byRelease = !S.byRelease; renderRegistry(root); };
  const qi = $('#rg-q'); if (qi) qi.addEventListener('input', () => { S.q = qi.value; renderRegistry(root); const n = $('#rg-q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
  const qc = $('#rg-clear'); if (qc) qc.onclick = () => { S.q = ''; renderRegistry(root); };
  $$('[data-expand]', root).forEach((b) => b.onclick = (ev) => { ev.stopPropagation(); const id = b.dataset.expand; S.open.has(id) ? S.open.delete(id) : S.open.add(id); renderRegistry(root); });
  $$('tr[data-row]', root).forEach((tr) => tr.addEventListener('click', (ev) => {
    if (ev.target.closest('a,button,[data-tip]')) return;
    const id = tr.dataset.row; S.open.has(id) ? S.open.delete(id) : S.open.add(id); renderRegistry(root);
  }));
}

VIEWS.registry = { render: renderRegistry };


/* ===================== 5. Ассистент в мессенджере ===================== */

const chatState = { msgs: null, flow: null, settings: { daily: true, weekly: true, escalate: true, ev: [true, true, true, true, true, true, false] } };

function digestHTML() {
  const { now, later } = buildTasks();
  const line = (t) => { const a = t.main; return `<div class="cm-li">${sevIcon(a.sev)}<span><b>${esc(TASK[a.rule] || a.title)}</b> · <a href="#" data-open="${a.e.id}">${esc(a.group ? a.e.feature : a.e.short)}</a> <span class="muted">${esc(shortOf(a))}</span></span></div>`; };
  return `<div class="bub-title">Сегодня ${now.length} ${plural(now.length, 'дело', 'дела', 'дел')} · [${TEAM.name}] ${TEAM.platform}</div>
    ${now.map(line).join('')}
    <div class="muted small mt-8">Ещё ${later.length} — позже и к сведению</div>`;
}

function statusCard(e) {
  return `<div class="bub-title">${esc(e.short)} <span class="muted">${e.tag}</span></div>
  <div class="row wrap tight">${stageChip(e.stage)}<span class="chip outline">АБ-платформа: ${e.platform}</span></div>
  <div class="row mt-8">${miniBlocks(e)}<span class="small muted">${e.coverage}/${ALL_BLOCKS.length} блоков</span></div>

  ${e.nextPlan ? `<div class="small ink2 mt-8">Следующий шаг: ${fmt(e.nextPlan.d)} — ${blockList(e.nextPlan.blocks)}</div>` : ''}
  ${e.alerts[0] ? `<div class="row top tight small mt-8">${sevIcon(e.alerts[0].sev)}<span>${esc(e.alerts[0].title)}</span></div>` : ''}`;
}

function initChat() {
  const s14 = EX.style14; const pay = EX['pay-spasibo']; const rp = EX['rp-99'];
  chatState.msgs = [
    { from: 'bot', time: '10:00', html: digestHTML(), btns: [{ l: 'Открыть статус по А/Б-тестам', a: 'goto:pult' }, { l: 'Только мои', a: 'mine' }] },
    { from: 'bot', time: '10:00', html: `<div class="cm-ev">${sevIcon('crit')}<b>Решение не записано уже 7 дней</b></div>Тест <a href="#" data-open="style14">${esc(s14.short)} №14</a> завершился на АБ-платформе 04.11. Результаты посчитаны: у трёх вариантов значимое снижение конверсии в «Стандарт», как и предполагала гипотеза.<div class="muted small mt-8">Владелец: ${s14.owner}. Если решения не будет до 13.11, напишу руководителю.</div>`, btns: [{ l: 'Записать решение', a: 'decide', primary: true }, { l: 'Показать результаты', a: 'open:style14' }, { l: 'Напомнить через 2 дня', a: 'snooze2' }] },
    { from: 'bot', time: '10:01', html: `<div class="cm-ev">${sevIcon('warn')}<b>Завтра включение без SD-заявки</b></div><a href="#" data-open="pay-spasibo">${esc(pay.short)}</a>: 12.11 по плану блоки 12, 9, 8, 7. Вы дежурная по включению на этой неделе. Значение в бете совпадает с веткой _beta, можно заводить.`, btns: [{ l: 'Создать SD', a: 'sd', primary: true }, { l: 'Перенести на день', a: 'move' }] },
    { from: 'bot', time: '10:01', html: `<div class="cm-ev">${sevIcon('warn')}<b>Пилот идёт 13 дней, решения о раскатке нет</b></div><a href="#" data-open="dep-switch">${esc(EX['dep-switch'].feature)}</a>. АБ по этой фиче не планируется: технический переезд. На пилотной группе 2 замечания, оба исправлены.`, btns: [{ l: 'Раскатать на всех по плану', a: 'pilotgo', primary: true }, { l: 'Продлить пилот на неделю', a: 'pilotext' }] },
    { from: 'bot', time: '10:01', html: `<div class="cm-ev">${sevIcon('crit')}<b>3 теста фичи идут на 71 день дольше плана</b></div><a href="#" data-open="rp-99">${esc(rp.feature)}</a>: результаты готовы с 25.08, трафик всё ещё делится 50/50. Результаты по сегментам разные:<div class="cm-plan">${['rp-99', 'rp-59', 'rp-0'].map((id) => `<div><a href="#" data-open="${id}">${esc(EX[id].label)}</a> · ${esc(testBrief(EX[id]))}</div>`).join('')}</div>`, btns: [{ l: 'Раскатать 2.0 в 99 ₽ и 0 ₽, в 59 ₽ оставить контроль', a: 'rpdecide', primary: true }, { l: 'Решать по каждому отдельно', a: 'open:rp-99' }, { l: 'Это не мой тест', a: 'reassign' }] },
  ];
}

function botSay(html, btns) { chatState.msgs.push({ from: 'bot', time: '10:0' + Math.min(9, chatState.msgs.length), html, btns }); }
function meSay(text) { chatState.msgs.push({ from: 'me', time: '10:0' + Math.min(9, chatState.msgs.length), html: esc(text) }); }

function chatAct(a, root) {
  const [k, arg] = a.split(':');
  const e = EX.style14;
  switch (k) {
    case 'goto': location.hash = '#' + arg; return;
    case 'open': openPassport(arg); return;
    case 'mine': meSay('Только мои');
      botSay(`Ваши тесты (${ME}):<br>${EXPERIMENTS.filter((x) => x.owner === ME && x.stage !== 'done').map((x) => `<div class="cm-li">${stageDot(x.stage)}<span><a href="#" data-open="${x.id}">${esc(x.short)}</a><br><span class="ink2">${STAGE[x.stage].name}${x.alerts[0] ? ' · ' + esc(x.alerts[0].title) : ''}</span></span></div>`).join('')}`); break;
    case 'decide':
      if (e.decision) { botSay('По этому тесту решение уже записано.'); break; }
      meSay('Записать решение');
      botSay('Какой вариант победил? Лучший значимый результат у <b>52.0</b> «Формальный язык без эмоциональной окраски»: −3,3 п.п. конверсии в «Стандарт», как и предполагала гипотеза.',
        [{ l: '52.0', a: 'win:52.0', primary: true }, { l: '48.0', a: 'win:48.0' }, { l: '49.0', a: 'win:49.0' }, { l: 'Оставить контроль', a: 'win:ctrl' }, { l: 'Перезапуск №15', a: 'win:restart' }]); break;
    case 'win': {
      if (arg === 'ctrl' || arg === 'restart') { meSay(arg === 'ctrl' ? 'Оставить контроль' : 'Перезапуск №15'); botSay(arg === 'ctrl' ? 'Записал: оставляем контроль 53.0. Через 30 дней напомню удалить рубильник pushStyleDescriptionAb.' : 'Завёл черновик: «[Уведомления] Android. Стиль уведомлений. Выводим 4+ стили. №15 Ветка: описание стиля Стандарт V2. 54.0-59.0. DD.MM.YYYY». Заполните варианты в паспорте.'); break; }
      meSay(arg);
      const plan = rolloutPlan(addDays(TODAY, 1));
      chatState.flow = arg;
      botSay(`Записал: победил <b>${arg}</b>. Раскатать на все блоки по стандартному плану?<div class="cm-plan">${plan.map((p) => `<div><span class="tnum muted">${fmt(p.d)}</span> ${blockList(p.b)}</div>`).join('')}</div>`, [{ l: 'Да, создать план и SD', a: 'confirm', primary: true }, { l: 'Пока не раскатываем', a: 'later' }]); break;
    }
    case 'confirm':
      meSay('Да, создать план и SD');
      if (!e.decision) {
        e.decision = { d: fmt(TODAY, true), who: ME, winner: chatState.flow || '52.0', text: `Раскатываем ${chatState.flow || '52.0'} на всех. Решение записано через бота.` };
        e.stage = 'rollout'; e.results.status = 'reviewed';
        e.events.push({ d: fmt(TODAY, true), t: 'decision', txt: `Решение: раскатываем ${e.decision.winner}` });
        rolloutPlan(addDays(TODAY, 1)).forEach((p, i) => e.events.push({ d: fmt(p.d, true), t: 'plan', b: p.b, v: e.decision.winner, txt: `План: включить ${e.decision.winner}`, sd: i === 0 ? 'SD0002460512' : undefined }));
        prepare(e);
      }
      botSay(`<div class="cm-ev">${sevIcon('good')}<b>Готово</b></div>Решение записано в паспорт, тираж и аналитику в Confluence. План раскатки создан, SD на ГФ: <span class="mono">SD0002460512</span>. Через 30 дней после раскатки напомню удалить <span class="mono">pushStyleDescriptionAb</span>.`, [{ l: 'Открыть паспорт', a: 'open:style14' }]); break;
    case 'rpdecide':
      meSay('Раскатать 2.0 в 99 ₽ и 0 ₽, в 59 ₽ оставить контроль');
      if (!EX['rp-99'].decision) ['rp-99', 'rp-59', 'rp-0'].forEach((id) => decideOne(EX[id]));
      botSay(`<div class="cm-ev">${sevIcon('good')}<b>Записал 3 решения</b></div><div class="cm-plan">${['rp-99', 'rp-59', 'rp-0'].map((id) => `<div>${esc(EX[id].label)} · ${esc(outcome(EX[id]))}</div>`).join('')}</div>Остановил АБ, создал план раскатки 2.0 для двух сегментов и задачу на удаление <span class="mono">returnNotificationsPrice2Ab</span>. Тесты 59 ₽ и 99/0 ₽ дальше живут каждый своей стадией.`, [{ l: 'Открыть паспорт', a: 'open:rp-59' }]); break;
    case 'pilotgo': {
      meSay('Раскатать на всех по плану');
      const d = EX['dep-switch'];
      if (d.stage === 'release') {
        rolloutPlan(addDays(TODAY, 1)).forEach((p, i) => d.events.push({ d: fmt(p.d, true), t: 'plan', b: p.b, v: '2.0', txt: 'План: включить 2.0', sd: i === 0 ? 'SD0002462411' : undefined }));
        d.stage = 'enabling'; d.dates.rolloutStart = fmt(addDays(TODAY, 1), true); prepare(d);
      }
      botSay(`<div class="cm-ev">${sevIcon('good')}<b>План раскатки создан</b></div><div class="cm-plan">${rolloutPlan(addDays(TODAY, 1)).map((p) => `<div><span class="tnum muted">${fmt(p.d)}</span> ${blockList(p.b)}</div>`).join('')}</div>Через 7 дней после 100 % напомню проверить расхождения настроек и обращения: это контрольная точка вместо АБ.`); break;
    }
    case 'pilotext': meSay('Продлить пилот на неделю'); botSay('Продлил пилот до 18.11. Напомню в этот день.'); break;
    case 'later': meSay('Пока не раскатываем'); botSay('Хорошо, победитель записан, раскатку не планирую. Напомню через неделю.'); break;
    case 'snooze2': meSay('Напомнить через 2 дня'); botSay('Напомню 13.11 в 10:00. Если решения не будет, напишу руководителю.'); break;
    case 'sd': meSay('Создать SD'); botSay(`<div class="cm-ev">${sevIcon('good')}<b>Заявка создана</b></div><span class="mono">SD0002461337</span>: <span class="mono">payNotificationsBonusAb</span>, АБ 50/50, ПРОМ, блоки 12, 9, 8, 7, на 12.11.2026. Привязал её к шагу включения в тираже.`); break;
    case 'move': meSay('Перенести на день'); botSay('Перенёс шаг на 13.11. Остальные шаги сдвинулись на день: 6–1 на 16.11, SI1–SI4 на 17.11.'); break;
    case 'reassign': meSay('Это не мой тест'); botSay('Понял. Владелец по паспорту — Мария С., ей уже отправлено. Кому ещё переслать?', PEOPLE.filter((p) => p !== ME).map((p) => ({ l: p, a: 'sent' }))); break;
    case 'sent': meSay('Отправить'); botSay('Отправлено.'); break;
    case 'cmd':
      if (arg === 'status') { meSay('/статус стиль 14'); botSay(statusCard(EX.style14)); }
      if (arg === 'status2') { meSay('/статус реакции'); botSay(statusCard(EX.reactions2), [{ l: 'Запланировать следующий шаг', a: 'plan2', primary: true }]); }
      if (arg === 'feat') { const f = FEATURES['f-activ-price']; meSay('/статус лендинги'); botSay(`<div class="bub-title flush">${esc(f.name)}</div><div class="small muted cm-sub">${f.tests.length} АБ-теста · ${featureKind(f)}</div>${f.tests.map((t) => `<div class="cm-test"><a href="#" data-open="${t.id}">${esc(t.label)}</a>${readinessBar(t)}</div>`).join('')}<div class="small ink2">Сегмент 99 ₽ маленький: выборка набирается медленнее, к плановой дате 03.12 не успеет.</div>`, [{ l: 'Продлить 99 ₽ до 07.12', a: 'extend', primary: true }, { l: 'Напомнить, когда будет готов 59 ₽', a: 'remind59' }]); }
      if (arg === 'hist') {
        const f = FEATURES['f-activ']; const past = pastOf(f); const c = (k) => past.filter((h) => h.kind === k).length;
        meSay('/история активация');
        botSay(`<div class="bub-title flush">${esc(f.name)}</div><div class="small ink2 cm-sub">${past.length} тестов с ${esc(past[0].when)}: побед ${c('win')}, без эффекта ${c('none')}, остановлено ${c('stop')}. Сейчас идёт №34.</div>
          <div class="hstrip sm cm-sub">${past.map((h) => `<i style="background:${HCOLOR[h.kind]}" data-tip="<b>${esc(h.it)} · ${esc(h.theme)}</b><br>${esc(h.what)}<br>${esc(h.out)}"></i>`).join('')}<i class="now"></i></div>
          <div class="small"><b>По теме №34 «Иллюстрация»:</b> ${past.filter((h) => h.theme === 'Иллюстрация').map((h) => `${esc(h.it)} — ${esc(h.out.toLowerCase())}`).join(', ')}. Маскот уже был в №19, тогда без эффекта.</div>`, [{ l: 'Открыть историю', a: 'open:activ34' }]);
      }
      if (arg === 'find') {
        const e = EX['h-bell'];
        meSay('/найти колокольчик');
        botSay(`Нашёл в истории 1 фичу:<div class="cm-plan loose"><div><a href="#" data-open="${e.id}"><b>${esc(e.feature)}</b></a></div>
          <div>Релиз ${e.release} · включена на всех клиентов ${fmt(e.d.rolloutDoneAt, true)} · без АБ</div>
          <div class="ink2">Почему без АБ: ${esc(e.noAb)}</div>
          <div class="ink2">Тоглы удалены: ${e.toggles.map((t) => `<span class="mono">${esc(t.n)}</span>`).join(', ')} — «${esc(e.toggles[0].where)}»</div></div>`, [{ l: 'Открыть паспорт', a: 'open:h-bell' }]);
      }
      if (arg === 'duty') { meSay('/дежурный'); botSay(`На этой неделе включает <b>${dutyNow()}</b> (вы). Дальше: ${DUTY.filter((d) => !d.now).map((d) => `${d.who} — ${d.week}`).join('; ')}.`); }
      if (arg === 'digest') { meSay('/сводка'); botSay(digestHTML()); }
      break;
    case 'extend': meSay('Продлить 99 ₽ до 07.12'); botSay('Продлил тест «сегмент 99 ₽» до 07.12 и обновил дату на АБ-платформе. Остальные сегменты идут по плану.'); break;
    case 'remind59': meSay('Напомнить, когда будет готов 59 ₽'); botSay(`Напомню ${fmtH(EX['ap-59'].lookAt)} в 10:00, когда сегмент 59 ₽ наберёт выборку.`); break;
    case 'plan2': meSay('Запланировать следующий шаг'); botSay('Предлагаю: 12.11 — 9, 8, 6, 5; 13.11 — 4, 3, 2, 1; 16.11 — SI1–SI4. Создать шаги и SD?', [{ l: 'Создать', a: 'plan2ok', primary: true }, { l: 'Изменить даты', a: 'open:reactions2' }]); break;
    case 'plan2ok': meSay('Создать'); botSay(`<div class="cm-ev">${sevIcon('good')}<b>План создан</b></div>3 шага включения добавлены в тираж, SD на 12.11 заведена.`); break;
  }
  renderAssistant(root, true);
}

function renderAssistant(root, keepScroll) {
  if (!chatState.msgs) initChat();
  const S = chatState.settings;
  const EVS = ['Тест завершился на АБ-платформе', 'Можно смотреть результаты', 'Тест идёт дольше плана', 'Включение застряло', 'Завтра включение без SD (дежурному)', 'Пора удалять тоглы', 'Мой тест пересекается с новым'];
  const weekly = {
    live: EXPERIMENTS.filter((e) => ['collecting', 'ready'].includes(e.stage) && e.platform === 'Запущен').length,
    dec: EXPERIMENTS.filter((e) => e.decision && days(D(e.decision.d), TODAY) <= 7).length,
    over: mergedAlerts().filter((a) => a.sev === 'crit' || a.sev === 'serious').length,
  };

  root.innerHTML = `
  <div class="page">
    <div class="page-head"><div><div class="eyebrow"><b>Вариант 03</b><i></i>Ассистент<i></i>корпоративный мессенджер</div><h1>Ассистент в мессенджере</h1><div class="sub">Бот присылает дайджест и события, решения оформляются кнопками. Кнопки в чате работают.</div></div></div>
    <div class="asst">
      <section class="msgr" aria-label="Чат с ботом">
        <div class="msgr-h"><span class="bot-ava">${MARK(32)}</span><div class="grow"><div class="b">Радар АБ</div><div class="small muted">бот · команда [${TEAM.name}] ${TEAM.platform}</div></div><span class="chip">корпоративный мессенджер</span></div>
        <div class="msgr-b" id="chat">
          <div class="msgr-day">Сегодня</div>
          ${chatState.msgs.map((m) => `<div class="cm ${m.from}">${m.from === 'bot' ? `<span class="bot-ava sm">${MARK(26)}</span>` : ''}
            <div class="bub">${m.html}${m.btns ? `<div class="cm-btns">${m.btns.map((b) => `<button class="btn sm ${b.primary ? 'primary' : ''}" data-chat="${b.a}">${esc(b.l)}</button>`).join('')}</div>` : ''}<div class="t">${m.time}</div></div></div>`).join('')}
        </div>
        <div class="msgr-f">
          <div class="cmds"><button data-chat="cmd:digest">/сводка</button><button data-chat="cmd:status">/статус стиль 14</button><button data-chat="cmd:status2">/статус реакции</button><button data-chat="cmd:feat">/статус лендинги</button><button data-chat="cmd:hist">/история активация</button><button data-chat="cmd:find">/найти колокольчик</button><button data-chat="cmd:duty">/дежурный</button></div>
          <div class="inp">Напишите команду или вопрос: «что можно смотреть на этой неделе?»</div>
        </div>
      </section>

      <div class="stack loose">
        <div class="card"><div class="card-h"><h3>Что и когда присылать</h3></div><div class="card-b">
          <div class="set-row"><button class="toggle ${S.daily ? 'on' : ''}" data-set="daily" aria-pressed="${S.daily}" aria-label="Утренняя сводка"><i></i></button><span class="grow"><span class="set-title">Утренняя сводка</span><br><span class="small ink2">по будням в 10:00, лично и в канал команды</span></span></div>
          <div class="set-row col"><span class="set-title">Сразу, когда случилось</span>
            ${EVS.map((n, i) => `<label class="ev"><button class="toggle ${S.ev[i] ? 'on' : ''}" data-ev="${i}" aria-pressed="${S.ev[i]}"><i></i></button>${n}</label>`).join('')}
          </div>
          <div class="set-row"><button class="toggle ${S.escalate ? 'on' : ''}" data-set="escalate" aria-pressed="${S.escalate}" aria-label="Эскалация"><i></i></button><span class="grow"><span class="set-title">Эскалация</span><br><span class="small ink2">если решение не записано 9 дней после окончания теста, написать руководителю</span></span></div>
          <div class="set-row"><span class="grow indent"><span class="set-title">Тихие часы</span><br><span class="small ink2">20:00 – 09:00 и выходные, кроме критичного</span></span></div>
        </div></div>

        <div class="card"><div class="card-h"><button class="toggle ${S.weekly ? 'on' : ''}" data-set="weekly" aria-pressed="${S.weekly}" aria-label="Сводка руководителю"><i></i></button><h3>Сводка руководителю</h3><span class="sp"></span><span class="small muted">пн, 10:00</span></div>
          <div class="card-b">
            <div class="digest">
              <div class="b">АБ-тесты [${TEAM.name}] за неделю</div>
              <div class="stats">
                <div><div class="small muted">В эфире</div><div class="stat-v">${weekly.live}</div></div>
                <div><div class="small muted">Решений за неделю</div><div class="stat-v">${weekly.dec}</div></div>
                <div class="${weekly.over ? 'crit' : ''}"><div class="small muted">Просрочено</div><div class="stat-v">${weekly.over}</div></div>
              </div>
              <p class="small"><b>Итоги:</b> «Близкие рядом, лендинг на CMS №2» — не хуже контроля, раскатываем 2.0. «Карточки под номером телефона №1» — победил 6.0, раскатано на 100 %.</p>
              <p class="small"><b>Нужно внимание:</b> «Стиль уведомлений №14» без решения 7 дней; АБ по ценовым сегментам идёт на 71 день дольше плана.</p>
            </div>
          </div></div>
      </div>
    </div>
  </div>`;

  const chat = $('#chat'); chat.scrollTop = keepScroll ? chat.scrollHeight : 0;
  $$('[data-chat]', root).forEach((b) => b.onclick = (ev) => { ev.preventDefault(); chatAct(b.dataset.chat, root); });
  $$('[data-set]', root).forEach((t) => t.onclick = () => { S[t.dataset.set] = !S[t.dataset.set]; renderAssistant(root); });
  $$('[data-ev]', root).forEach((t) => t.onclick = (ev) => { ev.preventDefault(); S.ev[+t.dataset.ev] = !S.ev[+t.dataset.ev]; renderAssistant(root); });
}

VIEWS.assistant = { render: (root) => renderAssistant(root, false) };

initTips();
initGlobal();
route();
</script>
</body>
</html>
