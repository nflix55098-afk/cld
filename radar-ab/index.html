  bell: '<svg viewBox="0 0 16 16" width="15" height="15" fill="none"><path d="M4 11V7a4 4 0 0 1 8 0v4l1 1.2H3L4 11Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.5 13.6a1.6 1.6 0 0 0 3 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  plus: '<svg viewBox="0 0 16 16" width="14" height="14" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  flag: '<svg viewBox="0 0 16 16" width="12" height="12" fill="none"><path d="M4 14V2.5M4 3h7l-1.5 2.5L11 8H4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
};
/* Знак «Радар»: кольца дальности, сектор обзора и отметка цели */
const MARK = (size = 28, ink = '#121211', paper = '#f5f4f0') => `<svg class="logo-mark" width="${size}" height="${size}" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="14" fill="${ink}"/><circle cx="14" cy="14" r="8" fill="none" stroke="${paper}" stroke-opacity=".3"/><circle cx="14" cy="14" r="3.5" fill="none" stroke="${paper}" stroke-opacity=".3"/><path d="M14 14V1.5A12.5 12.5 0 0 1 24.83 7.75Z" fill="${paper}" fill-opacity=".2"/><path d="M14 14 24.83 7.75" stroke="${paper}" stroke-width="1.5" stroke-linecap="round"/><circle cx="18.2" cy="7.4" r="2.2" fill="#ff5a1f"/></svg>`;
const sevIcon = (sev) => `<span class="sev ${sev}" title="${SEV_NAME[sev]}">${ICON[sev]}</span>`;

/* ---------- производные поля ---------- */
const ALL_BLOCKS = BLOCKS;

function convName(e) {
  return `[${TEAM.name}] ${TEAM.platform}. ${e.feature}. №${e.iter} Ветка: ${e.branch} ${e.ver}. ${e.range}. ${e.launch}`;
}

function computeBlocks(e) {
  const st = {}; const plan = {}; let beta = null; let lastMove = null; let nextPlan = null;
  const evs = [...e.events].sort((a, b) => a._d - b._d);
  for (const ev of evs) {
    if (!ev.b) continue;
    const list = ev.b === 'all' ? ALL_BLOCKS : ev.b;
    if (ev.t === 'plan') {
      if (ev._d > TODAY) {
        list.forEach((b) => { if (!plan[b]) plan[b] = { d: ev._d, v: ev.v, sd: ev.sd }; });
        if (!nextPlan || ev._d < nextPlan.d) nextPlan = { d: ev._d, blocks: list, sd: ev.sd, v: ev.v };
      }
      continue;
    }
    if (ev._d > TODAY) continue;
    if (list.includes('Бета+')) { beta = { s: 'on', v: ev.v, d: ev._d }; continue; }
    list.forEach((b) => { st[b] = { s: ev.t, v: ev.v, d: ev._d }; delete plan[b]; });
    if (['ab', 'on'].includes(ev.t)) lastMove = ev._d;
  }
  return { st, plan, beta, lastMove, nextPlan };
}

function prepare(e) {
  e.events.forEach((ev) => { ev._d = D(ev.d); });
  e.d = Object.fromEntries(Object.entries(e.dates).map(([k, v]) => [k, D(v)]));
  e.name = convName(e);
  e.short = e.seg ? `${e.feature} · ${e.seg}` : e.feature;
  e.tag = `№${e.iter} · ${e.ver}`;
  e.label = e.seg ? e.seg[0].toUpperCase() + e.seg.slice(1) : `№${e.iter} ${e.ver} · ${e.branch}`;
  const fa = e.d.fullAt;
  e.minAt = fa && e.minDays ? addDays(fa, e.minDays) : null;
  /* «Можно смотреть» = набран минимальный срок И 100 % расчётной выборки (по текущему темпу) */
  e.sampleAt = fa && e.minAt ? (e.sample >= 100 ? e.minAt : addDays(fa, Math.ceil((Math.max(1, days(fa, TODAY)) * 100) / Math.max(1, e.sample)))) : null;
  e.lookAt = e.minAt ? (e.sampleAt > e.minAt ? e.sampleAt : e.minAt) : null;
  e.planEnd = e.d.planEnd || (fa && e.planDays ? addDays(fa, e.planDays) : null);
  const endAt = e.d.platformEnd && e.d.platformEnd < TODAY ? e.d.platformEnd : TODAY;
  e.dayN = fa ? days(fa, endAt) : null;
  Object.assign(e, computeBlocks(e));
  e.coverage = ALL_BLOCKS.filter((b) => e.st[b] && ['ab', 'on'].includes(e.st[b].s)).length;
  e.onCount = ALL_BLOCKS.filter((b) => e.st[b] && e.st[b].s === 'on').length;
  e.flags = e.flags || [];
  e.blockers = e.blockers || null;
  e.alerts = alertsFor(e);
  e.topSev = e.alerts.length ? e.alerts.reduce((m, a) => (SEV_ORDER[a.sev] < SEV_ORDER[m] ? a.sev : m), 'info') : null;
}

function blockList(list) {
  if (list === 'all' || (Array.isArray(list) && list.length === ALL_BLOCKS.length)) return 'все блоки';
  const L = [...list];
  const si = L.filter((b) => b.startsWith('SI'));
  const rest = L.filter((b) => !b.startsWith('SI'));
  const parts = [];
  if (rest.length) parts.push(rest.join(', '));
  if (si.length === 4) parts.push('SI1–SI4'); else if (si.length) parts.push(si.join(', '));
  return parts.join(', ');
}

function dutyNow() { return DUTY.find((x) => x.now).who; }

/* ---------- правила-напоминалки ---------- */
function alertsFor(e) {
  const A = [];
  const add = (sev, title, sub, due, act, rule) => A.push({ sev, title, sub, due, act, rule, e });
  const t = TODAY;

  if (e.blockers) add('warn', `Блокер: ${e.blockers}`, 'Пока блокер не снят, тест не стартует. Дату старта нельзя запланировать', null, { k: 'open', label: 'Открыть' }, 'blocker');
  if (e.type === 'ab' && !e.metric) add('warn', 'Не заполнена целевая метрика', 'Без неё не посчитать минимальный срок и выборку, а значит и дату, когда смотреть результаты', null, { k: 'open', label: 'Заполнить' }, 'nometric');

  if (e.stage === 'ready') {
    if (e.platform === 'Завершён' && !e.decision) {
      const n = days(e.d.platformEnd, t);
      if (n >= 3) add('crit', `Тест завершён ${dn(n)} назад, а решения нет`, 'Платформа посчитала итог, но вывод и следующий шаг (раскатка, перезапуск, откат) не записаны', e.d.platformEnd, { k: 'decide', label: 'Записать решение' }, 'nodecision');
      else add('good', 'Тест завершён: разберите результаты', 'Итог посчитан на платформе', e.d.platformEnd, { k: 'decide', label: 'Записать решение' }, 'nodecision');
    }
    if (e.platform === 'Запущен' && !e.decision && e.planEnd && e.planEnd < t) {
      const n = days(e.planEnd, t);
      add('crit', `Идёт на ${dn(n)} дольше плана`, `Результаты можно было смотреть с ${fmt(e.minAt)}, но их никто не разобрал. Трафик всё ещё делится между вариантами`, e.planEnd, { k: 'results', label: 'Смотреть результаты' }, 'overdue');
    }
  }

  if (e.stage === 'collecting' && e.type !== 'holdout' && e.lookAt) {
    const n = days(t, e.lookAt);
    if (n <= 0) add('good', 'Можно смотреть результаты', `Набран минимальный срок (${dn(e.minDays)}) и выборка`, e.lookAt, { k: 'results', label: 'Смотреть результаты' }, 'canlook');
    else add('info', `Результаты можно смотреть с ${fmtH(e.lookAt)}`, `День ${e.dayN} из ${e.planDays}, выборка ${e.sample}%. Если смотреть раньше, выводы будут ненадёжными`, e.lookAt, { k: 'remind', label: 'Напомнить мне' }, 'upcoming');
    if (e.planEnd && e.lookAt > e.planEnd) add('warn', 'Выборка не успевает к плановой дате', `При текущем темпе 100 % выборки будет только ${fmt(e.lookAt)}, а план окончания — ${fmt(e.planEnd)}. Продлите тест или пересмотрите минимальный эффект`, e.planEnd, { k: 'open', label: 'Открыть' }, 'slow');
  }

  if (e.type === 'holdout' && e.holdout) {
    add('info', `Срез холдаута ${fmtH(D(e.holdout.next))}`, `${e.holdout.lastNote}. Держим до ${e.holdout.until}`, D(e.holdout.next), { k: 'remind', label: 'Напомнить мне' }, 'holdout');
  }

  if (['enabling', 'rollout'].includes(e.stage)) {
    const np = e.nextPlan;
    const what = e.type === 'rollout' ? `включение ${e.variants[0].v}` : e.stage === 'rollout' ? `включение ${e.decision?.winner || ''}` : 'включение АБ';
    if (!np) {
      const n = e.lastMove ? days(e.lastMove, t) : 0;
      if (n >= 3) add('warn', `Включение стоит ${dn(n)}`, `Включено на ${e.coverage} из ${ALL_BLOCKS.length} блоков, следующий шаг не запланирован`, e.lastMove, { k: 'plan', label: 'Запланировать шаг' }, 'stuck');
    } else {
      const n = days(t, np.d);
      if (!np.sd && n <= 1) add('warn', `${n === 0 ? 'Сегодня' : 'Завтра'} ${what}: блоки ${blockList(np.blocks)}`, `SD-заявки пока нет. Дежурный по включению: ${dutyNow()}`, t, { k: 'sd', label: 'Создать SD-заявку' }, 'needsd');
      else add('info', `${rel(np.d)[0].toUpperCase() + rel(np.d).slice(1)}: ${what}, блоки ${blockList(np.blocks)}`, np.sd ? `Заявка ${np.sd} создана` : 'Заявку нужно создать за день до включения', np.d, { k: 'open', label: 'Открыть' }, 'nextstep');
    }
  }

  if (e.platform === 'Новый' && !e.d.enableStart && !e.d.plannedStart && !e.blockers && e.d.created) {
    const n = days(e.d.created, t);
    if (n >= 14) add('warn', `Черновик на АБ-платформе висит ${dn(n)}`, e.type === 'rollout' ? 'Фичу раскатили без АБ. Черновик теста лучше архивировать, чтобы он не путал' : 'Тест заведён, но не запущен. Запустите его или отправьте в архив', e.d.created, { k: 'archive', label: 'Архивировать черновик' }, 'draft');
  }

  if (e.stage === 'cleanup' && e.d.rolloutDoneAt) {
    const todo = e.toggles.filter((x) => x.st === 'todo');
    const n = days(e.d.rolloutDoneAt, t);
    if (todo.length && n >= 30) add('serious', `Раскатано ${dn(n)} назад, тоглы не удалены (${todo.length})`, todo.map((x) => x.n).join(', '), addDays(e.d.rolloutDoneAt, 30), { k: 'cleanup', label: 'В «Удаление тоглов»' }, 'toggles');
    else if (todo.length) add('info', `Запланировать удаление тоглов (${todo.length})`, `${todo.map((x) => x.n).join(', ')}. Срок: ${fmtH(addDays(e.d.rolloutDoneAt, 30))}`, addDays(e.d.rolloutDoneAt, 30), { k: 'cleanup', label: 'В «Удаление тоглов»' }, 'toggles');
  }

  if (['enabling', 'collecting', 'ready'].includes(e.stage) && e.type !== 'holdout' && e.cross.mixed >= 90) {
    add('warn', `Пересечения: ${e.cross.mixed}% выборки в других тестах`, `Пересекается с: ${e.cross.with.map((id) => EX[id] ? `${EX[id].feature} №${EX[id].iter}` : id).join('; ')}. Проверьте, не смешиваются ли эффекты`, null, { k: 'cross', label: 'Посмотреть' }, 'cross');
  }

  /* фичи без АБ: пилот и проверка после раскатки вместо результатов */
  if (e.pilot && e.stage === 'release') {
    const n = days(D(e.pilot.since), t);
    if (n >= 10 && !e.nextPlan) add('warn', `Пилот идёт ${dn(n)}, решения о раскатке нет`, `${e.pilot.group}. ${e.pilot.feedback}. Раскатываем на всех или продлеваем пилот?`, addDays(D(e.pilot.since), 10), { k: 'pilot', label: 'Запланировать раскатку' }, 'pilot');
  }
  if (e.type === 'rollout' && e.check && !e.check.done && e.d.rolloutDoneAt) {
    const due = addDays(e.d.rolloutDoneAt, e.check.days);
    if (due <= t) add('warn', 'Проверьте метрики после раскатки', `Вместо АБ: ${e.check.what}. Сравнение до и после, срок был ${fmt(due)}`, due, { k: 'check', label: 'Отметить проверку' }, 'postcheck');
    else add('info', `Проверка метрик после раскатки ${fmtH(due)}`, `Вместо АБ: ${e.check.what}`, due, { k: 'remind', label: 'Напомнить мне' }, 'postcheck');
  }
  /* длинная история: похожую гипотезу уже проверяли */
  if (e.theme && ['prep', 'release', 'enabling', 'collecting'].includes(e.stage)) {
    const hist = ((FEATURE_META[e.fid] || {}).history || []).filter((h) => h.theme === e.theme);
    if (hist.length) {
      const wins = hist.filter((h) => h.kind === 'win');
      add('info', `Тему «${e.theme}» уже проверяли ${hist.length} ${plural(hist.length, 'раз', 'раза', 'раз')}`, hist.map((h) => `${h.it} ${h.what} — ${h.out.toLowerCase()}`).join('; ') + (wins.length ? `. В проде сейчас победитель ${wins[wins.length - 1].it}` : ''), null, { k: 'open', label: 'История фичи' }, 'similar');
    }
  }

  if (e.stage === 'release' && e.d.plannedStart) {
    const r = RELEASES.find((x) => x.v === e.release);
    add('info', `Старт АБ ${fmtH(e.d.plannedStart)}, после раскатки релиза ${e.release}`, `Релиз ${e.release} выходит ${r ? r.d : ''}. Пилот на бете уже включён`, e.d.plannedStart, { k: 'open', label: 'Открыть' }, 'release');
  }

  return A.sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev]);
}

const EX = Object.fromEntries(EXPERIMENTS.map((e) => [e.id, e]));
function prepareAll() { EXPERIMENTS.forEach(prepare); }
prepareAll();
const allAlerts = () => EXPERIMENTS.flatMap((e) => e.alerts).sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev] || ((a.due || TODAY) - (b.due || TODAY)));

/* ---------- фича → несколько АБ-тестов ---------- */
const startOf = (e) => e.d.enableStart || e.d.plannedStart || e.d.created || TODAY;
const FEATURES = {};
EXPERIMENTS.forEach((e) => { (FEATURES[e.fid] = FEATURES[e.fid] || { id: e.fid, name: e.feature, tests: [], history: (FEATURE_META[e.fid] || {}).history || [] }).tests.push(e); });
Object.values(FEATURES).forEach((f) => f.tests.sort((a, b) => a.iter - b.iter || startOf(a) - startOf(b) || (a.seg || '').localeCompare(b.seg || '', 'ru', { numeric: true })));
const featureOf = (e) => FEATURES[e.fid];
const siblings = (e) => featureOf(e).tests;
const isParallel = (f) => f.tests.length > 1 && new Set(f.tests.map((t) => t.iter)).size < f.tests.length;
function featureKind(f) {
  if (f.tests.length < 2) return '';
  return isParallel(f) ? 'параллельные тесты по сегментам' : 'последовательные итерации';
}
const GROUP_TITLE = {
  upcoming: 'Результаты по тестам фичи будут готовы в разные дни',
  canlook: 'Можно смотреть результаты',
};
/* Напоминания по тестам одной фичи с одинаковым правилом склеиваются в одну строку */
function mergedAlerts() {
  const groups = new Map();
  allAlerts().forEach((a) => { const k = a.e.fid + '|' + a.rule; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(a); });
  const out = [];
  groups.forEach((arr) => {
    if (arr.length === 1) { out.push(arr[0]); return; }
    const worst = arr.reduce((m, a) => (SEV_ORDER[a.sev] < SEV_ORDER[m.sev] ? a : m));
    const same = arr.every((a) => a.title === arr[0].title);
    const due = arr.map((a) => a.due).filter(Boolean).sort((x, y) => x - y)[0] || null;
    out.push({ ...worst, group: arr, same, due, title: same ? arr[0].title : (GROUP_TITLE[worst.rule] || worst.title) });
  });
  return out.sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev] || ((a.due || TODAY) - (b.due || TODAY)));
}

function outcome(e) {
  if (e.flags.includes('stopped')) return 'Остановлен досрочно';
  if (e.type === 'rollout') return ['cleanup', 'done'].includes(e.stage) ? 'Раскатано без АБ' : 'Раскатка без АБ';
  if (!e.decision) return '';
  if (e.results?.direction === 'noninf') return `Не хуже контроля · ${e.decision.winner}`;
  const w = e.variants.find((v) => v.v === e.decision.winner);
  if (w && !w.control) return `Победил ${e.decision.winner}`;
  return 'Нет эффекта';
}

/* ---------- маленькие компоненты ---------- */
const stageDot = (k) => `<span class="dot" style="background:${STAGE[k].color}"></span>`;
const stageChip = (k) => `<span class="chip stage-chip" title="${esc(STAGE[k].hint)}">${stageDot(k)}${STAGE[k].name}</span>`;
const avatar = (n, lg) => `<span class="avatar${lg ? ' lg' : ''}" title="${esc(n)}">${initials(n)}</span>`;
const platChip = (p) => {

  return `<span class="chip outline" title="Статус на АБ-платформе">АБ-платформа: ${map[p] || p}</span>`;
};
const typeChip = (e) => e.type === 'holdout' ? '<span class="chip">Холдаут</span>' : e.type === 'rollout' ? '<span class="chip">Без АБ</span>' : '';

function cellState(e, b) {
  const s = e.st[b]; const p = e.plan[b];
  if (s && ['ab', 'on'].includes(s.s)) return { cls: s.s, txt: s.s === 'ab' ? 'АБ' : (s.v || 'вкл'), tip: `${s.s === 'ab' ? 'Идёт АБ' : 'Включено ' + (s.v || '')} с ${fmt(s.d)}` };
  if (p) return { cls: 'plan', txt: fmt(p.d), tip: `Запланировано на ${fmt(p.d, true)}${p.sd ? ' · ' + p.sd : ' · SD ещё не создана'}` };
  if (s && s.s === 'pause') return { cls: 'pause', txt: '—', tip: `АБ остановлен ${fmt(s.d)}, клиенты на ${s.v || 'контроле'}` };
  return { cls: '', txt: '', tip: 'Не включено' };
}

const BM_COLS = (beta = true) => {
  const c = [];
  if (beta) c.push({ h: 'Бета+', beta: true }, { gap: true });
  ALL_BLOCKS.forEach((b) => { c.push({ h: b }); if (b === 'ГФ' || b === '7' || b === '4' || b === '1') c.push({ gap: true }); });
  return c;
};
const bmTemplate = (fixed) => BM_COLS().map((c) => (c.gap ? '6px' : fixed ? (c.beta ? '40px' : fixed) : 'minmax(30px, auto)')).join(' ');
const bmHeader = (fixed) => `<div class="bm-grid" style="grid-template-columns:${bmTemplate(fixed)}">${BM_COLS().map((c) => (c.gap ? '<span></span>' : `<span class="hd">${c.h}</span>`)).join('')}</div>`;

function blockMatrix(e, { head = true, beta = true, fixed = null } = {}) {
  const cols = [];
  if (beta) cols.push({ h: 'Бета+', c: e.beta ? { cls: 'on', txt: e.beta.v && e.beta.v.length <= 4 ? e.beta.v : 'вкл', tip: `Бета+: включено ${e.beta.v || ''} с ${fmt(e.beta.d)}` } : { cls: '', txt: '', tip: 'Бета+: не включено' } });
  if (beta) cols.push({ gap: true });
  ALL_BLOCKS.forEach((b, i) => {
    cols.push({ h: b, c: cellState(e, b) });
    if (b === 'ГФ' || b === '7' || b === '4' || b === '1') cols.push({ gap: true });
  });
  /* Запланированная дата пишется один раз на волну: остальные ячейки волны — только штриховка */
  let prev = null;
  cols.forEach((c) => { if (c.gap) { prev = null; return; } const t = c.c.txt; if (c.c.cls === 'plan' && prev && prev.cls === 'plan' && prev.t === t) c.c = { ...c.c, txt: '' }; prev = { cls: c.c.cls, t }; });
  const tpl = fixed && beta ? bmTemplate(fixed) : cols.map((c) => (c.gap ? '6px' : 'minmax(30px, auto)')).join(' ');
  return `<div class="bm-grid" style="grid-template-columns:${tpl}">
    ${head ? cols.map((c) => (c.gap ? '<span></span>' : `<span class="hd">${c.h}</span>`)).join('') : ''}
    ${cols.map((c) => (c.gap ? '<span></span>' : `<span class="bm"><span class="c ${c.c.cls}" data-tip="<b>${esc(c.h)}</b><br>${esc(c.c.tip)}">${esc(c.c.txt)}</span></span>`)).join('')}
  </div>`;
}

function miniBlocks(e) {
  const parts = ALL_BLOCKS.map((b) => {
    const c = cellState(e, b);
    const sep = (b === 'ГФ' || b === '7' || b === '4' || b === '1') ? '<i class="sep"></i>' : '';
    return `<i class="${c.cls}"></i>${sep}`;
  }).join('');
  return `<span class="mini-bm" data-tip="${esc(miniTip(e))}">${parts}</span>`;
}
function miniTip(e) {
  const on = e.coverage; const p = Object.keys(e.plan).length;
  let s = `<b>Блоки: ${on} из ${ALL_BLOCKS.length}</b>`;
  if (p) s += `<br>Запланировано ещё ${p}${e.nextPlan ? ', следующий шаг ' + fmt(e.nextPlan.d) : ''}`;
  if (e.lastMove) s += `<br><span class="tmuted">Последнее движение ${fmt(e.lastMove)}</span>`;
  return s;
}

const bmLegend = () => `<div class="bm-legend">
  <span><i class="ab"></i>Идёт АБ</span><span><i class="on"></i>Включено значение</span>
  <span><i class="plan"></i>Запланировано</span><span><i class="pause"></i>АБ остановлен</span><span><i></i>Не включено</span></div>`;

/* Готовность результатов: можно ли уже смотреть */
function readiness(e) {
  if (!e.d.fullAt || !e.minAt) return null;
  const lookDays = days(e.d.fullAt, e.lookAt);
  const total = Math.max(e.planDays, lookDays); const n = Math.min(e.dayN, total);
  const over = e.planEnd && TODAY > e.planEnd && !e.decision && e.platform === 'Запущен';
  const canLook = TODAY >= e.lookAt;
  return { n, total, pct: Math.min(100, (e.dayN / total) * 100), minPct: Math.min(100, (lookDays / total) * 100), canLook, over, slow: e.lookAt > e.planEnd };
}
function readinessBar(e, compact) {
  const r = readiness(e);
  if (!r) return '';
  if (e.type === 'holdout') return `<div class="meter-row"><span class="nowrap">Холдаут · срез ${fmt(D(e.holdout.next))}</span></div>`;
  const cls = r.over ? 'over' : r.canLook ? 'ready' : '';
  const label = compact ? (r.over ? `<b class="c-crit">+${days(e.planEnd, TODAY)} дн. сверх плана</b>` : e.d.platformEnd ? `<b class="c-serious">завершён ${fmt(e.d.platformEnd)}</b>` : r.canLook ? '<b class="c-serious">можно смотреть</b>' : `итоги с ${fmt(e.lookAt)}${r.slow ? ' <b class="c-warn">· позже</b>' : ''}`)
    : r.over ? `<b class="c-crit">+${dn(days(e.planEnd, TODAY))} сверх плана</b>`
    : e.d.platformEnd ? `<b class="c-serious">завершён ${fmt(e.d.platformEnd)}</b>`
    : r.canLook ? '<b class="c-serious">можно смотреть</b>'
    : `смотреть ${rel(e.lookAt)}${r.slow ? ' <b class="c-warn">· позже плана</b>' : ''}`;
  return `<div class="meter-row" data-tip="<b>День ${e.dayN} из ${e.planDays}</b><br>Можно смотреть с ${fmt(e.lookAt, true)}<br><span class='tmuted'>минимальный срок: ${fmt(e.minAt)} · 100% выборки: ${fmt(e.sampleAt)}</span><br>План окончания: ${fmt(e.planEnd, true)}<br>Выборка: ${e.sample}% от расчётной">
    <div class="meter ${cls}"><b style="width:${r.pct}%"></b><span class="tick" style="left:calc(${r.minPct}% - 1px)"></span></div>
    <span class="nowrap">${compact ? '' : `день ${e.dayN}/${e.planDays} · `}${label}</span></div>`;
}

/* ---------- паспорт эксперимента (общий для всех вариантов) ---------- */
const VAR_COLORS = ['#2457f5', '#ff5a1f', '#12a35d', '#f2b300', '#8b5cf6', '#0aa3a3', '#e8457c', '#3f3e39'];
const DARK_TEXT = ['#f2b300', '#0aa3a3'];

function splitBar(e) {
  let i = 0;
  const vs = e.variants.map((v) => ({ ...v, color: v.control ? '#a8a69e' : VAR_COLORS[i++] }));
  return `<div class="split">${vs.map((v) => `<div class="${DARK_TEXT.includes(v.color) ? 'dk' : ''}" style="flex:${v.share};background:${v.color}" data-tip="<b>${v.v}</b> · ${v.share}%<br>${esc(v.name)}">${v.share >= 5 ? v.share + '%' : ''}</div>`).join('')}</div>
  <div class="var-list">${vs.map((v) => `<div class="row"><span class="dot sq" style="background:${v.color}"></span><span class="mono var-v">${v.v}</span><span class="ink2 grow">${esc(v.name)}${v.control ? ' <span class="chip xs">контроль</span>' : ''}</span><span class="tnum muted">${v.share}%</span></div>`).join('')}</div>`;
}

function forest(e) {
  const R = e.results;
  if (!R || !R.rows) return '';
  const rows = R.rows.filter((r) => !r.control);
  const ctrl = R.rows.find((r) => r.control);
  const lo = Math.min(0, R.threshold ?? 0, ...rows.map((r) => r.lo));
  const hi = Math.max(0, ...rows.map((r) => r.hi));
  const padv = (hi - lo) * 0.12 || 0.5;
  const L = lo - padv, H = hi + padv;
  const x = (v) => ((v - L) / (H - L)) * 100;
  const verdict = (r) => {
    if (r.verdict) return { c: 'var(--cobalt)', t: `${r.verdict} · в пределах порога` };
    if (!r.sig) return { c: 'var(--faint)', t: 'незначимо' };
    const good = R.direction === 'down' ? r.delta < 0 : r.delta > 0;
    return good ? { c: 'var(--cobalt)', t: `значимо ${r.delta > 0 ? '↑' : '↓'} · за гипотезу` } : { c: 'var(--crit)', t: `значимо ${r.delta > 0 ? '↑' : '↓'} · против гипотезы` };
  };
  return `<div class="forest">
    <div class="forest-row head"><span>Вариант</span><span>Значение</span><span>Разница с контролем, п.п. (95% ДИ)</span><span>Вывод</span></div>
    <div class="forest-row"><span class="fv"><span class="mono">${ctrl.v}</span> ${ctrl.label ? esc(ctrl.label) : 'контроль'}</span><span class="tnum">${num(ctrl.value)} %</span><span class="small muted">база для сравнения</span><span></span></div>
    ${rows.map((r) => { const vd = verdict(r); return `<div class="forest-row" data-tip="<b>${r.label || r.v}</b><br>${num(r.value)} % (Δ ${sgn(r.delta)} п.п.)<br>95% ДИ: ${sgn(r.lo)} … ${sgn(r.hi)}">
      <span class="fv"><span class="mono">${r.v}</span> ${r.label ? esc(r.label) : esc((e.variants.find((v) => v.v === r.v) || {}).name || '')}</span>
      <span class="tnum">${num(r.value)} %</span>
      <div class="forest-plot">
        <span class="zero" style="left:${x(0)}%"></span>
        ${R.threshold != null ? `<span class="thr" style="left:${x(R.threshold)}%" title="Порог «не хуже»"></span>` : ''}
        <span class="ci" style="left:${x(r.lo)}%;width:${x(r.hi) - x(r.lo)}%;background:${vd.c}"></span>
        <span class="pt" style="left:${x(r.delta)}%;background:${vd.c}"></span>
      </div>
      <span class="small"><b class="tnum">${sgn(r.delta)}</b> <span class="ink2">${vd.t}</span></span>
    </div>`; }).join('')}
    <div class="forest-row axis"><span></span><span></span><div class="forest-axis">${[0, lo, hi].filter((v, i, a) => a.indexOf(v) === i).filter((v, i, a) => i === 0 || Math.abs(x(v) - x(0)) >= 10).map((v) => `<span style="left:${x(v)}%">${v === 0 ? '0' : sgn(v)}</span>`).join('')}</div><span></span></div>
  </div>
  ${R.threshold != null ? `<div class="small muted">Красная линия — порог «не хуже»: ${sgn(R.threshold)} п.п.</div>` : ''}`;
}

const ROLLOUT_STEPS = { prep: 'Подготовка', release: 'Релиз и пилот', enabling: 'Раскатка по блокам', cleanup: 'Проверка и чистка', done: 'Архив' };
function stepper(e) {
  const noAb = e.type === 'rollout';
  const list = noAb ? STAGES.filter((s) => ROLLOUT_STEPS[s.k]) : STAGES;
  const cur = list.findIndex((s) => s.k === e.stage);
  const dateFor = { prep: e.d.created, release: e.pilot ? D(e.pilot.since) : null, enabling: noAb ? e.d.rolloutStart : e.d.enableStart, collecting: e.d.fullAt, ready: e.minAt && e.minAt <= TODAY ? e.minAt : null, rollout: e.decision ? D(e.decision.d) : null, cleanup: e.d.rolloutDoneAt, done: e.d.cleanupDoneAt };
  return `<div class="stepper" style="--n:${list.length}">${list.map((s, i) => `<div class="step ${i < cur ? 'done' : i === cur ? 'cur' : ''}" style="--c:${s.color}" title="${esc(s.hint)}"><span class="bar"></span><span><span class="sn">${noAb ? ROLLOUT_STEPS[s.k] : s.name}</span><small>${dateFor[s.k] && i <= cur ? fmt(dateFor[s.k]) : '&nbsp;'}</small></span></div>`).join('')}</div>`;
}

function journal(e) {
  const evs = [...e.events].sort((a, b) => b._d - a._d);
  const color = { ab: 'var(--st-collecting)', on: 'var(--st-cleanup)', beta: 'var(--st-release)', pause: 'var(--faint)', plan: 'var(--faint)', result: 'var(--st-ready)', decision: 'var(--st-rollout)', sys: 'var(--ink)', toggle: 'var(--st-cleanup)', note: 'var(--rule-2)' };
  return `<div class="journal">${evs.map((ev) => `<div class="jrow ${ev._d > TODAY ? 'future' : ''}">
    <span class="jd">${fmt(ev._d, true)}</span>
    <span class="jdot"><i style="${ev._d > TODAY ? '' : 'background:' + color[ev.t]}"></i></span>
    <span class="jtxt">${ev.t === 'sys' ? '<span class="chip xs">авто</span>' : ''}${esc(ev.txt)}${ev.b ? ` <span class="blk">· ${esc(blockList(ev.b))}</span>` : ''}${ev.v && ev.t !== 'ab' && !ev.txt.includes(ev.v) ? ` <span class="mono">${ev.v}</span>` : ''}${ev.sd ? `<span class="sd">${ev.sd}</span>` : ''}</span>
  </div>`).join('')}</div>`;
}

function toggleList(e) {
  if (!e.toggles.length) return '<div class="empty">Тоглов и рубильников нет</div>';
  const st = { todo: ['Не удалён', 'warn'], planned: ['Запланирован', 'info'], done: ['Удалён', 'good'] };
  return `<div class="tg-list">${e.toggles.map((x) => `<div class="tg-row">
    ${sevIcon(st[x.st][1])}
    <span class="grow"><span class="mono">${esc(x.n)}</span> <span class="muted small">· ${x.kind}</span>${x.where ? `<br><span class="small ink2">${esc(x.where)}</span>` : ''}</span>
    <span class="sev-label ${st[x.st][1]}">${st[x.st][0]}</span>
  </div>`).join('')}</div>`;
}

function crossBlock(e) {
  const c = e.cross;
  if (!c.clean && !c.mixed) return '<div class="empty">Нет пересечений: тест ещё не запущен или запущен без АБ</div>';
  return `<div class="split sm"><div style="flex:${Math.max(c.clean, 1)};background:var(--good)" data-tip="Чистая выборка: ${c.clean}%">${c.clean >= 8 ? c.clean + '%' : ''}</div><div style="flex:${c.mixed};background:var(--serious)" data-tip="Смешанная: ${c.mixed}%">${c.mixed >= 8 ? c.mixed + '%' : ''}</div></div>
  <div class="legend"><span><span class="dot" style="background:var(--good)"></span>Чистых ${c.clean}%</span><span><span class="dot" style="background:var(--serious)"></span>Смешанных ${c.mixed}%</span></div>
  ${c.with.length ? `<p class="small mt-12">Пересекается с: ${c.with.map((id) => EX[id] ? `<a href="#" data-open="${id}">${esc(EX[id].short)} №${EX[id].iter}</a>` : id).join(', ')}</p>` : ''}`;
}

function decisionBlock(e) {
  if (e.decision) {
    return `<div class="decision">${avatar(e.decision.who, true)}<div class="grow"><div class="who"><b>${esc(e.decision.who)}</b><span class="muted small">${e.decision.d}</span></div><p>${esc(e.decision.text)}</p>${e.decision.winner ? `<div class="mt-12"><span class="chip">Итоговое значение: <span class="mono">${e.decision.winner}</span></span></div>` : ''}</div></div>`;
  }
  if (['ready'].includes(e.stage)) return `<div class="decide-cta"><span class="ink2">Решение ещё не записано. После записи сервис сам предложит план раскатки по блокам и задачу на удаление тоглов.</span><button class="btn primary" data-act="decide" data-id="${e.id}">Записать решение</button></div>`;
  return '<div class="empty">Решение принимается после сбора данных</div>';
}

function testBrief(e) {
  const row = e.results?.rows?.find((x) => !x.control);
  if (e.decision) return outcome(e);
  if (row && e.results.status !== 'invalid') return `${sgn(row.delta)} п.п. · ${row.verdict || (row.sig ? 'значимо' : 'незначимо')}`;
  if (e.stage === 'collecting' && e.lookAt && e.type !== 'holdout') return TODAY >= e.lookAt ? 'можно смотреть' : `смотреть с ${fmt(e.lookAt)} · выборка ${e.sample}%`;
  if (['enabling', 'rollout'].includes(e.stage)) return `${e.coverage} из ${ALL_BLOCKS.length} блоков`;
  return STAGE[e.stage].name;
}

function featureTabs(e) {
  const f = featureOf(e);
  if (f.tests.length < 2) return '';
  return `<div class="ftabs">${f.tests.map((t) => `<a href="#" class="ftab ${t.id === e.id ? 'on' : ''}" data-open="${t.id}" title="${esc(STAGE[t.stage].name)}">${stageDot(t.stage)}${esc(t.seg ? t.label : '№' + t.iter + ' ' + t.ver)}</a>`).join('')}</div>`;
}

const MON_N = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
function pastOf(f, exceptId) {
  const kindOf = (t) => (t.flags.includes('stopped') ? 'stop' : outcome(t).startsWith('Победил') || outcome(t).startsWith('Не хуже') ? 'win' : 'none');
  const fromTests = f.tests.filter((t) => t.stage === 'done' && t.id !== exceptId).map((t) => ({
    n: t.iter, it: '№' + t.iter + (t.seg ? ' · ' + t.seg : ''), theme: t.theme || '', what: `${t.seg ? 'АБ-тест: ' + t.seg : t.branch}, ${t.ver}`, when: `${MON_N[(t.d.enableStart || t.d.rolloutStart || t.d.created).getMonth()]} ${(t.d.enableStart || t.d.rolloutStart || t.d.created).getFullYear()}`,
    out: t.flags.includes('stopped') ? 'Остановлен: ошибка разметки' : outcome(t), kind: kindOf(t), id: t.id,
  }));
  return [...f.history, ...fromTests].sort((a, b) => a.n - b.n);
}
const HK = { win: 'good', none: 'info', stop: 'warn' };
const HCOLOR = { win: '#12a35d', none: '#cfccc3', stop: '#f2b300' };
const HNAME = { win: 'Победа', none: 'Нет эффекта', stop: 'Остановлен' };

function histRow(h) {
  return `<div class="fhist" data-htext="${esc((h.it + ' ' + h.theme + ' ' + h.what + ' ' + h.out).toLowerCase())}"><span class="muted tnum">${esc(h.it)}</span><span>${h.id ? `<a href="#" data-open="${h.id}">${esc(h.what)}</a>` : esc(h.what)} <span class="muted small">· ${esc(h.theme ? h.theme + ' · ' : '')}${esc(h.when)}</span></span><span class="sev-label ${HK[h.kind]}">${esc(h.out)}</span></div>`;
}

function historyBlock(f, e) {
  const past = pastOf(f, e.id);
  if (!past.length) return '';
  if (past.length <= 8) return `<h3>Что уже пробовали</h3>${past.slice().reverse().map(histRow).join('')}`;
  const cnt = (k) => past.filter((h) => h.kind === k).length;
  const themes = [...new Set(past.map((h) => h.theme))];
  const cur = f.tests.filter((t) => t.stage !== 'done');
  const meta = FEATURE_META[f.id] || {};
  return `
    <h3>История: ${past.length} ${plural(past.length, 'итерация', 'итерации', 'итераций')}</h3>
    <div class="hist-sum">
      <span class="chip"><span class="dot" style="background:${HCOLOR.win}"></span>Побед ${cnt('win')}</span>
      <span class="chip"><span class="dot" style="background:${HCOLOR.none}"></span>Без эффекта ${cnt('none')}</span>
      <span class="chip"><span class="dot" style="background:${HCOLOR.stop}"></span>Остановлено ${cnt('stop')}</span>
      <span class="small muted">с ${esc(past[0].when)}</span>
    </div>
    <div class="hstrip">${past.map((h) => `<i style="background:${HCOLOR[h.kind]}" data-tip="<b>${esc(h.it)} · ${esc(h.theme)}</b><br>${esc(h.what)}<br>${esc(h.when)} · ${esc(h.out)}"></i>`).join('')}${cur.map((t) => `<i class="now" data-tip="<b>№${t.iter} · сейчас</b><br>${esc(t.branch)}"></i>`).join('')}</div>
    <div class="hist-ends"><span>${esc(past[0].it)}</span><span>${cur.length ? '№' + cur[cur.length - 1].iter + ' — сейчас' : esc(past[past.length - 1].it)}</span></div>
    ${meta.prod ? `<div class="note good small mt-16">${esc(meta.prod)}</div>` : ''}
    <div class="tbl-inset"><table class="t"><thead><tr><th>Тема</th><th class="num">Тестов</th><th>Итоги по порядку</th><th>Последний</th></tr></thead><tbody>
      ${themes.map((th) => { const L = past.filter((h) => h.theme === th); const last = L[L.length - 1]; const isCur = e.theme === th && e.stage !== 'done';
        return `<tr class="${isCur ? 'hl' : ''}"><td><b>${esc(th)}</b>${isCur ? '<div class="small c-accent">тема текущего теста</div>' : ''}</td><td class="num">${L.length}</td>
        <td><span class="hstrip sm">${L.map((h) => `<i style="background:${HCOLOR[h.kind]}" data-tip="<b>${esc(h.it)}</b> ${esc(h.what)}<br>${esc(h.out)}"></i>`).join('')}</span></td>
        <td class="small nowrap"><span class="muted">${esc(last.it)}</span> <span class="sev-label ${HK[last.kind]}">${esc(last.out)}</span></td></tr>`; }).join('')}
    </tbody></table></div>
    <details class="hall"><summary>Все ${past.length} ${plural(past.length, 'итерация', 'итерации', 'итераций')}</summary>
      <div class="search">${ICON.search}<input data-hsearch placeholder="Поиск по истории: тема, текст, номер…"></div>
      <div>${past.slice().reverse().map(histRow).join('')}</div>
    </details>`;
}

/* ---------- задачи: одно дело — одна строка ---------- */
const TASK = {
  nodecision: 'Записать решение', overdue: 'Разобрать результаты', toggles: 'Удалить тоглы', stuck: 'Запланировать шаг',
  needsd: 'Создать SD-заявку', draft: 'Архивировать черновик', cross: 'Проверить пересечения', nometric: 'Заполнить метрику',
  blocker: 'Снять блокер', slow: 'Продлить тест', pilot: 'Решить по пилоту', postcheck: 'Проверить метрики',
  canlook: 'Посмотреть результаты', upcoming: 'Результаты', holdout: 'Срез холдаута', nextstep: 'Шаг включения',
  release: 'Старт АБ', similar: 'Тему уже проверяли',
};

function shortOf(a) {
  const e = a.e;
  switch (a.rule) {
    case 'nodecision': return `тест завершён ${fmt(e.d.platformEnd)}`;
    case 'overdue': return `+${dn(days(e.planEnd, TODAY))} сверх плана`;
    case 'toggles': { const n = e.toggles.filter((x) => x.st === 'todo').length; return `${n} ${plural(n, 'тогл', 'тогла', 'тоглов')}, раскатано ${fmt(e.d.rolloutDoneAt)}`; }
    case 'stuck': return `${e.coverage}/${ALL_BLOCKS.length} блоков, дальше не запланировано`;
    case 'needsd': case 'nextstep': return `${blockList(e.nextPlan.blocks)} · ${rel(e.nextPlan.d)}`;
    case 'draft': return `висит с ${fmt(e.d.created)}`;
    case 'cross': return `${e.cross.mixed}% выборки в других тестах`;
    case 'nometric': return 'без неё не посчитать срок';
    case 'blocker': return e.blockers;
    case 'slow': return `100 % выборки к ${fmt(e.lookAt)}, план ${fmt(e.planEnd)}`;
    case 'pilot': return `пилот с ${e.pilot.since.slice(0, 5)}`;
    case 'postcheck': return e.check.what;
    case 'canlook': return 'срок и выборка набраны';
    case 'upcoming': return `с ${fmt(e.lookAt)} · выборка ${e.sample}%`;
    case 'holdout': return `${fmt(D(e.holdout.next))}`;
    case 'release': return `${fmt(e.d.plannedStart)}, после релиза ${e.release}`;
    case 'similar': return `«${e.theme}»`;
    default: return '';
  }
}

function ageOf(a) {
  const d = a.due; if (!d) return '';
  if (d <= TODAY) { const n = days(d, TODAY); return n === 0 ? 'сегодня' : `${n} дн.`; }
  const n = days(TODAY, d); return n === 1 ? 'завтра' : fmt(d);
}

/* Склейка: по тестам одной фичи с одним правилом — одна строка; по одному тесту — одна строка с «+N» */
function buildTasks(filter = () => true) {
  const ent = new Map();
  mergedAlerts().filter(filter).forEach((a) => { const k = a.group ? a.e.fid : a.e.id; if (!ent.has(k)) ent.set(k, []); ent.get(k).push(a); });
  const now = []; const later = [];
  ent.forEach((list) => {
    list.sort((x, y) => SEV_ORDER[x.sev] - SEV_ORDER[y.sev]);
    const act = list.filter((a) => a.sev !== 'info');
    const inf = list.filter((a) => a.sev === 'info');
    if (act.length) now.push({ main: act[0], extra: [...act.slice(1), ...inf] });
    else later.push({ main: inf[0], extra: inf.slice(1) });
  });
  const dueKey = (t) => (t.main.due ? t.main.due.getTime() : 9e15);
  now.sort((a, b) => SEV_ORDER[a.main.sev] - SEV_ORDER[b.main.sev] || dueKey(a) - dueKey(b));
  later.sort((a, b) => dueKey(a) - dueKey(b));
  return { now, later };
}

function taskRow(t, { noObj = false } = {}) {
  const a = t.main; const e = a.e; const G = a.group;
  const obj = G ? `${e.feature} · ${G.length} ${plural(G.length, 'тест', 'теста', 'тестов')}` : e.short;
  const tip = t.extra.map((x) => esc(x.title)).join('<br>');
  return `<div class="task ${a.sev}">
    ${sevIcon(a.sev)}
    <div class="task-main">
      <div class="task-line"><b>${esc(TASK[a.rule] || a.title)}</b>${noObj ? '' : `<a href="#" data-open="${e.id}" class="task-obj">${esc(obj)}</a>`}<span class="task-det">${esc(shortOf(a))}</span>${t.extra.length ? `<span class="chip task-extra" data-tip="${tip}">+${t.extra.length}</span>` : ''}</div>
      <div class="task-more">
        <div>${esc(a.title)}. ${esc(a.sub)}</div>
        ${G ? `<div class="task-sub">${G.map((x) => `<div><a href="#" data-open="${x.e.id}">${esc(x.e.label)}</a> — ${esc(a.same ? testBrief(x.e) : x.title)}</div>`).join('')}</div>` : ''}
        ${t.extra.length ? `<div class="task-sub">${t.extra.map((x) => `<div class="row">${sevIcon(x.sev)}${esc(x.title)}</div>`).join('')}</div>` : ''}
      </div>
    </div>
    ${noObj ? '<span></span>' : avatar(e.owner)}
    <span class="task-age">${ageOf(a)}</span>
    <button class="btn sm ghost task-snz" data-act="snooze" data-id="${e.id}">Позже</button>
    <button class="btn sm ${a.sev === 'crit' || a.sev === 'good' ? 'primary' : ''}" data-act="${a.act.k}" data-id="${e.id}">${esc(a.act.label)}</button>
  </div>`;
}

/* ---------- паспорт: шапка + вкладки ---------- */
function featureSection(e) {
  const f = featureOf(e);
  const past = pastOf(f, e.id);
  const work = f.tests.filter((t) => t.stage !== 'done');
  if (work.length < 2 && !past.length) return '<div class="empty">У фичи одна итерация, истории нет</div>';
  return `${work.length > 1 ? `<div class="sec"><h3>Тесты фичи в работе<span class="sp"></span><span class="aside">${featureKind(f)}</span></h3>${work.map((t) => `<div class="ftest ${t.id === e.id ? 'cur' : ''}">
      <div class="row">${stageDot(t.stage)}<a href="#" data-open="${t.id}" class="link-ink ell b">${esc(t.label)}</a><span class="key ell">${t.key}</span></div>
      <span class="small ink2 nowrap ta-r">${STAGE[t.stage].name}</span>
      <div class="small ink2 brief">${esc(testBrief(t))}</div>
      <span class="small muted ta-r">${t.id === e.id ? 'открыт' : ''}</span>
    </div>`).join('')}</div>` : ''}
    ${past.length ? `<div class="sec">${historyBlock(f, e)}</div>` : ''}`;
}

function noAbSection(e) {
  const c = e.check || {};
  const due = e.d.rolloutDoneAt && c.days ? addDays(e.d.rolloutDoneAt, c.days) : null;
  return `<div class="sec"><h3>Без АБ-теста</h3>
    <div class="kv">
      <dt>Почему без АБ</dt><dd>${esc(e.noAb || 'Не указано')}</dd>
      ${e.pilot ? `<dt>Пилот</dt><dd>${esc(e.pilot.group)} · с ${e.pilot.since}. ${esc(e.pilot.feedback)}</dd>` : ''}
      <dt>Значение</dt><dd><span class="mono">${esc(e.variants[0].v)}</span> — ${esc(e.variants[0].name)}</dd>
      ${c.what ? `<dt>Проверяем вместо АБ</dt><dd>${esc(c.what)}</dd>` : ''}

function passportHTML(e, tab = 'overview') {

  const best = e.results?.rows?.find((x) => !x.control);

    ['Блоки', `${e.coverage} из ${ALL_BLOCKS.length}`, e.nextPlan ? `дальше ${fmt(e.nextPlan.d)}` : e.onCount === ALL_BLOCKS.length ? 'включено на всех' : e.stage === 'release' ? 'до раскатки' : ''],
    ['Итог', e.decision || e.type === 'rollout' ? outcome(e) : best && e.results.status !== 'invalid' ? `${sgn(best.delta)} п.п.` : 'пока нет', e.decision ? `решение ${e.decision.d.slice(0, 5)}` : best && !e.decision ? (best.sig ? 'значимо' : 'незначимо') : ''],

        <div class="kv mt">
          <dt>На всех блоках с</dt><dd>${fmt(e.d.fullAt, true)} · ${dn(e.dayN)}</dd>

          <dt>План окончания</dt><dd>${fmt(e.planEnd, true)}${e.d.platformEnd ? `, завершён ${fmt(e.d.platformEnd, true)}` : ''}</dd>
        </div></div>` : ''}
      <div class="sec"><h3>${e.type === 'rollout' ? 'Описание' : 'Гипотеза'}</h3>
        <p class="lead-text">${esc(e.hypothesis)}</p>
        <div class="kv mt">
          ${e.type === 'rollout' ? '' : `<dt>Целевая метрика</dt><dd>${e.metric ? esc(e.metric) : '<span class="sev-label warn">Не заполнена</span>'}</dd>`}
          ${e.metric2 ? `<dt>Доп. метрика</dt><dd>${esc(e.metric2)}</dd>` : ''}
          ${e.blockers ? `<dt>Блокер</dt><dd><span class="sev-label warn">${esc(e.blockers)}</span></dd>` : ''}
          ${e.type === 'rollout' ? '' : `<dt>Имя по конвенции</dt><dd class="name-row"><span class="mono">${esc(e.name)}</span><button class="btn ghost sm icon" data-copy="${esc(e.name)}" title="Скопировать" aria-label="Скопировать имя">${ICON.copy}</button></dd>`}
        </div></div>
      ${e.type === 'rollout' ? '' : `<div class="sec"><h3>Варианты и сплит</h3>${splitBar(e)}</div>`}`;
  } else if (tab === 'results') {
    body = `
      ${e.results ? `<div class="sec"><h3>Результаты <span class="sp"></span>${e.results.status === 'ready' ? '<span class="sev-label serious">Не разобраны</span>' : e.results.status === 'invalid' ? '<span class="sev-label crit">Невалидны</span>' : '<span class="sev-label good">Разобраны</span>'}</h3>
        ${e.metric ? `<p class="sec-sub">${esc(e.metric)}</p>` : ''}
        ${forest(e)}
        <p class="note small mt-16">${esc(e.results.note)}</p></div>`
      : `<div class="sec"><div class="empty">Результатов пока нет${e.lookAt ? `. Можно смотреть с ${fmt(e.lookAt, true)}` : ''}</div></div>`}
      <div class="sec"><h3>Решение</h3>${decisionBlock(e)}</div>
      <div class="sec"><h3>Пересечения с другими АБ-тестами</h3>${crossBlock(e)}</div>`;
  } else if (tab === 'blocks') {
    body = `
      <div class="sec"><h3>Где включено <span class="sp"></span><span class="aside">${e.coverage} из ${ALL_BLOCKS.length}</span></h3>

    <h2>${esc(e.feature)} <span class="muted">№${e.iter}${e.seg ? ' · ' + esc(e.seg) : ''}</span></h2>

      <a href="#" data-act="link">Тираж ${ICON.ext}</a>

    ${featureTabs(e)}

    <div class="ptabs">${tabs.map(([k, n]) => `<button class="${k === tab ? 'on' : ''}" data-ptab="${k}" data-id="${e.id}">${n}${k === 'history' ? ` <span class="cnt">${past.length + f.tests.filter((t) => t.stage !== 'done' && t.id !== e.id).length}</span>` : ''}</button>`).join('')}</div>

let passportReturn = null;
function openPassport(id, tab = 'overview') {
  const e = EX[id]; if (!e) return;
  const dr = $('#drawer');
  if (!dr.classList.contains('open')) passportReturn = document.activeElement;
  const wasInside = dr.contains(document.activeElement);
  dr.innerHTML = passportHTML(e, tab);
  dr.classList.add('open');
  $('#scrim').classList.add('open');
  dr.querySelector('.drawer-body').scrollTop = 0;
  (wasInside && dr.querySelector(`[data-ptab="${tab}"]`) || dr.querySelector('[data-close]')).focus({ preventScroll: true });
}
function closePassport() {
  const dr = $('#drawer');

  dr.classList.remove('open'); $('#scrim').classList.remove('open');

  passportReturn = null;
}

function rolloutPlan(start) {
  const steps = [['ГФ'], ['12', '9', '8', '7'], ['6', '5', '4'], ['3', '2', '1'], ['SI1', 'SI2', 'SI3', 'SI4']];
  let d = start; const out = [];
  for (const s of steps) {
    while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1);
    out.push({ d, b: s }); d = addDays(d, 1);
  }
  return out;
}

function decideOne(e) {
  const plan = rolloutPlan(addDays(TODAY, 1));
  const best = e.results?.rows?.filter((r) => !r.control && r.sig).sort((a, b) => (e.results.direction === 'down' ? a.delta - b.delta : b.delta - a.delta))[0];
  const ctrl = e.variants.find((v) => v.control);
  e.platform = 'Завершён';
  if (e.results) e.results.status = 'reviewed';
  if (!best && e.results?.rows) {
    e.decision = { d: fmt(TODAY, true), who: ME, winner: ctrl.v, text: 'Значимого эффекта нет — оставляем контроль. Рубильник отправлен в очередь на удаление.' };
    e.stage = 'cleanup'; e.dates.rolloutDoneAt = fmt(TODAY, true);
    e.events.push({ d: fmt(TODAY, true), t: 'decision', txt: `Решение: оставляем контроль ${ctrl.v}` });
    prepare(e); return `${e.label}: контроль`;
  }
  const winner = (best && best.v) || e.variants.find((v) => !v.control).v;
  e.decision = { d: fmt(TODAY, true), who: ME, winner, text: `Раскатываем ${winner} на всех. План раскатки создан автоматически.` };
  e.stage = 'rollout';
  e.events.push({ d: fmt(TODAY, true), t: 'decision', txt: `Решение: раскатываем ${winner}` });
  plan.forEach((p, i) => e.events.push({ d: fmt(p.d, true), t: 'plan', b: p.b, v: winner, txt: `План: включить ${winner}`, sd: i === 0 ? 'SD0002460' + (100 + Math.floor(Math.random() * 800)) : undefined }));
  prepare(e);
  return `${e.label}: раскатка ${winner}`;
}

function applyDecision(id) {

/* ---------- радар: все тесты на одном экране ----------
   Угол — стадия жизненного цикла (8 секторов по часовой стрелке от «Подготовки»).
   Расстояние до центра — срочность: в центре просроченное, снаружи — тесты без дел.
   Цвет отметки — важность самого срочного напоминания, полая отметка — дел нет. */
const RADAR_BANDS = [
  { name: 'Просрочено', r0: 34, r1: 94 },
  { name: 'Сделать', r0: 94, r1: 140 },
  { name: 'Скоро', r0: 140, r1: 174 },
  { name: 'Без дел', r0: 174, r1: 214 },
];
const radarBand = (e) => (e.topSev === 'crit' || e.topSev === 'serious' ? 0 : e.topSev === 'warn' || e.topSev === 'good' ? 1 : e.topSev === 'info' ? 2 : 3);
const RADAR_FILL = { crit: 'var(--crit)', serious: 'var(--serious)', warn: 'var(--warn)', good: 'var(--good)', info: 'var(--ink-2)' };
const polar = (a, r) => [+(r * Math.sin((a * Math.PI) / 180)).toFixed(2), +(-r * Math.cos((a * Math.PI) / 180)).toFixed(2)];

function radarSlots(n, a0, a1, r0, r1) {
  const A0 = a0 + 4, A1 = a1 - 4, span = ((A1 - A0) * Math.PI) / 180;
  const cap = (r) => Math.max(1, Math.floor((r * span) / 12.5));
  const rows = (k) => Array.from({ length: k }, (_, i) => (k === 1 ? (r0 + r1) / 2 : r0 + 9 + (i * (r1 - r0 - 18)) / (k - 1)));
  let k = 1;
  while (rows(k).reduce((s, r) => s + cap(r), 0) < n && k < 4) k++;
  const R = rows(k).reverse();
  const caps = R.map(cap);
  const total = caps.reduce((a, b) => a + b, 0);
  let left = n;
  const per = caps.map((c, i) => { const v = i === caps.length - 1 ? left : Math.min(left, Math.ceil((n * c) / total)); left -= v; return v; });
  const pts = [];
  R.forEach((r, i) => { for (let j = 0; j < per[i]; j++) pts.push({ a: A0 + ((j + 0.5) / per[i]) * (A1 - A0), r }); });
  return pts;
}

function radarSVG() {
  const R = 212;
  const groups = {};
  EXPERIMENTS.forEach((e) => { const k = `${STAGE[e.stage].i}|${radarBand(e)}`; (groups[k] = groups[k] || []).push(e); });
  const blips = [];
  Object.entries(groups).forEach(([k, list]) => {
    const [si, bi] = k.split('|').map(Number);
    const B = RADAR_BANDS[bi];
    list.sort((a, b) => SEV_ORDER[a.topSev || 'info'] - SEV_ORDER[b.topSev || 'info'] || a.id.localeCompare(b.id));
    radarSlots(list.length, si * 45, si * 45 + 45, B.r0, B.r1).forEach((p, i) => blips.push({ e: list[i], ...p, band: bi }));
  });
  const arc = (a0, a1, r) => { const [x0, y0] = polar(a0, r); const [x1, y1] = polar(a1, r); return `M${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}`; };
  const wedge = (a0, a1, r) => { const [x0, y0] = polar(a0, r); const [x1, y1] = polar(a1, r); return `M0 0L${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}Z`; };
  const counts = Object.fromEntries(STAGES.map((s) => [s.k, EXPERIMENTS.filter((e) => e.stage === s.k).length]));

  const labels = STAGES.map((s, i) => {
    const mid = i * 45 + 22.5;
    const [x, y] = polar(mid, R + 20);
    const anchor = Math.abs(x) < 12 ? 'middle' : x > 0 ? 'start' : 'end';
    const dy = y < -60 ? -2 : y > 60 ? 12 : 4;
    return `<text class="slab" x="${x}" y="${y + dy}" text-anchor="${anchor}">${s.name} <tspan class="scnt">${counts[s.k]}</tspan></text>`;
  }).join('');

  const tipOf = (b) => {
    const e = b.e; const a = e.alerts.find((x) => x.sev !== 'info') || e.alerts[0];
    return `<b>${esc(e.short)}</b> <span class='tmuted'>${e.tag}</span><br>${STAGE[e.stage].name}${a ? '<br>' + esc(a.title) : '<br><span class=\'tmuted\'>Дел нет</span>'}`;
  };

  return `<svg class="radar" viewBox="-340 -248 680 496" role="img" aria-label="Радар: ${EXPERIMENTS.length} тестов по стадиям жизненного цикла и срочности">
    <circle class="band-0" r="${RADAR_BANDS[0].r1}"/>
    ${RADAR_BANDS.map((b) => `<circle class="ring" r="${b.r1}"/>`).join('')}
    ${STAGES.map((s, i) => { const [x, y] = polar(i * 45, R); return `<line class="spoke" x1="0" y1="0" x2="${x}" y2="${y}"/>`; }).join('')}
    ${STAGES.map((s, i) => `<path class="arc" d="${arc(i * 45 + 1.4, i * 45 + 43.6, R + 5)}" stroke="${s.color}"/>`).join('')}
    <g class="sweep"><path d="${wedge(-34, 0, R)}" fill="var(--ink)" fill-opacity=".05"/><path d="${wedge(-12, 0, R)}" fill="var(--ink)" fill-opacity=".06"/><line x1="0" y1="0" x2="0" y2="${-R}" stroke="var(--ink)" stroke-width="1.5"/></g>
    <circle class="ring core" r="${RADAR_BANDS[0].r0}"/>
    <text class="core-t" y="-3" text-anchor="middle">СЕГОДНЯ</text>
    <text class="core-t" y="10" text-anchor="middle" style="font-weight:400">${fmt(TODAY)}</text>
    ${labels}
    ${blips.map((b) => {
      const [x, y] = polar(b.a, b.r); const s = b.e.topSev;
      const fill = s && b.band < 3 ? RADAR_FILL[s] : 'var(--paper)';
      const stroke = s && b.band < 3 ? 'var(--paper)' : 'var(--ink-2)';
      return `<g class="blip${s === 'crit' ? ' hot' : ''}" style="--d:${(0.15 + (b.a / 360) * 2.05).toFixed(2)}s" data-open="${b.e.id}" data-tip="${tipOf(b)}"${b.band < 3 ? ` tabindex="0" role="button" aria-label="${esc(b.e.short)}: ${esc((b.e.alerts.find((x) => x.sev !== 'info') || b.e.alerts[0]).title)}"` : ''}>
        ${s === 'crit' ? `<circle class="halo" cx="${x}" cy="${y}" r="5"/>` : ''}
        <circle cx="${x}" cy="${y}" r="${b.band === 0 ? 5.5 : b.band === 3 ? 4 : 4.75}" fill="${fill}" style="stroke:${stroke}"/></g>`;
    }).join('')}
  </svg>`;
}
